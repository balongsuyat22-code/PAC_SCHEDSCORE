<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Notifications</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/sgo_president.css">
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
                <button class="burger-menu" onclick="toggleSidebar()" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title">
                    <i class="fa-solid fa-bell" style="margin-right:8px;color:var(--gold)"></i>
                    Notifications
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-primary btn-sm" onclick="Modal.open('modal-broadcast')">
                    <i class="fa-solid fa-bullhorn"></i> Broadcast Announcement
                </button>
            </div>
        </div>

        <div class="content">
            <div class="page-header" style="margin-bottom:20px">
                <div>
                    <div class="page-title" style="font-size:22px">Alert Center</div>
                    <div class="page-sub">Upcoming matches, recent results, and broadcasts</div>
                </div>
            </div>

            <div class="grid-2" style="align-items:start">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fa-solid fa-calendar-days" style="margin-right:8px;opacity:.7"></i>
                            Upcoming Match Reminders
                        </div>
                    </div>
                    <div class="card-body" id="upcoming-notifs">
                        <div class="empty-state">
                            <div class="empty-text">Loading…</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fa-solid fa-trophy" style="margin-right:8px;opacity:.7"></i>
                            Recent Results
                        </div>
                    </div>
                    <div class="card-body" id="result-notifs">
                        <div class="empty-state">
                            <div class="empty-text">Loading…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-broadcast">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fa-solid fa-bullhorn" style="margin-right:8px;color:var(--gold)"></i>
                    Broadcast Announcement
                </div>
                <button class="modal-close" onclick="Modal.close('modal-broadcast')" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea id="bc-message" class="form-textarea"
                        placeholder="e.g. All Basketball matches on Friday moved to Main Gym due to weather."></textarea>
                </div>
                <p style="font-size:12px;color:var(--muted)">
                    This will notify deans/advisers, officers, and visitors watching the sport fest.
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-broadcast')">Cancel</button>
                <button class="btn btn-primary" onclick="sendBroadcast()">
                    <i class="fa-solid fa-paper-plane"></i> Send Announcement
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/sgo_president.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('notifications');
            NotifBell.init();
            await Promise.all([loadUpcoming(), loadResults()]);
        });

        async function loadUpcoming() {
            const res = await api('/matches?status=scheduled');
            const el = document.getElementById('upcoming-notifs');
            const items = (res.data || []).filter(m => m.dept_a_name || m.dept_b_name).slice(0, 10);
            if (!items.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-calendar-xmark" style="font-size:1.5rem;opacity:.4"></i></div>
                        <div class="empty-text">No upcoming matches</div>
                    </div>`;
                return;
            }
            el.innerHTML = items.map(m => `
        <div class="notif-item">
            <div class="notif-icon"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="notif-content">
                <strong>${m.dept_a_name || 'TBD'} vs ${m.dept_b_name || 'TBD'}</strong><br>
                ${m.sport_name} · ${formatDate(m.scheduled_date)} ${formatTime(m.scheduled_time)}
                · <i class="fa-solid fa-location-dot" style="opacity:.6"></i> ${m.venue_name || 'Venue TBD'}
            </div>
        </div>`).join('');
        }

        async function loadResults() {
            const res = await api('/reports/match-history');
            const el = document.getElementById('result-notifs');
            const items = (res.data || []).slice(0, 10);
            if (!items.length) {
                el.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-inbox" style="font-size:1.5rem;opacity:.4"></i></div>
                        <div class="empty-text">No results yet</div>
                    </div>`;
                return;
            }
            el.innerHTML = items.map(m => `
        <div class="notif-item">
            <div class="notif-icon"><i class="fa-solid fa-trophy"></i></div>
            <div class="notif-content">
                <strong>${m.winner_dept || '—'}</strong> won ${m.sport_name} vs
                ${m.winner_dept === m.team_a_dept ? m.team_b_dept : m.team_a_dept}
                (${m.final_score_display || '—'})<br>
                <span style="color:var(--muted)">${formatDate(m.completed_at)}</span>
            </div>
        </div>`).join('');
        }

        async function sendBroadcast() {
            const message = document.getElementById('bc-message').value.trim();
            if (!message) { Toast.show('Message cannot be empty', 'error'); return; }
            Toast.show('Announcement queued for broadcast: "' + message.slice(0, 60) + (message.length > 60 ? '…' : '') + '"', 'success');
            Modal.close('modal-broadcast');
            document.getElementById('bc-message').value = '';
        }
    </script>
</body>

</html>
