<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Game Assignment</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/sgo_president.css">
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
                <button class="burger-menu" onclick="toggleSidebar()" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title">
                    <i class="fa-solid fa-user-check" style="margin-right:8px;color:var(--gold)"></i>
                    Game Assignment
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="refresh()">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh
                </button>
            </div>
        </div>

        <div class="content">
            <div class="page-header" style="margin-bottom:20px">
                <div>
                    <div class="page-title" style="font-size:22px">Officer Assignments</div>
                    <div class="page-sub">Assign SGO officers as referees and balance workload</div>
                </div>
            </div>

            <div class="grid-2" style="align-items:start">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fa-solid fa-triangle-exclamation" style="color:var(--gold);margin-right:8px"></i>
                            Unassigned Matches
                        </div>
                    </div>
                    <div class="card-body" id="unassigned-list">
                        <div class="empty-state">
                            <div class="empty-text">Loading…</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fa-solid fa-chart-simple" style="color:var(--gold);margin-right:8px"></i>
                            Officer Workload
                        </div>
                    </div>
                    <div class="card-body" style="padding:0" id="officer-list"></div>
                </div>
            </div>

            <div class="card" style="margin-top:20px">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-list" style="margin-right:8px;opacity:.7"></i>
                        All Assignments
                    </div>
                </div>
                <div class="table-wrap">
                    <table id="assign-table">
                        <thead>
                            <tr>
                                <th>Match</th>
                                <th>Tournament</th>
                                <th>Date / Time</th>
                                <th>Venue</th>
                                <th>Officer</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="assign-body">
                            <tr>
                                <td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Loading…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Assign Modal -->
    <div class="modal-overlay" id="modal-assign">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="a-title">
                    <i class="fa-solid fa-user-plus" style="margin-right:8px;color:var(--gold)"></i>
                    Assign Officer
                </div>
                <button class="modal-close" onclick="Modal.close('modal-assign')" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="a-match-id">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa-solid fa-user-check" style="margin-right:4px"></i>
                        Officer / Referee
                    </label>
                    <select id="a-officer" class="form-select">
                        <option value="">Unassigned</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-assign')">Cancel</button>
                <button class="btn btn-primary" onclick="submitAssign()">
                    <i class="fa-solid fa-check"></i> Assign
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/sgo_president.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('assignment');
            NotifBell.init();
            await refresh();
        });

        async function refresh() {
            await Promise.all([loadOfficers(), loadMatches()]);
        }

        let officersCache = [];

        async function loadOfficers() {
            const res = await api('/matches/officers');
            officersCache = res.data || [];
            document.getElementById('a-officer').innerHTML = '<option value="">Unassigned</option>' +
                officersCache.map(o =>
                    `<option value="${o.id}">${o.first_name} ${o.last_name} (${o.active_assignments || 0} active)</option>`
                ).join('');

            const list = document.getElementById('officer-list');
            if (!officersCache.length) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-users" style="font-size:1.5rem;opacity:.4"></i></div>
                        <div class="empty-text">No SGO officers found</div>
                    </div>`;
                return;
            }
            list.innerHTML = officersCache.map(o => `
        <div class="lb-row">
            <div style="width:34px;height:34px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold)">${initials(o.first_name + ' ' + o.last_name)}</div>
            <div class="lb-dept">
                <div class="lb-dept-name">${o.first_name} ${o.last_name}</div>
                <div class="lb-dept-medals">${o.email || ''}</div>
            </div>
            <span class="badge ${o.active_assignments > 2 ? 'badge-orange' : 'badge-blue'}">${o.active_assignments || 0} active</span>
        </div>`).join('');
        }

        async function loadMatches() {
            const res = await api('/matches');
            const all = res.data || [];

            const unassigned = all.filter(m =>
                !m.referee_name && m.status !== 'completed' && m.status !== 'cancelled' && m.dept_a_name
            );
            const uEl = document.getElementById('unassigned-list');
            uEl.innerHTML = unassigned.length
                ? unassigned.map(m => `
        <div class="match-card">
            <div class="match-sport-icon">${sportIcon(m.sport_name)}</div>
            <div class="match-info">
                <div class="match-teams">${m.dept_a_name} vs ${m.dept_b_name}</div>
                <div class="match-meta">${m.tournament_name} · ${formatDate(m.scheduled_date)} ${formatTime(m.scheduled_time)}</div>
            </div>
            <button class="btn btn-primary btn-sm" onclick='openAssign(${m.id}, ${JSON.stringify((m.dept_a_name || "TBD") + " vs " + (m.dept_b_name || "TBD"))})'>
                <i class="fa-solid fa-user-plus"></i> Assign
            </button>
        </div>`).join('')
                : `<div class="empty-state">
                    <div class="empty-icon"><i class="fa-solid fa-circle-check" style="font-size:1.5rem;color:var(--green);opacity:.7"></i></div>
                    <div class="empty-text">All matches have officers assigned</div>
                   </div>`;

            const tbody = document.getElementById('assign-body');
            const assignable = all.filter(m => m.dept_a_name || m.dept_b_name);
            tbody.innerHTML = assignable.length
                ? assignable.map(m => `
        <tr>
            <td>
                <span style="margin-right:6px">${sportIcon(m.sport_name)}</span>
                ${m.dept_a_name || 'TBD'}
                <span style="color:var(--muted)"> vs </span>
                ${m.dept_b_name || 'TBD'}
            </td>
            <td style="color:var(--muted);font-size:12px">${m.tournament_name}</td>
            <td style="font-size:12px">${formatDate(m.scheduled_date)} ${formatTime(m.scheduled_time)}</td>
            <td style="font-size:12px;color:var(--muted)">
                ${m.venue_name ? `<i class="fa-solid fa-location-dot" style="margin-right:4px;opacity:.5"></i>${m.venue_name}` : '—'}
            </td>
            <td>${m.referee_name
                        ? `<span class="badge badge-green"><i class="fa-solid fa-user" style="margin-right:4px"></i>${m.referee_name}</span>`
                        : '<span class="badge badge-muted">Unassigned</span>'}</td>
            <td>
                <button class="btn btn-secondary btn-sm" onclick='openAssign(${m.id}, ${JSON.stringify((m.dept_a_name || "TBD") + " vs " + (m.dept_b_name || "TBD"))})'>
                    <i class="fa-solid fa-user-pen"></i> ${m.referee_name ? 'Reassign' : 'Assign'}
                </button>
            </td>
        </tr>`).join('')
                : `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">
                    <i class="fa-solid fa-inbox" style="font-size:1.5rem;opacity:.4;display:block;margin-bottom:8px"></i>
                    No matches yet
                   </td></tr>`;
        }

        function openAssign(matchId, label) {
            document.getElementById('a-title').innerHTML =
                `<i class="fa-solid fa-user-plus" style="margin-right:8px;color:var(--gold)"></i>
                 Assign Officer — ${label}`;
            document.getElementById('a-match-id').value = matchId;
            document.getElementById('a-officer').value = '';
            Modal.open('modal-assign');
        }

        async function submitAssign() {
            const matchId = document.getElementById('a-match-id').value;
            const referee_id = document.getElementById('a-officer').value || null;
            const res = await api(`/matches/${matchId}/schedule`, { method: 'PUT', body: { referee_id } });
            Toast.show(res.message || (res.success ? 'Officer assigned!' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) {
                Modal.close('modal-assign');
                refresh();
            }
        }
    </script>
</body>

</html>
