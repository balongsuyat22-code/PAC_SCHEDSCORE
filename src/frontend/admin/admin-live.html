<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Live Matches</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .live-hero {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 14px 20px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 10px;
        }

        .live-big-card {
            background: linear-gradient(135deg, #0D1F0D, #0A1A0A);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .live-big-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 50% 80% at 0% 50%, rgba(34, 197, 94, 0.06), transparent);
        }

        .live-team-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .live-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .live-team.right {
            align-items: flex-end;
        }

        .live-team-logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
        }

        .live-team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        .live-team-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .live-team-dept {
            font-size: 12px;
            color: var(--muted);
        }

        .live-score {
            text-align: center;
        }

        .live-score-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
        }

        .live-score-dash {
            font-size: 28px;
            color: var(--muted);
        }

        .live-meta {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--muted);
        }

        .pulse-ring {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.2s infinite;
            margin-right: 6px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: 0.6;
                transform: scale(1.15)
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div class="topbar-title">🔴 Live Matches</div>
            <div class="topbar-actions">
                <span style="font-size:12px;color:var(--muted)" id="refresh-timer">Auto-refreshing...</span>
                <button class="btn btn-secondary btn-sm" onclick="loadLive()">🔄 Refresh Now</button>
            </div>
        </div>
        <div class="content">
            <div class="live-hero">
                <span class="pulse-ring"></span>
                <span style="font-weight:700;font-size:14px">Live Scoreboard</span>
                <span style="color:var(--muted);font-size:13px">— auto-refreshes every 10 seconds</span>
                <span
                    style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--green)"
                    id="live-count-big">0 Live</span>
            </div>
            <div id="live-list"></div>
        </div>
    </main>
    <script src="../js/shared.js"></script>
    <script src="../js/admin-sidebar.js"></script>
    <script>
        let timer, countdown = 10;
        document.addEventListener('DOMContentLoaded', () => { renderSidebar('live'); loadLive(); startTimer(); });

        async function loadLive() {
            const res = await api('/matches/live');
            const el = document.getElementById('live-list');
            const count = res.data?.length || 0;
            document.getElementById('live-count-big').textContent = `${count} Live`;

            if (!count) {
                el.innerHTML = `<div class="empty-state" style="padding:80px"><div class="empty-icon" style="font-size:64px">😴</div><div class="empty-text" style="font-size:16px">No live matches right now</div><div style="color:var(--muted);font-size:13px;margin-top:8px">Check back when matches start</div></div>`;
                return;
            }

            const logos = Logos.load();
            el.innerHTML = res.data.map(m => {
                const logoA = buildLogo(m.participant_a_department_id, m.dept_a, m.dept_a_color, logos);
                const logoB = buildLogo(m.participant_b_department_id, m.dept_b, m.dept_b_color, logos);
                return `
      <div class="live-big-card">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px">
          <span class="pulse-ring"></span>LIVE · ${m.sport_name} · ${m.tournament_name}
        </div>
        <div class="live-team-row">
          <div class="live-team">
            <div class="live-team-logo" style="background:${m.dept_a_color || '#555'}">${logoA}</div>
            <div class="live-team-name">${m.team_a || m.dept_a}</div>
            <div class="live-team-dept">${m.dept_a}</div>
          </div>
          <div class="live-score">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="live-score-num">${m.live_score_a}</div>
              <div class="live-score-dash">–</div>
              <div class="live-score-num">${m.live_score_b}</div>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">LIVE SCORE</div>
          </div>
          <div class="live-team right">
            <div class="live-team-logo" style="background:${m.dept_b_color || '#555'}">${logoB}</div>
            <div class="live-team-name">${m.team_b || m.dept_b}</div>
            <div class="live-team-dept">${m.dept_b}</div>
          </div>
        </div>
        <div class="live-meta">
          ${m.venue_name ? `<span>📍 ${m.venue_name}</span>` : ''}
          ${m.started_at ? `<span>⏱ Started ${new Date(m.started_at).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}
        </div>
      </div>`;
            }).join('');
        }

        function buildLogo(deptId, deptName, color, logos) {
            const url = logos[deptId];
            const initials = (deptName || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            if (url) return `<img src="${url}" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
            return initials;
        }

        function startTimer() {
            timer = setInterval(() => {
                countdown--;
                document.getElementById('refresh-timer').textContent = `Refreshing in ${countdown}s`;
                if (countdown <= 0) { countdown = 10; loadLive(); }
            }, 1000);
        }
    </script>
</body>

</html>
