<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Grades & Strands</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .dept-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .dept-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
        }

        .dept-card-accent {
            height: 6px;
            width: 100%;
        }

        .dept-card-logo-area {
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .dept-logo-wrap {
            width: 88px;
            height: 88px;
            border-radius: 18px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .dept-logo-wrap:hover .logo-edit-overlay {
            opacity: 1;
        }

        .dept-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .dept-logo-initials {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .logo-edit-overlay {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
        }

        .dept-card-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dept-card-short {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: -8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dept-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--border);
        }

        .dept-stat {
            padding: 12px 8px;
            text-align: center;
            border-right: 1px solid var(--border);
        }

        .dept-stat:last-child {
            border-right: none;
        }

        .dept-stat-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
        }

        .dept-stat-lbl {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1px;
        }

        .dept-card-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        /* VS Matchup */
        .vs-section {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .vs-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: var(--muted);
        }

        .vs-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .vs-select {
            flex: 1;
            min-width: 160px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .vs-vs-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--muted);
        }

        .vs-display {
            display: none;
            background: var(--bg3);
            border-radius: 12px;
            padding: 24px;
            align-items: center;
            gap: 20px;
        }

        .vs-display.visible {
            display: flex;
        }

        .vs-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .vs-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            overflow: hidden;
        }

        .vs-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vs-dept-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
        }

        .vs-dept-pts {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
        }

        .vs-center {
            text-align: center;
            flex-shrink: 0;
        }

        .vs-vs-big {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: var(--muted);
            line-height: 1;
        }

        .vs-head2head {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }

        /* Upload area */
        .logo-upload-area {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 12px;
        }

        .logo-upload-area:hover {
            border-color: var(--border-gold);
            background: var(--gold-bg);
        }

        .logo-preview-large {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
        }

        .logo-preview-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div class="topbar-title">🎓 Grades & Strands</div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="loadPage()">🔄 Refresh</button>
                <button class="btn btn-primary btn-sm" onclick="openCreate()">+ New Grade / Strand</button>
            </div>
        </div>

        <div class="content">

            <div class="vs-section">
                <div class="vs-title">⚔️ Head-to-Head Comparison</div>
                <div class="vs-selector">
                    <select class="vs-select" id="vs-dept-a" onchange="updateVS()">
                        <option value="">Select Grade/Strand A...</option>
                    </select>
                    <div class="vs-vs-label">VS</div>
                    <select class="vs-select" id="vs-dept-b" onchange="updateVS()">
                        <option value="">Select Grade/Strand B...</option>
                    </select>
                </div>
                <div class="vs-display" id="vs-display">
                    <div class="vs-side" id="vs-side-a"></div>
                    <div class="vs-center">
                        <div class="vs-vs-big">VS</div>
                        <div class="vs-head2head" id="vs-h2h"></div>
                    </div>
                    <div class="vs-side" id="vs-side-b"></div>
                </div>
            </div>


            <div id="dept-grid" class="dept-grid">
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon">⏳</div>
                    <div class="empty-text">Loading Grades & Strands...</div>
                </div>
            </div>
        </div>
    </main>


    <div class="modal-overlay" id="modal-create-dept" onclick="if(event.target===this)Modal.close('modal-create-dept')">
        <div class="modal" style="max-width:520px">
            <div class="modal-header">
                <div class="modal-title" id="dept-modal-title">🎓 New Grade / Strand</div>
                <button class="modal-close" onclick="Modal.close('modal-create-dept')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="dept-edit-id">

                <div class="form-group">
                    <label class="form-label">Grade / Strand Logo</label>
                    <div class="logo-upload-area" onclick="document.getElementById('dept-logo-file').click()">
                        <div class="logo-preview-large" id="logo-preview-large">🎓</div>
                        <div style="font-size:13px;color:var(--muted)">Click to upload logo image</div>
                    </div>
                    <input type="file" id="dept-logo-file" accept="image/*" style="display:none"
                        onchange="handleLogoFile(this)">
                    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
                        <input type="url" id="dept-logo-url" class="form-input"
                            placeholder="Or paste image URL: https://...">
                        <button class="btn btn-secondary btn-sm" onclick="applyLogoUrl()">Preview</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="dept-name" class="form-input" placeholder="e.g. Grade 11 STEM">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Short Name</label>
                        <input type="text" id="dept-short" class="form-input" placeholder="e.g. G11 STEM">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Code *</label>
                        <input type="text" id="dept-code" class="form-input" placeholder="e.g. STEM">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Theme Color</label>
                        <input type="color" id="dept-color" class="form-input" value="#3B82F6"
                            style="height:44px;padding:6px">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="dept-desc" class="form-textarea" placeholder="Optional description..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-create-dept')">Cancel</button>
                <button class="btn btn-primary" id="dept-save-btn" onclick="saveDepartment()">Create
                    Grade/Strand</button>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="modal-dept-detail" onclick="if(event.target===this)Modal.close('modal-dept-detail')">
        <div class="modal" style="max-width:600px">
            <div class="modal-header">
                <div class="modal-title" id="detail-title">Grade / Strand Details</div>
                <button class="modal-close" onclick="Modal.close('modal-dept-detail')">✕</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-dept-detail')">Close</button>
                <button class="btn btn-primary" id="detail-edit-btn" onclick="">Edit</button>
            </div>
        </div>
    </div>

    <script src="../js/shared.js"></script>
    <script src="../js/admin-sidebar.js"></script>
    <script>
        let allDepts = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof renderSidebar === 'function') renderSidebar('departments');
            await loadPage();
        });

        async function loadPage() {
            const res = await api('/departments');
            if (!res.success) return;
            allDepts = res.data || [];
            renderGrid();
            populateVSSelects();
        }

        function renderGrid() {
            const el = document.getElementById('dept-grid');
            if (!allDepts.length) {
                el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🎓</div><div class="empty-text">No Grades/Strands yet. Create one above.</div></div>`;
                return;
            }
            el.innerHTML = allDepts.map(d => renderDeptCard(d)).join('');
        }

        function renderDeptCard(d) {
            const logo = buildLogoHtml(d, 88);
            return `
            <div class="dept-card">
              <div class="dept-card-accent" style="background:${d.color}"></div>
              <div class="dept-card-logo-area">
                <div class="dept-logo-wrap" onclick="openEdit(${d.id})" style="background:${d.color}20; border-color:${d.color}40">
                  ${logo}
                  <div class="logo-edit-overlay">✏️</div>
                </div>
                <div class="dept-card-name">${d.name}</div>
                <div class="dept-card-short">${d.short_name || d.code}</div>
              </div>
              <div class="dept-stats">
                <div class="dept-stat">
                  <div class="dept-stat-val" style="color:var(--gold)">${d.total_points || 0}</div>
                  <div class="dept-stat-lbl">Points</div>
                </div>
                <div class="dept-stat">
                  <div class="dept-stat-val">🥇${d.gold_medals || 0}</div>
                  <div class="dept-stat-lbl">Gold</div>
                </div>
                <div class="dept-stat">
                  <div class="dept-stat-val" style="color:var(--muted)">${d.total_members || 0}</div>
                  <div class="dept-stat-lbl">Members</div>
                </div>
              </div>
              <div class="dept-card-actions">
                <button class="btn btn-secondary btn-sm" style="flex:1" onclick="viewDetail(${d.id})">👁 View</button>
                <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEdit(${d.id})">✏️ Edit</button>
              </div>
            </div>`;
        }

        function buildLogoHtml(d, size = 88) {
            const url = d.logo_url;
            const initials = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            if (url) {
                return `<img src="${url}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="dept-logo-initials" style="background:${d.color};display:none">${initials}</div>`;
            }
            return `<div class="dept-logo-initials" style="background:${d.color}">${initials}</div>`;
        }

        function populateVSSelects() {
            const opts = allDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            document.getElementById('vs-dept-a').innerHTML = '<option value="">Select Grade/Strand A...</option>' + opts;
            document.getElementById('vs-dept-b').innerHTML = '<option value="">Select Grade/Strand B...</option>' + opts;
        }

        function updateVS() {
            const aId = parseInt(document.getElementById('vs-dept-a').value);
            const bId = parseInt(document.getElementById('vs-dept-b').value);
            const disp = document.getElementById('vs-display');
            if (!aId || !bId || aId === bId) { disp.classList.remove('visible'); return; }

            const a = allDepts.find(d => d.id === aId);
            const b = allDepts.find(d => d.id === bId);
            disp.classList.add('visible');
            document.getElementById('vs-side-a').innerHTML = renderVSSide(a);
            document.getElementById('vs-side-b').innerHTML = renderVSSide(b);
            document.getElementById('vs-h2h').innerHTML = `${a.gold_medals || 0}🥇 vs ${b.gold_medals || 0}🥇 gold medals`;
        }

        function renderVSSide(d) {
            const url = d.logo_url;
            const initials = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const logoHtml = url ? `<img src="${url}">` : `<span style="font-size:32px;font-weight:900">${initials}</span>`;
            return `
            <div class="vs-logo" style="background:${d.color}20;border:2px solid ${d.color}40">${logoHtml}</div>
            <div class="vs-dept-name" style="color:${d.color}">${d.name}</div>
            <div class="vs-dept-pts">${d.total_points || 0}</div>
            <div style="font-size:11px;color:var(--muted)">points</div>
            <div class="vs-dept-medals">🥇${d.gold_medals || 0} 🥈${d.silver_medals || 0} 🥉${d.bronze_medals || 0}</div>`;
        }

        async function viewDetail(id) {
            const d = allDepts.find(x => x.id === id);
            if (!d) return;
            document.getElementById('detail-title').textContent = d.name;
            document.getElementById('detail-edit-btn').onclick = () => { Modal.close('modal-dept-detail'); openEdit(id); };

            const [scoresRes, playersRes] = await Promise.all([
                api(`/departments/${id}/scores`),
                api(`/departments/${id}/players`)
            ]);

            const url = d.logo_url;
            const initials = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const logoHtml = url ? `<img src="${url}" style="width:100%;height:100%;object-fit:cover">` : `<span style="font-size:36px;color:#fff;font-weight:900">${initials}</span>`;

            document.getElementById('detail-body').innerHTML = `
            <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px">
              <div style="width:88px;height:88px;border-radius:18px;background:${d.color}20;border:2px solid ${d.color}40;display:flex;align-items:center;justify-content:center;overflow:hidden">${logoHtml}</div>
              <div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900">${d.name}</div>
                <div style="font-size:13px;color:var(--muted)">${d.short_name || d.code} · ${d.description || 'No description'}</div>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">
              ${[['Points', d.total_points || 0, 'var(--gold)'], ['Gold', d.gold_medals || 0, '#FFD700'], ['Silver', d.silver_medals || 0, '#C0C0C0'], ['Members', d.total_members || 0, 'var(--text)']].map(([l, v, c]) => `
                <div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center">
                  <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:${c}">${v}</div>
                  <div style="font-size:11px;color:var(--muted);text-transform:uppercase">${l}</div>
                </div>`).join('')}
            </div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:var(--muted);margin-bottom:10px">RECENT RESULTS</div>
            ${(scoresRes.data || []).slice(0, 5).map(s => `
                <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
                    <span>${s.medal === 'gold' ? '🥇' : s.medal === 'silver' ? '🥈' : '🥉'}</span>
                    <div style="flex:1"><div style="font-size:13px;font-weight:600">${s.tournament_name}</div><div style="font-size:11px;color:var(--muted)">${s.sport_name}</div></div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--gold)">+${s.sport_fest_points}</div>
                </div>`).join('') || 'No results yet'}
            `;
            Modal.open('modal-dept-detail');
        }

        function openCreate() {
            editingId = null;
            document.getElementById('dept-modal-title').textContent = '🎓 New Grade / Strand';
            document.getElementById('dept-save-btn').textContent = 'Create Grade/Strand';
            document.getElementById('dept-edit-id').value = '';
            document.getElementById('dept-name').value = '';
            document.getElementById('dept-short').value = '';
            document.getElementById('dept-code').value = '';
            document.getElementById('dept-color').value = '#3B82F6';
            document.getElementById('dept-desc').value = '';
            document.getElementById('dept-logo-url').value = '';
            document.getElementById('dept-logo-file').value = '';
            document.getElementById('logo-preview-large').innerHTML = '🎓';
            Modal.open('modal-create-dept');
        }

        function openEdit(id) {
            const d = allDepts.find(x => x.id === id);
            if (!d) return;
            editingId = id;
            document.getElementById('dept-modal-title').textContent = `✏️ Edit: ${d.name}`;
            document.getElementById('dept-save-btn').textContent = 'Save Changes';
            document.getElementById('dept-edit-id').value = id;
            document.getElementById('dept-name').value = d.name;
            document.getElementById('dept-short').value = d.short_name || '';
            document.getElementById('dept-code').value = d.code;
            document.getElementById('dept-color').value = d.color || '#3B82F6';
            document.getElementById('dept-desc').value = d.description || '';
            document.getElementById('dept-logo-url').value = d.logo_url || '';

            const prev = document.getElementById('logo-preview-large');
            if (d.logo_url) {
                prev.innerHTML = `<img src="${d.logo_url}" style="width:100%;height:100%;object-fit:cover">`;
            } else {
                const initials = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                prev.innerHTML = `<div style="width:100%;height:100%;border-radius:14px;background:${d.color};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff">${initials}</div>`;
            }
            Modal.open('modal-create-dept');
        }

        function handleLogoFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('logo-preview-large').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
            };
            reader.readAsDataURL(file);
        }

        function applyLogoUrl() {
            const url = document.getElementById('dept-logo-url').value.trim();
            if (!url) return;
            document.getElementById('logo-preview-large').innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='❌ Invalid URL'" style="width:100%;height:100%;object-fit:cover">`;
        }

        async function saveDepartment() {
            const name = document.getElementById('dept-name').value.trim();
            const code = document.getElementById('dept-code').value.trim();
            const short_name = document.getElementById('dept-short').value.trim();
            const color = document.getElementById('dept-color').value;
            const description = document.getElementById('dept-desc').value.trim();
            const logoUrl = document.getElementById('dept-logo-url').value.trim();

            if (!name || !code) { Toast.show('Full name and code are required', 'error'); return; }


            const formData = new FormData();
            formData.append('name', name);
            formData.append('code', code);
            formData.append('short_name', short_name);
            formData.append('color', color);
            formData.append('description', description);
            formData.append('logo_url', logoUrl);

            const fileInput = document.getElementById('dept-logo-file');
            if (fileInput.files[0]) {
                formData.append('logo', fileInput.files[0]);
            }

            let res;
            if (editingId) {
                res = await api(`/departments/${editingId}`, { method: 'PUT', body: formData });
            } else {
                res = await api('/departments', { method: 'POST', body: formData });
            }

            if (res.success) {
                Toast.show(res.message || 'Saved successfully!', 'success');
                Modal.closeAll();
                await loadPage();
            } else {
                Toast.show(res.message || 'Error saving', 'error');
            }
        }
    </script>
</body>

</html>
