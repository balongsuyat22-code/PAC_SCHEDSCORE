<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Matches — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/referee.css">

    <style>
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.18s;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
        }

        .tab-btn:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .tab-btn.active {
            background: var(--gold-bg);
            color: var(--gold);
            border-color: var(--border-gold);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 12px 18px;
            background: var(--bg3);
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: left;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--bg3);
        }

        tbody td {
            padding: 14px 18px;
            font-size: 14px;
            color: var(--text);
            vertical-align: middle;
        }

        .matchup-primary {
            font-weight: 700;
            font-size: 15px;
        }

        .matchup-vs {
            color: var(--muted);
            font-weight: 400;
            margin: 0 5px;
            font-size: 12px;
        }

        /* ── STAT STRIP ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }

        .stat-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            transition: border-color 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-gold);
        }

        .stat-card-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .stat-card-value {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 34px;
            font-weight: 900;
            line-height: 1;
        }

        .stat-card-sub {
            font-size: 12px;
            color: var(--text2);
            margin-top: 4px;
        }

        @media (max-width: 640px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">

            <div class="page-header"
                style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
                <div>
                    <div class="page-title">📋 My Assigned Matches</div>
                    <div class="page-sub">Manage and track your referee assignments.</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadMatches()">🔄 Refresh</button>
            </div>


            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-card-label">Total</div>
                    <div class="stat-card-value" id="stat-total" style="color:var(--text);">—</div>
                    <div class="stat-card-sub">Assignments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Ongoing</div>
                    <div class="stat-card-value" id="stat-ongoing" style="color:var(--green);">—</div>
                    <div class="stat-card-sub">Live now</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Scheduled</div>
                    <div class="stat-card-value" id="stat-scheduled" style="color:var(--gold);">—</div>
                    <div class="stat-card-sub">Upcoming</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Done</div>
                    <div class="stat-card-value" id="stat-done" style="color:var(--text2);">—</div>
                    <div class="stat-card-sub">Completed</div>
                </div>
            </div>


            <div class="tab-nav">
                <button id="tab-active" class="tab-btn active" onclick="switchTab('active')">Upcoming & Ongoing</button>
                <button id="tab-done" class="tab-btn" onclick="switchTab('done')">Completed</button>
            </div>


            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Sport</th>
                                <th>Matchup</th>
                                <th>Date & Time</th>
                                <th>Venue</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="matches-body">
                            <tr>
                                <td colspan="6" style="text-align:center; padding:50px; color:var(--muted);">
                                    <div style="font-size:26px; margin-bottom:10px;">⏳</div>Loading assignments...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/shared.js"></script>
    <script src="../js/referee-sidebar.js"></script>
    <script>
        let allAssignedMatches = [];
        let currentTab = 'active';

        document.addEventListener('DOMContentLoaded', async () => {
            renderRefereeSidebar('matches');
            renderRefereeTopbar();
            await loadMatches();
        });

        async function loadMatches() {
            const user = Auth.getUser();
            if (!user) return;
            try {
                const res = await api(`/matches?referee_id=${user.id}`);
                allAssignedMatches = res.data || [];
            } catch (e) {
                allAssignedMatches = [];
            }
            renderStats();
            renderMatchTable();
        }

        function renderStats() {
            const d = allAssignedMatches;
            document.getElementById('stat-total').textContent = d.length;
            document.getElementById('stat-ongoing').textContent = d.filter(m => m.status === 'ongoing').length;
            document.getElementById('stat-scheduled').textContent = d.filter(m => m.status === 'scheduled').length;
            document.getElementById('stat-done').textContent = d.filter(m => m.status === 'completed').length;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-active').classList.toggle('active', tab === 'active');
            document.getElementById('tab-done').classList.toggle('active', tab === 'done');
            renderMatchTable();
        }

        function renderMatchTable() {
            const tbody = document.getElementById('matches-body');
            const filtered = allAssignedMatches.filter(m =>
                currentTab === 'active' ? m.status !== 'completed' : m.status === 'completed'
            );

            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:50px; color:var(--muted);">
                    <div style="font-size:28px; margin-bottom:10px;">📋</div>No matches found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(m => {
                const teamA = m.team_a_name || m.dept_a_name || 'TBD';
                const teamB = m.team_b_name || m.dept_b_name || 'TBD';
                const actionBtn = ['scheduled', 'ongoing'].includes(m.status)
                    ? `<a href="scoring.html?id=${m.id}" class="btn btn-primary btn-sm">Score ⚡</a>`
                    : `<a href="scoring.html?id=${m.id}" class="btn btn-secondary btn-sm">Review 📜</a>`;
                return `
                    <tr>
                        <td>${sportIcon(m.sport_name)} ${m.sport_name}</td>
                        <td>
                            <span class="matchup-primary">${teamA}</span>
                            <span class="matchup-vs">vs</span>
                            <span class="matchup-primary">${teamB}</span>
                        </td>
                        <td style="font-size:12px; color:var(--muted); white-space:nowrap;">
                            ${formatDate(m.scheduled_date)}<br>
                            <span style="color:var(--text2);">${formatTime(m.scheduled_time)}</span>
                        </td>
                        <td style="color:var(--text2);">${m.venue_name || 'TBD'}</td>
                        <td>${statusBadge(m.status)}</td>
                        <td>${actionBtn}</td>
                    </tr>`;
            }).join('');
        }
    </script>
</body>

</html>
