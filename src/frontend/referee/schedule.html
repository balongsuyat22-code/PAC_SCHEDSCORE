<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Schedule — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/referee.css">

    <style>
        .date-banner {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .date-banner-day {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
        }

        .date-banner-sub {
            font-size: 13px;
            color: var(--text2);
            margin-top: 2px;
        }

        .date-banner-clock {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }


        .timeline {
            position: relative;
            padding-left: 44px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--gold-bg), var(--border), transparent);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            animation: fadeUp 0.3s ease both;
        }

        .timeline-item:nth-child(1) {
            animation-delay: 0.05s;
        }

        .timeline-item:nth-child(2) {
            animation-delay: 0.10s;
        }

        .timeline-item:nth-child(3) {
            animation-delay: 0.15s;
        }

        .timeline-item:nth-child(4) {
            animation-delay: 0.20s;
        }

        .timeline-item:nth-child(5) {
            animation-delay: 0.25s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .timeline-dot {
            position: absolute;
            left: -36px;
            top: 16px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg);
            border: 3px solid var(--gold);
            z-index: 2;
            transition: box-shadow 0.2s;
        }

        .timeline-item:hover .timeline-dot {
            box-shadow: 0 0 0 5px rgba(245, 184, 0, 0.15);
        }

        .timeline-dot.dot-live {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.05);
            }
        }

        .timeline-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .timeline-card:hover {
            border-color: var(--border-gold);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .timeline-card.card-live {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .timeline-time {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .timeline-matchup {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
        }

        .timeline-vs {
            color: var(--muted);
            font-weight: 400;
            margin: 0 5px;
            font-size: 14px;
        }

        .timeline-meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .timeline-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-text {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">

            <div class="page-header"
                style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
                <div>
                    <div class="page-title">📅 Today's Timeline</div>
                    <div class="page-sub">Your match sequence for today.</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadSchedule()">🔄 Refresh</button>
            </div>


            <div class="date-banner">
                <div>
                    <div class="date-banner-day" id="today-label">—</div>
                    <div class="date-banner-sub">Today's schedule</div>
                </div>
                <div class="date-banner-clock" id="live-clock">00:00:00</div>
            </div>


            <div id="schedule-timeline" class="timeline">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <div class="empty-text">Loading schedule...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/shared.js"></script>
    <script src="../js/referee-sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderRefereeSidebar('schedule');
            renderRefereeTopbar();
            startClock();
            await loadSchedule();
        });

        function startClock() {
            const now = new Date();

            document.getElementById('today-label').textContent = now.toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });

            function tick() {
                document.getElementById('live-clock').textContent =
                    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
            tick();
            setInterval(tick, 1000);
        }

        async function loadSchedule() {
            const el = document.getElementById('schedule-timeline');
            el.innerHTML = `<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Loading schedule...</div></div>`;

            try {
                const res = await api('/schedules/today');
                if (!res.success || !res.data?.length) {
                    el.innerHTML = `<div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">No matches assigned for today.</div>
                    </div>`;
                    return;
                }

                el.innerHTML = res.data.map(m => {
                    const nameA = m.team_a_name || m.dept_a || 'TBD';
                    const nameB = m.team_b_name || m.dept_b || 'TBD';
                    const isLive = m.status === 'ongoing';
                    const dotCls = isLive ? 'dot-live' : '';
                    const cardCls = isLive ? 'card-live' : '';
                    const action = ['scheduled', 'ongoing'].includes(m.status)
                        ? `<a href="scoring.html?id=${m.id}" class="btn btn-primary btn-sm">Score ⚡</a>`
                        : `<a href="scoring.html?id=${m.id}" class="btn btn-secondary btn-sm">Review 📜</a>`;
                    return `
                        <div class="timeline-item">
                            <div class="timeline-dot ${dotCls}"></div>
                            <div class="timeline-card ${cardCls}">
                                <div class="timeline-time">${formatTime(m.scheduled_time)}</div>
                                <div class="timeline-matchup">
                                    ${nameA}<span class="timeline-vs">vs</span>${nameB}
                                </div>
                                <div class="timeline-meta">
                                    ${sportIcon(m.sport_name)} ${m.sport_name}
                                    &nbsp;·&nbsp; 📍 ${m.venue_name || 'TBD'}
                                </div>
                                <div class="timeline-footer">
                                    ${statusBadge(m.status)}
                                    ${action}
                                </div>
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                el.innerHTML = `<div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-text">Failed to load schedule. Please try again.</div>
                </div>`;
            }
        }
    </script>
</body>

</html>
