<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP · PAC SCHED-SCORE</title>
    <link rel="stylesheet" href="../css/player.css">
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .main-wrapper {
            flex: 1;
            margin-left: 220px;
            transition: margin-left .3s cubic-bezier(.4, 0, .2, 1);
            min-width: 0;
        }

        .main-wrapper.sidebar-collapsed {
            margin-left: 60px;
        }

        .mvp-hero {
            background: var(--bg2);
            border: 1px solid var(--gold-border);
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 28px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 28px;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-gold)
        }

        .mvp-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 55% 100% at 0% 50%, rgba(245, 184, 0, .07), transparent 70%);
            pointer-events: none
        }

        .mvp-hero::after {
            content: '👑';
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 80px;
            opacity: .06;
            pointer-events: none
        }

        .mvp-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            overflow: hidden;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 32px rgba(245, 184, 0, .2)
        }

        .mvp-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top
        }

        .mvp-info {
            position: relative;
            z-index: 1
        }

        .mvp-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px
        }

        .mvp-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            letter-spacing: 2px;
            margin-bottom: 4px
        }

        .mvp-sub {
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 16px
        }

        .mvp-stats {
            display: flex;
            gap: 14px;
            flex-wrap: wrap
        }

        .mvpstat {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            text-align: center;
            min-width: 64px
        }

        .mvpstat-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--gold)
        }

        .mvpstat-lbl {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .mvp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px
        }

        .mvpcard {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .mvpcard:hover {
            border-color: var(--gold-border);
            transform: translateY(-3px);
            box-shadow: var(--shadow-gold)
        }

        .mvpcard-header {
            padding: 16px;
            background: linear-gradient(135deg, rgba(245, 184, 0, 0.1), transparent);
            border-bottom: 1px solid var(--border);
        }

        .mvpcard-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            margin-bottom: 4px
        }

        .mvpcard-meta {
            font-size: 12px;
            color: var(--muted)
        }

        .mvpcard-body {
            padding: 16px
        }

        .mvpcard-stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .mvpcard-stat:last-child {
            border-bottom: none;
        }

        .mvpcard-stat-label {
            color: var(--muted);
            font-size: 12px
        }

        .mvpcard-stat-value {
            font-weight: 700;
            color: var(--gold)
        }

        .color-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        @media(max-width:900px) {
            .main-wrapper {
                margin-left: 0 !important
            }

            .page-content {
                padding: 20px 16px
            }

            .mvp-hero {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 20px
            }

            .mvp-photo {
                width: 80px;
                height: 80px;
                font-size: 32px
            }

            .mvp-name {
                font-size: 28px
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-wrapper" id="main-wrapper">
            <nav class="topbar" id="topbar"></nav>

            <main class="page-content">
                <div class="page-header">
                    <div class="page-header__titles">
                        <div class="page-header__eyebrow">SportFest 2025</div>
                        <h1 class="page-header__title">🏆 MVP Awards</h1>
                        <p class="page-header__subtitle">Most Valuable Players recognized this season</p>
                    </div>
                </div>

                <div id="mvp-container">
                    <div class="empty-state">
                        <div class="empty-state-icon">⭐</div>
                        <div>Loading MVPs...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/player.js"></script>
    <script src="../js/player-sidebar.js"></script>
    <script>
        async function loadMVPs() {
            const container = document.getElementById('mvp-container');

            try {
                // Try to get MVPs from the API
                const response = await apiFetch('/matches/mvps');

                if (response.success && response.data && response.data.length > 0) {
                    renderMVPs(response.data);
                } else {
                    // If API fails, try direct SQL through a different endpoint or show message
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏆</div>
                            <div>No MVP awards have been given yet.</div>
                            <div style="font-size: 12px; margin-top: 8px;">MVPs will appear here after matches are completed.</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading MVPs:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Unable to load MVP data</div>
                        <div style="font-size: 12px; margin-top: 8px;">Please try again later.</div>
                    </div>
                `;
            }
        }

        function renderMVPs(mvps) {
            const container = document.getElementById('mvp-container');

            // Get the top MVP for hero section
            const topMVP = mvps[0];
            const otherMVPs = mvps.slice(1);

            let html = '';

            // Hero section (top MVP)
            if (topMVP) {
                const awardDate = topMVP.awarded_at ? new Date(topMVP.awarded_at).toLocaleDateString('en-PH', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }) : 'Recently';

                html += `
                    <div class="mvp-hero">
                        <div class="mvp-photo">
                            ${topMVP.player_img ? `<img src="${topMVP.player_img}" alt="${escapeHtml(topMVP.player_name)}">` : '🏆'}
                        </div>
                        <div class="mvp-info">
                            <div class="mvp-label">🏆 TOP MVP · ${escapeHtml(topMVP.sport || 'Overall')}</div>
                            <div class="mvp-name">${escapeHtml(topMVP.player_name)}</div>
                            <div class="mvp-sub">
                                <span class="color-dot" style="background:${topMVP.dept_color || '#F5B800'}"></span>
                                ${escapeHtml(topMVP.dept_name || 'Department')}
                            </div>
                            <div class="mvp-stats">
                                <div class="mvpstat">
                                    <div class="mvpstat-val">${topMVP.score || '—'}</div>
                                    <div class="mvpstat-lbl">Total Score</div>
                                </div>
                                <div class="mvpstat">
                                    <div class="mvpstat-val">${awardDate}</div>
                                    <div class="mvpstat-lbl">Awarded</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Grid section (other MVPs)
            if (otherMVPs.length > 0) {
                html += `<div class="mvp-grid" style="margin-top: 24px;">`;
                html += otherMVPs.map(mvp => `
                    <div class="mvpcard">
                        <div class="mvpcard-header">
                            <div class="mvpcard-name">${escapeHtml(mvp.player_name)}</div>
                            <div class="mvpcard-meta">
                                <span class="color-dot" style="background:${mvp.dept_color || '#F5B800'}"></span>
                                ${escapeHtml(mvp.dept_name || 'Department')}
                            </div>
                        </div>
                        <div class="mvpcard-body">
                            <div class="mvpcard-stat">
                                <span class="mvpcard-stat-label">🏅 Sport</span>
                                <span class="mvpcard-stat-value">${escapeHtml(mvp.sport || 'Unknown')}</span>
                            </div>
                            <div class="mvpcard-stat">
                                <span class="mvpcard-stat-label">📊 Total Score</span>
                                <span class="mvpcard-stat-value">${mvp.score || '—'}</span>
                            </div>
                            ${mvp.notes ? `
                            <div class="mvpcard-stat">
                                <span class="mvpcard-stat-label">💬 Notes</span>
                                <span class="mvpcard-stat-value" style="font-size: 11px;">${escapeHtml(mvp.notes)}</span>
                            </div>
                            ` : ''}
                            <div class="mvpcard-stat">
                                <span class="mvpcard-stat-label">📅 Awarded</span>
                                <span class="mvpcard-stat-value">${mvp.awarded_at ? new Date(mvp.awarded_at).toLocaleDateString() : '—'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                html += `</div>`;
            } else if (!topMVP) {
                html = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏆</div>
                        <div>No MVP awards have been given yet.</div>
                        <div style="font-size: 12px; margin-top: 8px;">MVPs will appear here after matches are completed.</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function init() {
            if (typeof initPlayerLayout === 'function') {
                await initPlayerLayout('mvp');
            }
            await loadMVPs();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
