<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletes · PAC SCHED-SCORE</title>
    <link rel="stylesheet" href="../css/player.css">
    <style>
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .pcard {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .pcard:hover {
            border-color: var(--gold-border);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .pcard-img {
            height: 180px;
            background: linear-gradient(135deg, var(--bg3), var(--bg4));
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }

        .pcard-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.3s;
        }

        .pcard:hover .pcard-img img {
            transform: scale(1.05);
        }

        .pcard-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            color: var(--gold);
            border: 1px solid var(--gold-border);
        }

        .pcard-jersey {
            position: absolute;
            bottom: 12px;
            right: 12px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        .pcard-body {
            padding: 16px;
        }

        .pcard-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pcard-section {
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            display: inline-block;
        }

        .pcard-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pcard-stat {
            flex: 1;
            text-align: center;
        }

        .pcard-stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }

        .pcard-stat-label {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pcard-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .ptag {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 10px;
            font-weight: 700;
            background: var(--gold-dim);
            color: var(--gold);
            border: 1px solid var(--gold-border);
        }

        .ptag-sport {
            background: rgba(30, 136, 229, 0.1);
            color: var(--blue);
            border-color: rgba(30, 136, 229, 0.2);
        }

        .ptag-position {
            background: rgba(139, 92, 246, 0.1);
            color: var(--purple);
            border-color: rgba(139, 92, 246, 0.2);
        }


        .player-table {
            width: 100%;
            border-collapse: collapse;
        }

        .player-table th {
            text-align: left;
            padding: 14px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            vertical-align: middle;
        }

        .player-table tbody tr {
            transition: background 0.2s;
        }

        .player-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .td-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--bg3);
        }

        .td-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .td-avatar span {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
        }


        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .modal-info-item {
            background: var(--bg3);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
        }

        .modal-info-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .modal-info-value {
            font-size: 14px;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-approved {
            background: rgba(67, 160, 71, 0.15);
            color: var(--green);
            border: 1px solid rgba(67, 160, 71, 0.3);
        }

        .status-pending {
            background: rgba(245, 184, 0, 0.15);
            color: var(--gold);
            border: 1px solid rgba(245, 184, 0, 0.3);
        }

        .status-rejected {
            background: rgba(229, 57, 53, 0.15);
            color: var(--red);
            border: 1px solid rgba(229, 57, 53, 0.3);
        }


        @media (max-width: 768px) {
            .player-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 16px;
            }

            .modal-info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-wrapper" id="main-wrapper">
            <nav class="topbar" id="topbar">
                <input type="hidden" id="global-search" placeholder="Search athletes…" oninput="renderPlayers()">
            </nav>

            <main class="page-content">
                <div class="page-header">
                    <div class="page-header__titles">
                        <div class="page-header__eyebrow">SportFest 2025</div>
                        <h1 class="page-header__title">Athletes</h1>
                        <p class="page-header__subtitle">All registered players across sections and teams</p>
                    </div>
                    <div class="page-header__actions">
                        <a href="player-registration.html" class="btn btn-primary">＋ Register Athlete</a>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="scard sc-gold">
                        <div class="scard-icon">🏃</div>
                        <div class="scard-val" id="stat-players">0</div>
                        <div class="scard-lbl">Total Athletes</div>
                    </div>
                    <div class="scard sc-blue">
                        <div class="scard-icon">🏫</div>
                        <div class="scard-val" id="stat-sections">0</div>
                        <div class="scard-lbl">Sections</div>
                    </div>
                    <div class="scard sc-green">
                        <div class="scard-icon">👥</div>
                        <div class="scard-val" id="stat-teams">0</div>
                        <div class="scard-lbl">Teams</div>
                    </div>
                    <div class="scard sc-purple">
                        <div class="scard-icon">✅</div>
                        <div class="scard-val" id="stat-approved">0</div>
                        <div class="scard-lbl">Approved</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <select class="fsel" id="f-section" onchange="renderPlayers()">
                        <option value="">All Sections</option>
                    </select>
                    <select class="fsel" id="f-team" onchange="renderPlayers()">
                        <option value="">All Teams</option>
                    </select>
                    <select class="fsel" id="f-sport" onchange="renderPlayers()">
                        <option value="">All Sports</option>
                    </select>
                    <select class="fsel" id="f-status" onchange="renderPlayers()">
                        <option value="">All Status</option>
                        <option value="approved">✅ Approved</option>
                        <option value="pending">⏳ Pending</option>
                        <option value="rejected">❌ Rejected</option>
                    </select>
                    <span class="filter-badge on" id="f-view-card" onclick="setView('card',this)">◫ Cards</span>
                    <span class="filter-badge" id="f-view-grid" onclick="setView('table',this)">⊞ Table</span>
                </div>

                <div id="players-container"></div>
            </main>
        </div>
    </div>


    <div class="overlay" id="player-modal">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-head-bg"></div>
                <div class="modal-head-photo" id="modal-photo">🏃</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-name" id="modal-name">—</div>
                <div class="modal-meta" id="modal-meta"></div>
                <div class="modal-tags" id="modal-tags"></div>
                <div class="modal-divider"></div>
                <div class="modal-info-grid" id="modal-info-grid"></div>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn btn-ghost" onclick="closeModal()">Close Details</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/player.js"></script>
    <script src="../js/player-sidebar.js"></script>
    <script>
        let players = [];
        let currentView = 'card';

        async function init() {
            await initPlayerLayout('athletes');

            try {
                const res = await apiFetch('/users/players');
                if (res.success && res.data) {
                    players = res.data;
                    console.log('Players loaded:', players.length);
                }
            } catch (err) {
                console.error('Error loading players:', err);
                Toast.show('Error loading athletes data', 'err');
            }

            populateFilters();
            renderStats();
            renderPlayers();
        }

        function populateFilters() {
            const sections = [...new Set(players.map(p => p.department_name).filter(Boolean))];
            const teams = [...new Set(players.map(p => p.team_name).filter(Boolean))];
            const sports = [...new Set(players.map(p => p.sport_name).filter(Boolean))];

            const sectionEl = document.getElementById('f-section');
            const teamEl = document.getElementById('f-team');
            const sportEl = document.getElementById('f-sport');

            sections.forEach(s => sectionEl.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
            teams.forEach(t => teamEl.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
            sports.forEach(s => sportEl.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
        }

        function renderStats() {
            const total = players.length;
            const sections = [...new Set(players.map(p => p.department_id))].length;
            const teams = [...new Set(players.map(p => p.team_id).filter(Boolean))].length;
            const approved = players.filter(p => p.status === 'approved').length;

            document.getElementById('stat-players').textContent = total;
            document.getElementById('stat-sections').textContent = sections;
            document.getElementById('stat-teams').textContent = teams;
            document.getElementById('stat-approved').textContent = approved;
        }

        function getFiltered() {
            const section = document.getElementById('f-section').value;
            const team = document.getElementById('f-team').value;
            const sport = document.getElementById('f-sport').value;
            const status = document.getElementById('f-status').value;
            const search = document.querySelector('.topbar__search input')?.value.toLowerCase() || '';

            return players.filter(p => {
                if (section && p.department_name !== section) return false;
                if (team && p.team_name !== team) return false;
                if (sport && p.sport_name !== sport) return false;
                if (status && p.status !== status) return false;
                if (search && !`${p.first_name} ${p.last_name} ${p.department_name} ${p.team_name} ${p.sport_name || ''} ${p.position || ''}`.toLowerCase().includes(search)) return false;
                return true;
            });
        }

        function setView(v, btn) {
            currentView = v;
            document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('on'));
            btn.classList.add('on');
            renderPlayers();
        }

        function getStatusClass(status) {
            switch (status) {
                case 'approved': return 'status-approved';
                case 'pending': return 'status-pending';
                case 'rejected': return 'status-rejected';
                default: return '';
            }
        }

        function getStatusIcon(status) {
            switch (status) {
                case 'approved': return '✅';
                case 'pending': return '⏳';
                case 'rejected': return '❌';
                default: return '📋';
            }
        }

        function renderPlayers() {
            const data = getFiltered();
            const el = document.getElementById('players-container');
            if (!data.length) {
                el.innerHTML = `<div class="empty" style="text-align:center; padding: 60px; color:var(--muted);"><div style="font-size:56px;margin-bottom:16px;">👥</div><div class="empty-title">No athletes found</div><div class="empty-txt">Try adjusting your filters</div></div>`;
                return;
            }
            if (currentView === 'card') {
                el.innerHTML = `<div class="player-grid">${data.map((p, i) => playerCard(p, i)).join('')}</div>`;
            } else {
                el.innerHTML = playerTable(data);
            }
        }

        function playerCard(p, i) {
            const initial = (p.first_name?.[0] || '🏃').toUpperCase();
            const imgHtml = p.profile_picture ? `<img src="${p.profile_picture}" alt="${p.first_name}">` : initial;
            const statusClass = getStatusClass(p.status);
            const statusIcon = getStatusIcon(p.status);

            return `
                <div class="pcard fu" style="animation-delay:${i * 0.035}s" onclick="openPlayer(${p.id})">
                    <div class="pcard-img">
                        ${imgHtml}
                        <div class="pcard-badge ${statusClass}">${statusIcon} ${p.status || 'pending'}</div>
                        ${p.jersey_number ? `<div class="pcard-jersey">#${p.jersey_number}</div>` : ''}
                    </div>
                    <div class="pcard-body">
                        <div class="pcard-name">${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</div>
                        <div class="pcard-section">
                            <span class="section-dot"></span>
                            ${escapeHtml(p.department_name || '—')} · ${escapeHtml(p.team_name || 'Individual')}
                        </div>
                        <div class="pcard-stats">
                            <div class="pcard-stat">
                                <div class="pcard-stat-value">${p.jersey_number ? '#' + p.jersey_number : '—'}</div>
                                <div class="pcard-stat-label">Jersey</div>
                            </div>
                            <div class="pcard-stat">
                                <div class="pcard-stat-value">${p.position ? p.position.substring(0, 8) : '—'}</div>
                                <div class="pcard-stat-label">Position</div>
                            </div>
                            <div class="pcard-stat">
                                <div class="pcard-stat-value">${p.gender === 'Male' ? '♂' : p.gender === 'Female' ? '♀' : '—'}</div>
                                <div class="pcard-stat-label">Gender</div>
                            </div>
                        </div>
                        <div class="pcard-tags">
                            ${p.sport_name ? `<span class="ptag ptag-sport">🏆 ${escapeHtml(p.sport_name)}</span>` : ''}
                            ${p.position ? `<span class="ptag ptag-position">📍 ${escapeHtml(p.position)}</span>` : ''}
                        </div>
                    </div>
                </div>`;
        }

        function playerTable(data) {
            return `<div class="table-wrap"><div class="table-scroll">
            <table class="player-table">
                <thead>
                    <tr>
                        <th>Athlete</th>
                        <th>Section</th>
                        <th>Team</th>
                        <th>Jersey</th>
                        <th>Sport</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.map(p => {
                const statusClass = getStatusClass(p.status);
                const statusIcon = getStatusIcon(p.status);
                return `
                        <tr onclick="openPlayer(${p.id})">
                            <td>
                                <div style="display:flex;align-items:center;gap:12px">
                                    <div class="td-avatar">
                                        ${p.profile_picture ? `<img src="${p.profile_picture}">` : `<span>${(p.first_name?.[0] || '🏃').toUpperCase()}</span>`}
                                    </div>
                                    <div>
                                        <div style="font-weight:600">${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</div>
                                        ${p.position ? `<div style="font-size:11px;color:var(--muted)">${escapeHtml(p.position)}</div>` : ''}
                                    </div>
                                </div>
                            </td>
                            <td style="color:var(--text2)">${escapeHtml(p.department_name || '—')}</td>
                            <td style="font-weight:600">${escapeHtml(p.team_name || '—')}</td>
                            <td style="font-family:'Bebas Neue';font-size:18px;color:var(--gold)">${p.jersey_number ? '#' + p.jersey_number : '—'}</td>
                            <td style="color:var(--text2)">${escapeHtml(p.sport_name || '—')}</td>
                            <td><span class="status-badge ${statusClass}">${statusIcon} ${p.status || 'pending'}</span></td>
                        </tr>`;
            }).join('')}
                </tbody>
            </table>
            </div></div>`;
        }

        async function openPlayer(id) {

            let player = players.find(x => x.id === id);


            if (!player || !player.sport_name) {
                try {
                    const res = await apiFetch(`/players/user/${id}`);
                    if (res.success && res.data) {
                        player = { ...player, ...res.data };
                    }
                } catch (err) {
                    console.error('Error fetching player details:', err);
                }
            }

            if (!player) return;


            const photoEl = document.getElementById('modal-photo');
            photoEl.innerHTML = player.profile_picture ? `<img src="${player.profile_picture}">` : (player.first_name?.[0] || '🏃').toUpperCase();


            document.getElementById('modal-name').textContent = `${player.first_name || ''} ${player.last_name || ''}`.trim() || 'Unknown Athlete';


            document.getElementById('modal-meta').innerHTML = `
                <div><strong>Section:</strong> ${escapeHtml(player.department_name || '—')}</div>
                <div><strong>Team:</strong> ${escapeHtml(player.team_name || 'Individual')}</div>
                <div><strong>Status:</strong> <span class="status-badge ${getStatusClass(player.status)}">${getStatusIcon(player.status)} ${player.status || 'pending'}</span></div>
            `;


            document.getElementById('modal-tags').innerHTML = [
                player.jersey_number ? `<span class="modal-tag">#${player.jersey_number}</span>` : '',
                player.gender ? `<span class="modal-tag">${player.gender === 'Male' ? '♂ Male' : player.gender === 'Female' ? '♀ Female' : player.gender}</span>` : '',
                player.position ? `<span class="modal-tag">📍 ${escapeHtml(player.position)}</span>` : ''
            ].filter(Boolean).join('');


            document.getElementById('modal-info-grid').innerHTML = `
                <div class="modal-info-item">
                    <div class="modal-info-label">Sport</div>
                    <div class="modal-info-value">🏆 ${escapeHtml(player.sport_name || 'Not assigned')}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Jersey Number</div>
                    <div class="modal-info-value">${player.jersey_number ? '#' + player.jersey_number : 'Not assigned'}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Position</div>
                    <div class="modal-info-value">${escapeHtml(player.position || 'Not specified')}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Gender</div>
                    <div class="modal-info-value">${player.gender === 'Male' ? '♂ Male' : player.gender === 'Female' ? '♀ Female' : player.gender || 'Not specified'}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Email</div>
                    <div class="modal-info-value">${escapeHtml(player.email || 'Not available')}</div>
                </div>
                <div class="modal-info-item">
                    <div class="modal-info-label">Phone</div>
                    <div class="modal-info-value">${escapeHtml(player.phone || 'Not provided')}</div>
                </div>
            `;

            document.getElementById('player-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('player-modal').classList.remove('open');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
