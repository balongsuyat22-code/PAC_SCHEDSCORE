<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match History — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/referee.css">
    <style>
        .score-display {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            color: var(--gold);
            font-size: 17px;
            letter-spacing: 0.5px;
        }

        .score-sets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .set-pill {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .set-pill.won-a {
            border-color: rgba(34, 197, 94, 0.35);
            color: #4ade80;
        }

        .set-pill.won-b {
            border-color: rgba(59, 130, 246, 0.35);
            color: #60a5fa;
        }

        .sets-summary {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .matchup-a,
        .matchup-b {
            font-weight: 700;
        }

        .matchup-vs {
            color: var(--muted);
            font-weight: 400;
            margin: 0 6px;
            font-size: 12px;
        }

        .result-decided {
            color: var(--green);
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .result-draw {
            color: var(--muted);
            font-weight: 600;
            font-size: 13px;
        }

        .result-binary {
            color: var(--gold);
            font-weight: 700;
            font-size: 13px;
        }

        .ffa-match-row {
            background: linear-gradient(135deg, rgba(245, 184, 0, 0.04), rgba(139, 92, 246, 0.04));
            border-left: 3px solid var(--gold);
        }

        .ffa-match-row:hover {
            background: linear-gradient(135deg, rgba(245, 184, 0, 0.08), rgba(139, 92, 246, 0.06));
        }

        .ffa-participants-list {
            font-size: 12px;
            line-height: 1.5;
            margin-top: 6px;
        }

        .ffa-participant {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg3);
            padding: 2px 8px;
            border-radius: 12px;
            margin: 2px 4px 2px 0;
            font-size: 11px;
        }

        .ffa-participant.top-1 {
            background: rgba(255, 215, 0, 0.15);
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.35);
        }

        .ffa-participant.top-2 {
            background: rgba(192, 192, 192, 0.12);
            color: #C0C0C0;
            border: 1px solid rgba(192, 192, 192, 0.3);
        }

        .ffa-participant.top-3 {
            background: rgba(205, 127, 50, 0.12);
            color: #CD7F32;
            border: 1px solid rgba(205, 127, 50, 0.3);
        }

        .format-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-left: 6px;
        }

        .sport-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .hist-cards {
            display: none;
        }

        .hist-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .hist-card.ffa {
            border-left: 3px solid var(--gold);
        }

        .hc-date {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .hc-sport {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .hc-matchup {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.25;
        }

        .hc-score {
            margin-bottom: 8px;
        }

        .hc-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            margin-left: 8px;
        }

        .live-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            animation: livePulse 1.6s infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05);
            }
        }

        @media (max-width: 720px) {

            thead th:nth-child(2),
            tbody td:nth-child(2) {
                display: none;
            }

            .table-wrap {
                display: none;
            }

            .hist-cards {
                display: block;
            }

            .stats-row {
                display: grid !important;
                grid-template-columns: 1fr 1fr 1fr !important;
                gap: 8px !important;
            }

            .stat-card {
                padding: 10px !important;
            }

            .stat-card-value {
                font-size: 20px !important;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <div class="page-title">
                        <span class="title-icon"><svg viewBox="0 0 24 24">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                <path d="M3 3v5h5" />
                                <path d="M12 7v5l4 2" />
                            </svg></span>
                        Match History
                        <span class="live-pill" id="rt-live-pill" style="display:none">LIVE</span>
                    </div>
                    <div class="page-sub">Archive of all matches you have finalised · updates live</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadHistory()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                    Refresh
                </button>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-card-label">Total</div>
                    <div class="stat-card-value" id="stat-total" style="color:var(--text);">—</div>
                    <div class="stat-card-sub">Matches refereed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Decided</div>
                    <div class="stat-card-value" id="stat-decided" style="color:var(--green);">—</div>
                    <div class="stat-card-sub">Had a winner</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Draws</div>
                    <div class="stat-card-value" id="stat-draws" style="color:var(--gold);">—</div>
                    <div class="stat-card-sub">Tied result</div>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Sport</th>
                                <th>Matchup / Participants</th>
                                <th>Final Score / Results</th>
                                <th>Result</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <tr>
                                <td colspan="5">
                                    <div class="empty-state">
                                        <div class="empty-icon"><svg viewBox="0 0 24 24">
                                                <circle cx="12" cy="12" r="10" />
                                                <polyline points="12 6 12 12 16 14" />
                                            </svg></div>
                                        <div class="empty-text">Loading history...</div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="hist-cards" id="hist-cards"></div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script src="../../js/notification-engine.js"></script>
    <script src="../../js/referee-sidebar.js"></script>
    <script>
        let ffaDataCache = {};
        let _histReloadTimer = null;

        function fmtScore(n) {
            if (n == null || n === '') return '—';
            if (typeof n === 'string' && /[–-]/.test(n) && !/^[\d.+-]+$/.test(n.trim())) {
                return n.replace(/\d+\.?\d*/g, (tok) => fmtScore(tok));
            }
            const x = Number(n);
            if (!Number.isFinite(x)) return String(n);
            if (Number.isInteger(x) || Math.abs(x - Math.round(x)) < 1e-9) {
                return String(Math.round(x));
            }
            return x.toFixed(2).replace(/\.?0+$/, '');
        }

        function isFFAMatch(match) {
            const format = (match.tournament_format || '').toLowerCase();
            return format === 'free_for_all' ||
                format === 'team_ranking' ||
                match.bracket_side === 'ffa' ||
                match.bracket_position === 'FFA Event' ||
                (match.participant_a_department_id === null && match.participant_b_department_id === null);
        }

        function getScoringType(m) {
            return (m.scoring_type || 'points').toLowerCase();
        }

        async function loadFFAData(tournamentId) {
            if (ffaDataCache[tournamentId]) return ffaDataCache[tournamentId];
            try {
                const res = await api(`/tournaments/ffa-results/${tournamentId}`);
                if (res.success && res.data) {
                    const participants = res.data.participants || [];
                    const ffaScoring = res.data.ffa_scoring || 'points';
                    const lowerBetter = ffaScoring === 'time';
                    const withScores = participants.filter(p => p.ffa_result_value !== null && p.ffa_result_value !== undefined);
                    const withoutScores = participants.filter(p => p.ffa_result_value === null || p.ffa_result_value === undefined);
                    withScores.sort((a, b) => lowerBetter
                        ? a.ffa_result_value - b.ffa_result_value
                        : b.ffa_result_value - a.ffa_result_value);
                    ffaDataCache[tournamentId] = {
                        participants: [...withScores, ...withoutScores],
                        scoring: ffaScoring,
                        unit: ffaScoring === 'time' ? 's' : (ffaScoring === 'distance' ? 'm' : 'pts'),
                        lowerBetter
                    };
                    return ffaDataCache[tournamentId];
                }
            } catch (err) {
                console.error('Error loading FFA data:', err);
            }
            return null;
        }

        function formatMatchDate(dateString) {
            if (!dateString) return 'TBD';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTag(scoringType) {
            if (scoringType === 'sets') return '<span class="format-tag">Sets</span>';
            if (scoringType === 'binary') return '<span class="format-tag">Win/Loss</span>';
            if (scoringType === 'time') return '<span class="format-tag">Time</span>';
            return '';
        }

        function renderPointsScore(m) {
            const scoreA = m.total_score_a != null ? m.total_score_a : (m.final_score_a != null ? m.final_score_a : 0);
            const scoreB = m.total_score_b != null ? m.total_score_b : (m.final_score_b != null ? m.final_score_b : 0);
            return `<span class="score-display">${fmtScore(scoreA)} – ${fmtScore(scoreB)}</span>`;
        }

        function renderSetsScore(m) {
            const sets = m.set_scores || m.sets || [];
            if (Array.isArray(sets) && sets.length) {
                const pills = sets.map(s => {
                    const a = s.score_a ?? s.a ?? 0;
                    const b = s.score_b ?? s.b ?? 0;
                    const cls = a > b ? 'won-a' : (b > a ? 'won-b' : '');
                    const label = s.label || s.period_label || `S${s.period || s.set || ''}`;
                    return `<span class="set-pill ${cls}">${label}: ${fmtScore(a)}–${fmtScore(b)}</span>`;
                }).join('');
                const setsA = m.sets_won_a ?? sets.filter(s => (s.score_a ?? s.a) > (s.score_b ?? s.b)).length;
                const setsB = m.sets_won_b ?? sets.filter(s => (s.score_b ?? s.b) > (s.score_a ?? s.a)).length;
                return `
                    <div class="score-sets">${pills}</div>
                    <div class="sets-summary">${fmtScore(setsA)} – ${fmtScore(setsB)} sets</div>`;
            }

            const setsA = m.sets_won_a ?? m.total_score_a ?? '—';
            const setsB = m.sets_won_b ?? m.total_score_b ?? '—';
            return `<span class="score-display">${fmtScore(setsA)} – ${fmtScore(setsB)}</span><div class="sets-summary">sets</div>`;
        }

        function renderBinaryScore(m) {
            const teamA = m.team_a_name || m.dept_a_name || 'Team A';
            const teamB = m.team_b_name || m.dept_b_name || 'Team B';
            if (m.winner_department_id) {
                const winnerIsA = m.winner_department_id == m.participant_a_department_id ||
                    m.winner_side === 'a';
                const name = winnerIsA ? teamA : teamB;
                return `<span class="score-display" style="font-size:15px;">${escapeHtml(name)} won</span>`;
            }
            if (m.final_score_display) {
                return `<span class="score-display" style="font-size:14px;">${escapeHtml(fmtScore(m.final_score_display))}</span>`;
            }
            return `<span class="score-display" style="color:var(--muted);">—</span>`;
        }

        function renderResultCell(m, scoringType) {
            if (scoringType === 'binary') {
                if (m.winner_department_id || m.winner_side) {
                    return `<span class="result-binary">
                        <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        Decided
                    </span>`;
                }
                return `<span class="result-draw">No winner</span>`;
            }
            if (m.winner_department_id) {
                return `<span class="result-decided">
                    <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
                    Decided
                </span>`;
            }
            return `<span class="result-draw">Draw</span>`;
        }

        function renderRegularMatchRow(m) {
            const teamA = m.team_a_name || m.dept_a_name || 'TBD';
            const teamB = m.team_b_name || m.dept_b_name || 'TBD';
            const scoringType = getScoringType(m);

            let scoreHtml;
            if (scoringType === 'sets') scoreHtml = renderSetsScore(m);
            else if (scoringType === 'binary') scoreHtml = renderBinaryScore(m);
            else scoreHtml = renderPointsScore(m);

            return `
                <tr>
                    <td style="color:var(--muted); font-size:12px; white-space:nowrap;">${formatMatchDate(m.scheduled_date)}</td>
                    <td>
                        <div class="sport-cell">
                            ${escapeHtml(m.sport_name || 'Unknown')}
                            ${formatTag(scoringType)}
                        </div>
                    </td>
                    <td>
                        <span class="matchup-a">${escapeHtml(teamA)}</span>
                        <span class="matchup-vs">vs</span>
                        <span class="matchup-b">${escapeHtml(teamB)}</span>
                    </td>
                    <td>${scoreHtml}</td>
                    <td>${renderResultCell(m, scoringType)}</td>
                </tr>`;
        }

        function renderFFAMatchRow(m, ffaData) {
            const participants = ffaData?.participants || [];
            const unit = ffaData?.unit || 'pts';
            const isCompleted = m.status === 'completed';

            const topParticipants = participants.slice(0, 5);
            const remainingCount = Math.max(0, participants.length - 5);

            let participantsHtml = '';
            if (!participants.length) {
                participantsHtml = '<span style="color:var(--muted);">No participants data</span>';
            } else {
                participantsHtml = '<div class="ffa-participants-list">';
                topParticipants.forEach((p, idx) => {
                    const rank = idx + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = 'top-1';
                    else if (rank === 2) rankClass = 'top-2';
                    else if (rank === 3) rankClass = 'top-3';
                    const hasScore = p.ffa_result_value !== null && p.ffa_result_value !== undefined;
                    const scoreDisplay = hasScore ? `${fmtScore(p.ffa_result_value)}${unit}` : '—';
                    participantsHtml += `
                        <span class="ffa-participant ${rankClass}">
                            ${rank}. ${escapeHtml(p.department_name || p.team_name || 'Unknown')}: ${scoreDisplay}
                        </span>`;
                });
                if (remainingCount > 0) {
                    participantsHtml += `<span class="ffa-participant">+${remainingCount} more</span>`;
                }
                participantsHtml += '</div>';
            }

            const winner = participants[0];
            const winnerName = winner?.department_name || winner?.team_name || 'TBD';

            const resultHtml = isCompleted && winner
                ? `<span class="result-decided">Winner: ${escapeHtml(winnerName)}</span>`
                : `<span class="result-draw">${isCompleted ? 'Completed' : 'In Progress'}</span>`;

            const top3Html = topParticipants.slice(0, 3).map((p, idx) => {
                const score = (p.ffa_result_value != null) ? `${fmtScore(p.ffa_result_value)}${unit}` : '—';
                return `<div style="font-size:12px; margin-bottom:2px;">
                    <span style="color:var(--muted);">${idx + 1}.</span>
                    ${escapeHtml(p.department_name || p.team_name || 'Unknown')}:
                    <strong style="color:var(--gold);">${score}</strong>
                </div>`;
            }).join('');

            return `
                <tr class="ffa-match-row">
                    <td style="color:var(--muted); font-size:12px; white-space:nowrap;">${formatMatchDate(m.scheduled_date)}</td>
                    <td>
                        <div class="sport-cell">
                            ${escapeHtml(m.sport_name || 'Unknown')}
                            <span class="badge badge-ffa" style="margin-left:6px;">FFA</span>
                        </div>
                    </td>
                    <td>
                        <div>
                            <strong style="color:var(--gold);">${escapeHtml(m.tournament_name || 'Free-for-All Event')}</strong>
                            ${participantsHtml}
                            <div style="font-size:11px; color:var(--muted); margin-top:4px;">
                                ${participants.length} participants · ${isCompleted ? 'Final rankings' : 'In progress'}
                            </div>
                        </div>
                    </td>
                    <td>
                        <div>${top3Html || '—'}</div>
                        ${participants.length > 3 ? `<div style="font-size:11px; color:var(--muted); margin-top:4px;">+${participants.length - 3} more</div>` : ''}
                    </td>
                    <td>${resultHtml}</td>
                </tr>`;
        }

        function renderRegularCard(m) {
            const teamA = m.team_a_name || m.dept_a_name || 'TBD';
            const teamB = m.team_b_name || m.dept_b_name || 'TBD';
            const scoringType = getScoringType(m);
            let scoreHtml;
            if (scoringType === 'sets') scoreHtml = renderSetsScore(m);
            else if (scoringType === 'binary') scoreHtml = renderBinaryScore(m);
            else scoreHtml = renderPointsScore(m);
            return `
                <div class="hist-card">
                    <div class="hc-date">${formatMatchDate(m.scheduled_date)}</div>
                    <div class="hc-sport">${escapeHtml(m.sport_name || 'Sport')}${formatTag(scoringType)}</div>
                    <div class="hc-matchup">${escapeHtml(teamA)} vs ${escapeHtml(teamB)}</div>
                    <div class="hc-score">${scoreHtml}</div>
                    <div class="hc-footer">${renderResultCell(m, scoringType)}</div>
                </div>`;
        }

        async function loadHistory(opts = {}) {
            const user = Auth.getUser();
            if (!user) {
                window.location.href = '/login';
                return;
            }

            const tbody = document.getElementById('history-body');
            const cards = document.getElementById('hist-cards');
            if (!opts.silent) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                    <div class="empty-text">Loading history...</div>
                </div></td></tr>`;
                if (cards) cards.innerHTML = '';
            }

            try {
                const res = await api(`/matches?status=completed`);

                if (!res.success || !res.data?.length) {
                    const empty = `<div class="empty-state">
                        <div class="empty-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
                        <div class="empty-text">No completed matches available.</div>
                    </div>`;
                    tbody.innerHTML = `<tr><td colspan="5">${empty}</td></tr>`;
                    if (cards) cards.innerHTML = empty;
                    document.getElementById('stat-total').textContent = '0';
                    document.getElementById('stat-decided').textContent = '0';
                    document.getElementById('stat-draws').textContent = '0';
                    return;
                }

                const userMatches = res.data.filter(m =>
                    m.referee_id == user.id ||
                    m.referee_name === `${user.first_name} ${user.last_name}`
                );

                ffaDataCache = {};
                for (const match of userMatches) {
                    if (isFFAMatch(match) && match.tournament_id) {
                        await loadFFAData(match.tournament_id);
                    }
                }

                const decided = userMatches.filter(m => m.winner_department_id != null);
                const draws = userMatches.filter(m => m.winner_department_id == null);

                document.getElementById('stat-total').textContent = userMatches.length;
                document.getElementById('stat-decided').textContent = decided.length;
                document.getElementById('stat-draws').textContent = draws.length;

                if (!userMatches.length) {
                    const empty = `<div class="empty-state">
                        <div class="empty-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
                        <div class="empty-text">No completed matches assigned to you yet.</div>
                    </div>`;
                    tbody.innerHTML = `<tr><td colspan="5">${empty}</td></tr>`;
                    if (cards) cards.innerHTML = empty;
                    return;
                }

                let rowsHtml = '';
                let cardsHtml = '';
                for (const match of userMatches) {
                    if (isFFAMatch(match)) {
                        const ffaData = match.tournament_id ? ffaDataCache[match.tournament_id] : null;
                        rowsHtml += renderFFAMatchRow(match, ffaData);
                    } else {
                        rowsHtml += renderRegularMatchRow(match);
                        cardsHtml += renderRegularCard(match);
                    }
                }
                tbody.innerHTML = rowsHtml;
                if (cards) cards.innerHTML = cardsHtml;

            } catch (err) {
                console.error('Error loading history:', err);
                if (!opts.silent) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="color:#ef4444;">
                        Failed to load history. Please try again.
                    </div></td></tr>`;
                }
            }
        }

        function bindRealtime() {
            if (typeof Realtime === 'undefined') return;
            Realtime.connect().catch(() => { });

            const softReload = () => {
                clearTimeout(_histReloadTimer);
                _histReloadTimer = setTimeout(() => loadHistory({ silent: true }), 400);
            };

            // New finalised results show up here
            window.addEventListener('sf:match', (e) => {
                if (e.detail?.action === 'completed' || e.detail?.action === 'score') softReload();
            });
            window.addEventListener('sf:leaderboard', softReload);
            window.addEventListener('sf:ffa', softReload);

            const pill = document.getElementById('rt-live-pill');
            const syncPill = () => {
                if (!pill) return;
                pill.style.display = Realtime.connected ? 'inline-flex' : 'none';
            };
            syncPill();
            setInterval(syncPill, 2000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth('sgo_officer')) return;

            if (typeof renderRefereeSidebar === 'function') renderRefereeSidebar('history');
            if (typeof renderRefereeTopbar === 'function') await renderRefereeTopbar();
            await loadHistory();
            bindRealtime();
        });
    </script>
</body>

</html>
