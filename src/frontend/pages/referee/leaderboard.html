<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/referee.css">
    <style>
        .champions-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .champion-card {
            background: linear-gradient(135deg, rgba(245, 184, 0, 0.12), rgba(245, 184, 0, 0.03));
            border: 1px solid rgba(245, 184, 0, 0.35);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .champion-card.leader-only {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(59, 130, 246, 0.03));
            border-color: rgba(59, 130, 246, 0.35);
        }

        .champion-trophy {
            font-size: 28px;
            flex-shrink: 0;
        }

        .champion-info {
            flex: 1;
            min-width: 0;
        }

        .champion-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 2px;
        }

        .champion-card.leader-only .champion-label {
            color: #60a5fa;
        }

        .champion-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--text);
            line-height: 1.15;
        }

        .champion-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .champion-pts {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
            text-align: right;
        }

        .champion-pts-lbl {
            font-size: 10px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-align: right;
        }

        .division-block {
            max-width: 720px;
            margin: 0 auto 28px;
        }

        .division-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .division-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .division-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 100px;
            background: var(--gold-bg);
            color: var(--gold);
            border: 1px solid var(--border-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .podium-wrap {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 16px;
            padding: 16px 12px 0;
            flex-wrap: nowrap;
        }

        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(78px, 24vw, 120px);
            flex-shrink: 1;
            min-width: 0;
        }

        .podium-avatar {
            width: clamp(42px, 12vw, 60px);
            height: clamp(42px, 12vw, 60px);
            border-radius: 50%;
            border: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 900;
            background: var(--bg3);
            margin-bottom: 8px;
            color: var(--text);
            flex-shrink: 0;
        }

        .podium-1 .podium-avatar {
            border-color: #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.3);
            color: #ffd700;
        }

        .podium-2 .podium-avatar {
            border-color: #c0c0c0;
            color: #c0c0c0;
        }

        .podium-3 .podium-avatar {
            border-color: #cd7f32;
            color: #cd7f32;
        }

        .podium-bar {
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            color: #000;
            font-size: 16px;
        }

        .bar-1 {
            height: 96px;
            background: linear-gradient(to top, #e6a800, #ffd700);
            order: 2;
        }

        .bar-2 {
            height: 68px;
            background: linear-gradient(to top, #999, #d4d4d4);
            order: 1;
        }

        .bar-3 {
            height: 50px;
            background: linear-gradient(to top, #a05c1e, #d4894a);
            order: 3;
        }

        .podium-bar-pts {
            font-size: clamp(14px, 4vw, 20px);
            font-weight: 900;
        }

        .podium-bar-label {
            font-size: 10px;
            font-weight: 700;
            opacity: 0.7;
        }

        .podium-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-top: 8px;
            color: var(--text);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-section-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 4px 18px 10px;
        }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        .lb-row:last-child {
            border-bottom: none;
        }

        .lb-row:hover {
            background: var(--bg3);
        }

        .lb-row.top-3 {
            background: rgba(245, 184, 0, 0.04);
            border-left: 3px solid var(--gold);
        }

        .lb-row.champion-row {
            background: rgba(245, 184, 0, 0.08);
            border-left: 3px solid #ffd700;
        }

        .lb-rank {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 900;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            background: var(--bg3);
        }

        .lb-rank.rank-1 {
            color: #1a1400;
            background: linear-gradient(145deg, #ffe066, #ffd700);
        }

        .lb-rank.rank-2 {
            color: #1a1a1a;
            background: linear-gradient(145deg, #e6e6e6, #c0c0c0);
        }

        .lb-rank.rank-3 {
            color: #2a1400;
            background: linear-gradient(145deg, #e0a468, #cd7f32);
        }

        .lb-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .lb-dept {
            flex: 1;
            min-width: 0;
        }

        .lb-dept-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-dept-medals {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .medal-stat {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .lb-pts-block {
            text-align: right;
            flex-shrink: 0;
        }

        .lb-pts {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
        }

        .lb-pts-label {
            font-size: 10px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            margin-left: 8px;
        }

        .live-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            animation: livePulse 1.6s infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05);
            }
        }

        .empty-block {
            max-width: 720px;
            margin: 0 auto;
        }

        @media (max-width: 640px) {
            .content {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            .podium-wrap {
                gap: 8px;
                padding: 14px 6px 0;
            }

            .lb-row {
                padding: 11px 14px;
                gap: 9px;
            }

            .lb-dept-name {
                font-size: 14px;
            }

            .lb-pts {
                font-size: 19px;
            }

            .page-header {
                flex-direction: row !important;
                align-items: center !important;
                justify-content: space-between !important;
                gap: 8px;
            }

            .page-title {
                font-size: 18px !important;
            }

            .page-sub {
                display: none;
            }

            .champion-name {
                font-size: 17px;
            }

            .champion-pts {
                font-size: 22px;
            }
        }
    </style>
    <link rel="stylesheet" href="../../css/leaderboard-common.css">
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <div class="page-title">
                        <span class="title-icon"><svg viewBox="0 0 24 24">
                                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                                <path d="M4 22h16" />
                                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
                            </svg></span>
                        Leaderboard
                        <span class="live-pill" id="rt-live-pill" style="display:none">LIVE</span>
                    </div>
                    <div class="page-sub">Division standings · Senior &amp; Junior champions supported · updates live
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadLeaderboard()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                    Refresh
                </button>
            </div>

            <div id="champions-area" class="champions-row"></div>
            <div id="leaderboard-root"></div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script src="../../js/referee-sidebar.js"></script>
    <script>
        let _lbReloadTimer = null;
        let championIds = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof Auth !== 'undefined' && Auth.requireAuth && !Auth.requireAuth('sgo_officer')) return;
            renderRefereeSidebar('leaderboard');
            renderRefereeTopbar();
            await loadLeaderboard();
            bindRealtime();
        });

        function bindRealtime() {
            if (typeof Realtime === 'undefined') return;
            Realtime.connect().catch(() => { });

            const softReload = () => {
                clearTimeout(_lbReloadTimer);
                _lbReloadTimer = setTimeout(() => loadLeaderboard({ silent: true }), 400);
            };

            window.addEventListener('sf:leaderboard', softReload);
            window.addEventListener('sf:champion', softReload);
            window.addEventListener('sf:match', (e) => {
                if (e.detail?.action === 'completed') softReload();
            });

            const pill = document.getElementById('rt-live-pill');
            const syncPill = () => {
                if (!pill) return;
                pill.style.display = Realtime.connected ? 'inline-flex' : 'none';
            };
            syncPill();
            setInterval(syncPill, 2000);
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function normalizeDivision(div) {
            const d = String(div || '').trim().toLowerCase();
            if (!d) return 'Overall';
            if (d.includes('senior')) return 'Senior';
            if (d.includes('junior')) return 'Junior';
            // Title-case fallback
            return d.replace(/\b\w/g, c => c.toUpperCase());
        }

        function groupByDivision(rows) {
            const map = new Map();
            for (const row of rows) {
                const key = normalizeDivision(row.division);
                if (!map.has(key)) map.set(key, []);
                map.get(key).push(row);
            }
            // Prefer Senior then Junior then others
            const order = ['Senior', 'Junior'];
            const keys = [...map.keys()].sort((a, b) => {
                const ia = order.indexOf(a);
                const ib = order.indexOf(b);
                if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                return a.localeCompare(b);
            });
            return keys.map(k => ({
                division: k,
                rows: map.get(k).slice().sort((a, b) => {
                    // Prefer API rank within division, else points
                    const ra = Number(a.rank) || 999;
                    const rb = Number(b.rank) || 999;
                    if (ra !== rb) return ra - rb;
                    return (Number(b.total_points) || 0) - (Number(a.total_points) || 0);
                })
            }));
        }

        function renderChampionCards(champPayload) {
            const area = document.getElementById('champions-area');
            if (!area) return;
            championIds = new Set();

            if (!champPayload?.success || !champPayload.data) {
                area.innerHTML = '';
                return;
            }

            const c = champPayload.data;
            const declared = Array.isArray(c.champions) ? c.champions.filter(Boolean) : [];
            const cards = [];

            if (c.is_final && declared.length) {
                declared.forEach(ch => {
                    const id = ch.department_id || ch.id;
                    if (id != null) championIds.add(String(id));
                    const divLabel = normalizeDivision(ch.division);
                    cards.push(`
                        <div class="champion-card">
                            <div class="champion-trophy">🏆</div>
                            <div class="champion-info">
                                <div class="champion-label">${escapeHtml(divLabel)} Champion</div>
                                <div class="champion-name">${escapeHtml(ch.name)}</div>
                                <div class="champion-sub">🥇 ${ch.gold_medals ?? 0} · 🥈 — · Declared</div>
                            </div>
                            <div>
                                <div class="champion-pts">${ch.total_points ?? 0}</div>
                                <div class="champion-pts-lbl">PTS</div>
                            </div>
                        </div>`);
                });
            } else if (c.current_leader) {
                const leader = c.current_leader;
                cards.push(`
                    <div class="champion-card leader-only">
                        <div class="champion-trophy">📊</div>
                        <div class="champion-info">
                            <div class="champion-label">Current overall leader</div>
                            <div class="champion-name">${escapeHtml(leader.name)}</div>
                            <div class="champion-sub">${escapeHtml(c.message || 'Standings in progress')}</div>
                        </div>
                        <div>
                            <div class="champion-pts">${leader.total_points ?? 0}</div>
                            <div class="champion-pts-lbl">PTS</div>
                        </div>
                    </div>`);
            }

            area.innerHTML = cards.join('');
        }

        function renderPodium(top3) {
            if (!top3.length) return '';
            return `<div class="podium-wrap">${top3.map((d, i) => {
                const rank = i + 1;
                const barOrder = [2, 1, 3][i];
                return `
                    <div class="podium-place podium-${rank}" style="order:${barOrder}">
                        <div class="podium-avatar" style="background:${d.color || 'var(--bg3)'};">${rank}</div>
                        <div class="podium-bar bar-${rank}">
                            <div class="podium-bar-pts">${d.total_points ?? 0}</div>
                            <div class="podium-bar-label">pts</div>
                        </div>
                        <div class="podium-name">${escapeHtml(d.name)}</div>
                    </div>`;
            }).join('')}</div>`;
        }

        function renderRows(rows) {
            return rows.map((d, i) => {
                const rank = Number(d.rank) || (i + 1);
                const isTop3 = rank <= 3;
                const isChamp = championIds.has(String(d.id));
                return `
                    <div class="lb-row ${isTop3 ? 'top-3' : ''} ${isChamp ? 'champion-row' : ''}">
                        <div class="lb-rank ${isTop3 ? `rank-${rank}` : ''}">${rank}</div>
                        <div class="lb-color-dot" style="background:${d.color || 'var(--muted)'};"></div>
                        <div class="lb-dept">
                            <div class="lb-dept-name">${escapeHtml(d.name)}${isChamp ? ' 🏆' : ''}</div>
                            <div class="lb-dept-medals">
                                <span class="medal-stat" style="color:#ffd700;">G ${d.gold_medals ?? 0}</span>
                                <span class="medal-stat" style="color:#c0c0c0;">S ${d.silver_medals ?? 0}</span>
                                <span class="medal-stat" style="color:#cd7f32;">B ${d.bronze_medals ?? 0}</span>
                            </div>
                        </div>
                        <div class="lb-pts-block">
                            <div class="lb-pts">${d.total_points ?? 0}</div>
                            <div class="lb-pts-label">PTS</div>
                        </div>
                    </div>`;
            }).join('');
        }

        async function loadLeaderboard(opts = {}) {
            const root = document.getElementById('leaderboard-root');
            if (!opts.silent) {
                root.innerHTML = `<div class="empty-block empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                    <div class="empty-text">Loading standings...</div>
                </div>`;
            }

            try {
                const [lbRes, champRes] = await Promise.all([
                    api('/leaderboard'),
                    api('/leaderboard/overall-champion').catch(() => ({ success: false }))
                ]);

                renderChampionCards(champRes);

                if (!lbRes.success || !lbRes.data?.length) {
                    root.innerHTML = `<div class="empty-block empty-state">
                        <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></div>
                        <div class="empty-text">No standings available yet.</div>
                    </div>`;
                    return;
                }

                const groups = groupByDivision(lbRes.data);

                // If API ranks are global-only and division missing on some rows, still show one block
                root.innerHTML = groups.map(g => {
                    const top3 = g.rows.slice(0, 3);
                    return `
                        <div class="division-block card" style="padding:16px 0 6px; overflow:hidden;">
                            <div class="division-header" style="padding:0 16px;">
                                <div class="division-title">${escapeHtml(g.division)} Division</div>
                                <span class="division-badge">${g.rows.length} depts</span>
                            </div>
                            ${renderPodium(top3)}
                            <div class="lb-section-title">${escapeHtml(g.division)} Rankings</div>
                            <div>${renderRows(g.rows)}</div>
                        </div>`;
                }).join('');

            } catch (err) {
                console.error(err);
                if (!opts.silent) {
                    root.innerHTML = `<div class="empty-block empty-state" style="color:#ef4444;">Failed to load leaderboard. Please try again.</div>`;
                }
            }
        }
    </script>
</body>

</html>
