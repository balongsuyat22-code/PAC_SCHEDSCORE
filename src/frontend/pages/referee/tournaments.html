<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/referee.css">
    <style>
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .filter-pill:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .filter-pill.active {
            background: var(--gold-bg);
            color: var(--gold);
            border-color: var(--border-gold);
        }

        .filter-spacer {
            flex: 1;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
        }

        .btn-view {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text2);
            transition: all 0.15s;
        }

        .btn-view:hover {
            color: var(--text);
            border-color: var(--border-gold);
        }

        .btn-view.active {
            background: var(--gold-bg);
            color: var(--gold);
            border-color: var(--border-gold);
        }

        .btn-view svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .td-primary {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }

        .td-sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .tourney-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .tourney-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }

        .tc-header {
            padding: 14px 16px;
            background: var(--bg3);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tc-sport-circle {
            width: 40px;
            height: 40px;
            background: var(--gold-bg);
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: var(--gold);
            flex-shrink: 0;
        }

        .tc-sport-name {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .tc-meta {
            font-size: 12px;
            color: var(--text2);
            margin-top: 2px;
        }

        .tc-body {
            padding: 16px;
        }

        .tc-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            line-height: 1.2;
            color: var(--text);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .tc-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .card-grid {
                grid-template-columns: 1fr;
            }

            .filter-spacer {
                display: none;
            }

            .view-toggle {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <div class="page-title">
                        <span class="title-icon"><svg viewBox="0 0 24 24">
                                <path
                                    d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15" />
                                <path d="M11 12 5.12 2.2" />
                                <path d="m13 12 5.88-9.8" />
                                <path d="M8 7h8" />
                                <circle cx="12" cy="17" r="5" />
                                <path d="M12 18v-2h-.5" />
                            </svg></span>
                        Tournaments
                    </div>
                    <div class="page-sub">All active and upcoming SportFest tournaments.</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadTournaments()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                    Refresh
                </button>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-card-label">Total</div>
                    <div class="stat-card-value" id="stat-total" style="color:var(--text);">—</div>
                    <div class="stat-card-sub">Tournaments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Active</div>
                    <div class="stat-card-value" id="stat-active" style="color:var(--green);">—</div>
                    <div class="stat-card-sub">Currently running</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Upcoming</div>
                    <div class="stat-card-value" id="stat-upcoming" style="color:var(--gold);">—</div>
                    <div class="stat-card-sub">Scheduled</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">Completed</div>
                    <div class="stat-card-value" id="stat-completed" style="color:var(--text2);">—</div>
                    <div class="stat-card-sub">Finished</div>
                </div>
            </div>

            <div class="filter-bar">
                <button class="filter-pill active" onclick="setFilter('all',this)">All</button>
                <button class="filter-pill" onclick="setFilter('active',this)">Active</button>
                <button class="filter-pill" onclick="setFilter('upcoming',this)">Upcoming</button>
                <button class="filter-pill" onclick="setFilter('completed',this)">Completed</button>
                <div class="filter-spacer"></div>
                <div class="view-toggle">
                    <button class="btn-view active" id="btn-view-table" onclick="setView('table')" title="Table view">
                        <svg viewBox="0 0 24 24">
                            <line x1="8" x2="21" y1="6" y2="6" />
                            <line x1="8" x2="21" y1="12" y2="12" />
                            <line x1="8" x2="21" y1="18" y2="18" />
                            <line x1="3" x2="3.01" y1="6" y2="6" />
                            <line x1="3" x2="3.01" y1="12" y2="12" />
                            <line x1="3" x2="3.01" y1="18" y2="18" />
                        </svg>
                    </button>
                    <button class="btn-view" id="btn-view-grid" onclick="setView('grid')" title="Card view">
                        <svg viewBox="0 0 24 24">
                            <rect width="7" height="7" x="3" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="3" rx="1" />
                            <rect width="7" height="7" x="14" y="14" rx="1" />
                            <rect width="7" height="7" x="3" y="14" rx="1" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="view-table-el">
                <div class="card">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tournament</th>
                                    <th>Sport</th>
                                    <th>Format</th>
                                    <th>Matches</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tourney-body">
                                <tr>
                                    <td colspan="5">
                                        <div class="empty-state">
                                            <div class="empty-icon"><svg viewBox="0 0 24 24">
                                                    <circle cx="12" cy="12" r="10" />
                                                    <polyline points="12 6 12 12 16 14" />
                                                </svg></div>
                                            <div class="empty-text">Loading...</div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="view-grid-el" style="display:none;">
                <div class="card-grid" id="tourney-grid"></div>
            </div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script src="../../js/referee-sidebar.js"></script>
    <script>
        let allTournaments = [];
        let currentFilter = 'all';
        let currentView = 'table';

        document.addEventListener('DOMContentLoaded', () => {
            renderRefereeSidebar('tournaments');
            renderRefereeTopbar();
            loadTournaments();
        });

        async function loadTournaments() {
            document.getElementById('tourney-body').innerHTML =
                `<tr><td colspan="5"><div class="empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                    <div class="empty-text">Loading...</div>
                </div></td></tr>`;
            document.getElementById('tourney-grid').innerHTML = '';
            try {
                const res = await api('/tournaments');
                allTournaments = (res.success && res.data) ? res.data : [];
            } catch (e) {
                console.error(e);
                allTournaments = [];
            }
            renderStats();
            render();
        }

        function renderStats() {
            const d = allTournaments;
            document.getElementById('stat-total').textContent = d.length;
            document.getElementById('stat-active').textContent = d.filter(t => t.status === 'active').length;
            document.getElementById('stat-upcoming').textContent = d.filter(t => ['upcoming', 'scheduled'].includes(t.status)).length;
            document.getElementById('stat-completed').textContent = d.filter(t => t.status === 'completed').length;
        }

        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function filteredData() {
            if (currentFilter === 'all') return allTournaments;
            if (currentFilter === 'upcoming') return allTournaments.filter(t => ['upcoming', 'scheduled'].includes(t.status));
            return allTournaments.filter(t => t.status === currentFilter);
        }

        function setView(v) {
            currentView = v;
            document.getElementById('view-table-el').style.display = v === 'table' ? '' : 'none';
            document.getElementById('view-grid-el').style.display = v === 'grid' ? '' : 'none';
            document.getElementById('btn-view-table').classList.toggle('active', v === 'table');
            document.getElementById('btn-view-grid').classList.toggle('active', v === 'grid');
            render();
        }

        function render() {
            currentView === 'table' ? renderTable() : renderGrid();
        }

        function fmtFormat(f) {
            if (!f) return '—';
            return f.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function tBadge(s) {
            const map = {
                active: { cls: 'badge-active', label: 'Active' },
                ongoing: { cls: 'badge-ongoing', label: 'Ongoing' },
                upcoming: { cls: 'badge-upcoming', label: 'Upcoming' },
                scheduled: { cls: 'badge-scheduled', label: 'Upcoming' },
                completed: { cls: 'badge-completed', label: 'Completed' },
                cancelled: { cls: 'badge-cancelled', label: 'Cancelled' },
            };
            const b = map[s] || { cls: 'badge-muted', label: s || 'Unknown' };
            return `<span class="badge ${b.cls}">${b.label}</span>`;
        }

        function renderTable() {
            const tbody = document.getElementById('tourney-body');
            const data = filteredData();
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><circle cx="12" cy="17" r="5"/></svg></div>
                    <div class="empty-text">No tournaments found.</div>
                </div></td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(t => `
                <tr>
                    <td>
                        <div class="td-primary">${t.name}</div>
                        <div class="td-sub">ID #${t.id}</div>
                    </td>
                    <td>${t.sport_name || '—'}</td>
                    <td><span class="badge badge-muted">${fmtFormat(t.format)}</span></td>
                    <td style="color:var(--text2); font-size:13px;">${t.match_count != null ? t.match_count + ' matches' : '—'}</td>
                    <td>${tBadge(t.status)}</td>
                </tr>`).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('tourney-grid');
            const data = filteredData();
            if (!data.length) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><circle cx="12" cy="17" r="5"/></svg></div>
                    <div class="empty-text">No tournaments found.</div>
                </div>`;
                return;
            }
            grid.innerHTML = data.map(t => {
                const initials = (t.sport_name || 'SP').slice(0, 2).toUpperCase();
                return `
                <div class="tourney-card">
                    <div class="tc-header">
                        <div class="tc-sport-circle">${initials}</div>
                        <div style="flex:1; min-width:0;">
                            <div class="tc-sport-name">${t.sport_name || 'Sport'}</div>
                            <div class="tc-meta">${t.match_count != null ? t.match_count + ' matches' : 'ID #' + t.id}</div>
                        </div>
                        <div>${tBadge(t.status)}</div>
                    </div>
                    <div class="tc-body">
                        <div class="tc-name">${t.name}</div>
                        <div class="tc-badges">
                            <span class="badge badge-muted">${fmtFormat(t.format)}</span>
                            <span class="badge badge-blue">ID #${t.id}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>

</html>
