<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Schedule — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/referee.css">
    <style>
        .date-banner {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .date-banner-day {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--text);
        }

        .date-banner-sub {
            font-size: 13px;
            color: var(--text2);
            margin-top: 2px;
        }

        .date-banner-clock {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .timeline {
            position: relative;
            padding-left: 44px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--gold-bg), var(--border), transparent);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            animation: fadeUp 0.3s ease both;
        }

        .timeline-item:nth-child(1) {
            animation-delay: 0.05s;
        }

        .timeline-item:nth-child(2) {
            animation-delay: 0.10s;
        }

        .timeline-item:nth-child(3) {
            animation-delay: 0.15s;
        }

        .timeline-item:nth-child(4) {
            animation-delay: 0.20s;
        }

        .timeline-item:nth-child(5) {
            animation-delay: 0.25s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .timeline-dot {
            position: absolute;
            left: -36px;
            top: 16px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--bg);
            border: 3px solid var(--gold);
            z-index: 2;
            transition: box-shadow 0.2s;
        }

        .timeline-item:hover .timeline-dot {
            box-shadow: 0 0 0 5px rgba(245, 184, 0, 0.12);
        }

        .timeline-dot.dot-live {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.05);
            }
        }

        .timeline-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .timeline-card:hover {
            border-color: var(--border-gold);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .timeline-card.card-live {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .timeline-time {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .timeline-matchup {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
        }

        .timeline-vs {
            color: var(--muted);
            font-weight: 400;
            margin: 0 5px;
            font-size: 14px;
        }

        .timeline-meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .timeline-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .timeline-footer .btn {
            min-height: 40px;
            padding: 8px 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            margin-left: 8px;
        }

        .live-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            animation: livePulse 1.6s infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.25);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.05);
            }
        }

        @media (max-width: 640px) {
            .timeline {
                padding-left: 32px;
            }

            .timeline::before {
                left: 10px;
            }

            .timeline-dot {
                left: -28px;
                width: 14px;
                height: 14px;
                top: 18px;
            }

            .timeline-card {
                padding: 14px;
                border-radius: 12px;
            }

            .timeline-time {
                font-size: 20px;
            }

            .timeline-matchup {
                font-size: 16px;
            }

            .date-banner {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
            }

            .date-banner-day {
                font-size: 22px;
            }

            .date-banner-clock {
                font-size: 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <div class="page-title">
                        <span class="title-icon"><svg viewBox="0 0 24 24">
                                <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                <line x1="16" x2="16" y1="2" y2="6" />
                                <line x1="8" x2="8" y1="2" y2="6" />
                                <line x1="3" x2="21" y1="10" y2="10" />
                            </svg></span>
                        Today's Timeline
                        <span class="live-pill" id="rt-live-pill" style="display:none">LIVE</span>
                    </div>
                    <div class="page-sub">Your match sequence for today · updates live</div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="loadSchedule()">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                    Refresh
                </button>
            </div>

            <div class="date-banner">
                <div>
                    <div class="date-banner-day" id="today-label">—</div>
                    <div class="date-banner-sub">Today's schedule</div>
                </div>
                <div class="date-banner-clock" id="live-clock">00:00:00</div>
            </div>

            <div id="schedule-timeline" class="timeline">
                <div class="empty-state">
                    <div class="empty-icon"><svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg></div>
                    <div class="empty-text">Loading schedule...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script src="../../js/referee-sidebar.js"></script>
    <script>
        let _schedReloadTimer = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof Auth !== 'undefined' && Auth.requireAuth && !Auth.requireAuth('sgo_officer')) return;
            renderRefereeSidebar('schedule');
            renderRefereeTopbar();
            startClock();
            await loadSchedule();
            bindRealtime();
        });

        function bindRealtime() {
            if (typeof Realtime === 'undefined') return;
            Realtime.connect().catch(() => { });

            const softReload = () => {
                clearTimeout(_schedReloadTimer);
                _schedReloadTimer = setTimeout(() => loadSchedule({ silent: true }), 350);
            };

            window.addEventListener('sf:match', softReload);
            window.addEventListener('sf:live', softReload);
            window.addEventListener('sf:notif', softReload);

            const pill = document.getElementById('rt-live-pill');
            const syncPill = () => {
                if (!pill) return;
                pill.style.display = Realtime.connected ? 'inline-flex' : 'none';
            };
            syncPill();
            setInterval(syncPill, 2000);
        }

        function startClock() {
            const now = new Date();
            document.getElementById('today-label').textContent = now.toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
            });
            function tick() {
                document.getElementById('live-clock').textContent =
                    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
            tick();
            setInterval(tick, 1000);
        }

        function scoringUrl(matchId) {
            if (matchId == null || matchId === '') return '#';
            return `/referee/scoring?id=${encodeURIComponent(matchId)}`;
        }

        async function loadSchedule(opts = {}) {
            const el = document.getElementById('schedule-timeline');
            if (!opts.silent) {
                el.innerHTML = `<div class="empty-state">
            <div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="empty-text">Loading schedule...</div>
        </div>`;
            }

            try {
                const user = Auth.getUser();
                // Prefer referee-scoped matches; fall back to public today list
                let rows = [];
                try {
                    const resMine = await api('/matches?status=scheduled,ongoing,pending');
                    if (resMine.success && Array.isArray(resMine.data)) {
                        const today = new Date();
                        const y = today.getFullYear();
                        const m = String(today.getMonth() + 1).padStart(2, '0');
                        const d = String(today.getDate()).padStart(2, '0');
                        const todayStr = `${y}-${m}-${d}`;

                        rows = resMine.data.filter(m => {
                            const isMine = !user || m.referee_id == user.id ||
                                m.referee_name === `${user.first_name} ${user.last_name}`;
                            const dateStr = String(m.scheduled_date || '').slice(0, 10);
                            const isToday = !dateStr || dateStr === todayStr;
                            return isMine && isToday && m.status !== 'cancelled' && m.status !== 'completed';
                        });
                    }
                } catch (_) { }

                if (!rows.length) {
                    const res = await api('/schedules/today');
                    if (res.success && Array.isArray(res.data)) {
                        rows = res.data;
                        // If logged in, prefer matches assigned to this referee
                        if (user) {
                            const mine = rows.filter(m =>
                                m.referee_id == user.id ||
                                m.referee_name === `${user.first_name} ${user.last_name}`
                            );
                            if (mine.length) rows = mine;
                        }
                    }
                }

                if (!rows.length) {
                    el.innerHTML = `<div class="empty-state">
                <div class="empty-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
                <div class="empty-text">No matches assigned for today.</div>
            </div>`;
                    return;
                }

                // Sort by time
                rows.sort((a, b) => String(a.scheduled_time || '').localeCompare(String(b.scheduled_time || '')));

                el.innerHTML = rows.map(m => {
                    const isFFA = ['free_for_all', 'team_ranking', 'group_stage_ffa'].includes(
                        String(m.tournament_format || '').toLowerCase()
                    ) || m.bracket_side === 'ffa';

                    const nameA = m.team_a_name || m.dept_a_name || m.dept_a || 'TBD';
                    const nameB = m.team_b_name || m.dept_b_name || m.dept_b || 'TBD';
                    const matchup = isFFA
                        ? (m.tournament_name || 'FFA Event')
                        : `${nameA}<span class="timeline-vs">vs</span>${nameB}`;

                    const isLive = m.status === 'ongoing';
                    const matchId = m.match_id ?? m.id;
                    const href = scoringUrl(matchId);
                    const action = ['scheduled', 'ongoing', 'pending'].includes(m.status)
                        ? `<a href="${href}" class="btn btn-primary btn-sm">Score</a>`
                        : `<a href="${href}" class="btn btn-secondary btn-sm">Review</a>`;

                    return `
                <div class="timeline-item">
                    <div class="timeline-dot ${isLive ? 'dot-live' : ''}"></div>
                    <div class="timeline-card ${isLive ? 'card-live' : ''}">
                        <div class="timeline-time">${typeof formatTime === 'function' ? formatTime(m.scheduled_time) : (m.scheduled_time || 'TBD')}</div>
                        <div class="timeline-matchup">${matchup}</div>
                        <div class="timeline-meta">
                            ${m.sport_name || 'Sport'} · ${m.venue_name || 'TBD'}
                        </div>
                        <div class="timeline-footer">
                            ${typeof statusBadge === 'function' ? statusBadge(m.status) : (m.status || '')}
                            ${action}
                        </div>
                    </div>
                </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                if (!opts.silent) {
                    el.innerHTML = `<div class="empty-state" style="color:#ef4444;">Failed to load schedule.</div>`;
                }
            }
        }

    </script>
</body>

</html>
