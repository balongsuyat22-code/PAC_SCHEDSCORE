<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Reports & Logs</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        .rp-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            flex-wrap: wrap;
        }

        .rp-tab {
            flex: 1;
            text-align: center;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 80px;
            transition: all 0.15s;
        }

        .rp-tab .icon {
            width: 16px;
            height: 16px;
        }

        .rp-tab.active {
            background: var(--bg3);
            color: var(--text);
        }

        .rp-tab:hover:not(.active) {
            color: var(--text);
        }

        .log-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 11px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            font-size: 13px;
        }

        .log-row:last-child {
            border-bottom: none;
        }

        .log-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .stat-mini {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }

        .stat-mini .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        .stat-mini-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--gold);
        }

        .stat-mini-lbl {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dept-report-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            flex-wrap: wrap;
        }

        .dept-report-row:last-child {
            border-bottom: none;
        }

        .dept-report-row .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 13px;
            outline: none;
        }

        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: var(--border-gold);
        }

        .filter-bar input[type="date"] {
            min-width: 160px;
        }

        .filter-bar select {
            min-width: 160px;
        }

        .modal-title .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        /* FFA panel — collapsible View Details (shared with Matches) */
        .ffa-subrow td {
            padding: 0 !important;
            background: var(--bg2);
            border-bottom: 2px solid var(--border);
        }

        .ffa-subrow {
            display: none;
        }

        .ffa-subrow.open {
            display: table-row;
        }

        .ffa-panel {
            margin: 8px 12px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg3);
            overflow: hidden;
            max-width: 560px;
        }

        .ffa-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .ffa-toolbar-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .ffa-table-wrap {
            max-height: 240px;
            overflow-y: auto;
        }

        .ffa-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        .ffa-table th {
            background: var(--bg2);
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .ffa-table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 12px;
        }

        .ffa-table tr:last-child td {
            border-bottom: none;
        }

        .ffa-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            background: transparent;
            border: 1px solid rgba(245, 184, 0, 0.35);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            transition: all .15s;
            font-family: 'Barlow', sans-serif;
        }

        .ffa-toggle-btn:hover {
            background: rgba(245, 184, 0, 0.1);
            border-color: var(--gold);
        }

        .ffa-toggle-btn .chev {
            transition: transform .2s;
            font-size: 10px;
            display: inline-block;
        }

        .ffa-toggle-btn.open .chev {
            transform: rotate(180deg);
        }

        /* Match history table polish */
        #tab-matches table {
            width: 100%;
            border-collapse: collapse;
        }

        #tab-matches thead th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            background: var(--bg2);
        }

        #tab-matches tbody td {
            padding: 12px 14px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        #tab-matches tbody tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        #tab-matches .score-cell {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            white-space: nowrap;
        }

        #tab-matches .score-cell.sets {
            font-size: 22px;
        }

        #tab-matches .score-cell.binary {
            font-size: 13px;
            font-weight: 800;
            color: var(--green);
        }

        #tab-matches .matchup-line {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            flex-wrap: wrap;
        }

        #tab-matches .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            display: inline-block;
        }

        #tab-matches .meta-muted {
            color: var(--muted);
            font-size: 12px;
        }

        .type-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .rp-tabs {
                flex-direction: column;
            }

            .rp-tab {
                flex: none;
                justify-content: center;
                padding: 8px 12px;
            }

            .filter-bar {
                flex-direction: column;
            }

            .filter-bar select,
            .filter-bar input {
                width: 100% !important;
                min-width: unset !important;
            }

            .stat-mini {
                padding: 10px 12px;
            }

            .stat-mini-val {
                font-size: 20px;
            }

            .dept-report-row {
                flex-direction: column;
                text-align: center;
                gap: 6px;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                padding: 10px 16px;
                gap: 8px;
            }

            .topbar-title {
                font-size: 16px;
            }

            .topbar-actions {
                flex-wrap: wrap;
            }

            .content {
                padding: 16px;
            }

            .table-wrap {
                overflow-x: auto;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 6px 8px;
            }

            .modal {
                width: 98vw;
                max-width: 98vw;
            }

            .modal-body {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .log-row {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 12px;
            }

            .log-dot {
                margin-top: 0;
            }

            .rp-tab {
                font-size: 12px;
                padding: 6px 10px;
            }

            .rp-tab .icon {
                width: 14px;
                height: 14px;
            }

            table {
                font-size: 11px;
            }

            th,
            td {
                padding: 4px 6px;
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar injected by renderSidebar -->
    <main class="main">
        <div class="topbar">
            <button class="burger-menu" id="burger-menu" aria-label="Toggle navigation menu" type="button">
                <span class="icon"><svg viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg></span>
            </button>
            <div class="topbar-title">
                <span class="icon" style="width:20px;height:20px;color:var(--gold);">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>

                </span>
                Reports & Logs
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="refreshActive()">
                    <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg></span>
                    Refresh
                </button>

        </div>
        <div class="content">

            <div class="rp-tabs">
                <div class="rp-tab active" onclick="switchTab('matches',this)">
                    <span class="icon"><svg viewBox="0 0 24 24">
                            <line x1="5" y1="19" x2="19" y2="5"></line>
                            <polyline points="14 5 19 5 19 10"></polyline>
                            <line x1="19" y1="19" x2="5" y2="5"></line>
                            <polyline points="10 19 5 19 5 14"></polyline>
                        </svg></span>
                    Match History
                </div>
                <div class="rp-tab" onclick="switchTab('departments',this)">
                    <span class="icon"><svg viewBox="0 0 24 24">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg></span>
                    Department Report
                </div>
                <div class="rp-tab" onclick="switchTab('tournaments',this)">
                    <span class="icon"><svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="7"></circle>
                            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                        </svg></span>
                    Tournament Report
                </div>
                <div class="rp-tab" onclick="switchTab('activity',this)">
                    <span class="icon"><svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg></span>
                    Activity Log

            <!-- MATCH HISTORY -->
            <div id="tab-matches">

                    <input type="date" id="mh-to" onchange="loadMatchHistory()">
                    <button class="btn btn-secondary btn-sm" onclick="clearMHFilters()">
                        <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24">

            <!-- DEPARTMENT REPORT -->

                        <option value="">Select a tournament...</option>

                    <div class="empty-state">

                            <span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg

                                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>

            <!-- ACTIVITY LOG -->

                        <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24">

    <script src="../../js/shared.js"></script>
    <script src="../../js/admin-sidebar.js"></script>
    <script>
        let activeTab = 'matches';
        let alOffset = 0;
        const AL_LIMIT = 50;

        /** Strip decimals (MySQL DECIMAL / SUM often returns "12.00"). Keep at most one decimal for time. */
        function toWhole(n) {
            if (n == null || n === '') return 0;
            const num = Number(n);
            if (Number.isNaN(num)) return n;
            return Math.round(num);
        }

        /** Format FFA result value: whole numbers for points/distance; time keeps up to 1 decimal. */
        function formatFFAValue(raw, scoringType) {
            if (raw == null || raw === '') return '—';
            const num = Number(raw);
            if (Number.isNaN(num)) return raw;
            if (scoringType === 'time') {
                // Keep at most one decimal place for time
                return Number.isInteger(num) ? String(num) : num.toFixed(1);
            }
            // points / distance / default → whole number (no decimals)
            return String(toWhole(num));
        }

        let tournamentByName = {}; // name (lower) -> id
        let tournamentList = [];

        function isFFAMatch(m) {
            const fmt = (m.tournament_format || m.format || '').toLowerCase();
            return m.bracket_side === 'ffa' ||
                m.bracket_position === 'FFA Event' ||
                fmt === 'free_for_all' ||
                fmt === 'team_ranking' ||
                (!m.dept_a_name && !m.dept_b_name && !m.team_a_name && !m.team_b_name && !m.team_a_dept && !m.team_b_dept);
        }

        /** Resolve tournament id from match row (reports API may omit tournament_id). */
        function resolveTournamentId(m) {
            const direct = m.tournament_id || m.tournamentId || m.tourney_id || m.tournamentID;
            if (direct) return String(direct);
            const name = (m.tournament_name || m.tournament || '').trim().toLowerCase();
            if (name && tournamentByName[name]) return String(tournamentByName[name]);
            return '';
        }

        /** Match scoring type — mirrors matches.html matchType */
        function matchType(m) {
            if (isFFAMatch(m)) return 'ffa';
            const st = (m.scoring_type || '').toLowerCase();
            if (st === 'sets') return 'sets';
            if (st === 'binary') return 'binary';
            // Infer sets when sets_won fields present
            if (m.sets_won_a != null && m.sets_won_b != null) return 'sets';
            return 'points';
        }

        function formatReportScore(m) {
            const type = matchType(m);
            if (type === 'ffa') return { html: 'FFA', cls: '' };
            if (type === 'binary') {
                const winner = m.winner_dept || m.winner_name || m.winner || null;
                if (winner) return { html: winner, cls: 'binary' };
                return { html: m.final_score_display || 'Win / Loss', cls: 'binary' };
            }
            if (m.final_score_display) {
                return { html: m.final_score_display, cls: type === 'sets' ? 'sets' : '' };
            }
            if (type === 'sets' && m.sets_won_a != null && m.sets_won_b != null) {
                return { html: `${toWhole(m.sets_won_a)}–${toWhole(m.sets_won_b)}`, cls: 'sets' };
            }
            if (m.total_score_a != null && m.total_score_a !== undefined) {
                return { html: `${toWhole(m.total_score_a)}–${toWhole(m.total_score_b)}`, cls: '' };
            }
            return { html: '—', cls: '' };
        }

        function typeHintLabel(type) {
            if (type === 'sets') return 'Sets';
            if (type === 'binary') return 'Win / Loss';
            if (type === 'ffa') return 'Free-for-All';
            if (type === 'points') return 'Points';
            return '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('admin');
            if (typeof renderSidebar === 'function') {
                renderSidebar('reports');
            }
            const [sRes, dRes, tRes] = await Promise.all([api('/sports'), api('/departments'), api('/tournaments')]);
            const sOpts = (sRes.data || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            const dOpts = (dRes.data || []).map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            tournamentList = tRes.data || [];
            tournamentByName = {};
            tournamentList.forEach(t => {
                if (t.name) tournamentByName[String(t.name).trim().toLowerCase()] = t.id;
            });
            const tOpts = tournamentList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            document.getElementById('mh-sport').innerHTML += sOpts;
            document.getElementById('mh-dept').innerHTML += dOpts;
            document.getElementById('dr-dept').innerHTML += dOpts;
            document.getElementById('tr-tourney').innerHTML += tOpts;
            await loadMatchHistory();
        });

        function switchTab(name, el) {
            activeTab = name;
            ['matches', 'departments', 'tournaments', 'activity'].forEach(t =>
                document.getElementById(`tab-${t}`).style.display = t === name ? '' : 'none'
            );
            document.querySelectorAll('.rp-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if (name === 'activity' && !document.getElementById('al-body').children.length) {
                alOffset = 0;
                loadActivity();
            }
        }

        function refreshActive() {
            if (activeTab === 'matches') loadMatchHistory();
            else if (activeTab === 'departments') loadDeptReport();
            else if (activeTab === 'tournaments') loadTourneyReport();
            else {
                alOffset = 0;
                document.getElementById('al-body').innerHTML = '';
                loadActivity();
            }
        }

        function clearMHFilters() {
            ['mh-sport', 'mh-dept', 'mh-from', 'mh-to'].forEach(id => document.getElementById(id).value = '');
            loadMatchHistory();
        }

        async function loadMatchHistory() {
            const sport_id = document.getElementById('mh-sport').value;
            const department_id = document.getElementById('mh-dept').value;
            const from_date = document.getElementById('mh-from').value;
            const to_date = document.getElementById('mh-to').value;
            let url = '/reports/match-history?';
            if (sport_id) url += `sport_id=${sport_id}&`;
            if (department_id) url += `department_id=${department_id}&`;
            if (from_date) url += `from_date=${from_date}&`;
            if (to_date) url += `to_date=${to_date}&`;
            const res = await api(url);
            const tbody = document.getElementById('mh-body');

                if (ffa) {
                    const rowKey = m.id != null ? String(m.id) : ('t' + (resolveTournamentId(m) || Math.random().toString(36).slice(2, 8)));

                    const tName = (m.tournament_name || '').replace(/'/g, "\\'");

                        <td><span style="font-weight:600">${m.sport_name || '—'}</span></td>

                            <div style="font-size:14px;font-weight:700;color:var(--gold)">ALL PARTICIPANTS — FFA EVENT</div>

                                <button type="button" class="ffa-toggle-btn" id="ffa-toggle-${rowKey}"
                                    onclick="toggleFFADetails('${rowKey}', '${tid}', '${tName}')">
                                    View Details <span class="chev">▾</span>
                                </button>
                            </div>

                        <td class="meta-muted">—</td>
                        <td class="meta-muted">${m.venue_name || '—'}</td>
                        <td class="meta-muted">${m.referee_name || '—'}</td>

                    <tr class="ffa-subrow" id="ffa-subrow-${rowKey}">

                    const nB = m.team_b_name || m.team_b_dept || m.dept_b_name || '—';
                    const cA = m.color_a || m.dept_a_color || '#555';
                    const cB = m.color_b || m.dept_b_color || '#555';
                    const winner = m.winner_dept || m.winner_name || m.winner || '—';
                    html += `<tr>
                        <td><span style="font-weight:600">${m.sport_name || '—'}</span></td>
                        <td class="meta-muted" title="${m.tournament_name || ''}">${m.tournament_name || '—'}</td>

                            <div class="matchup-line">
                                <span class="dot" style="background:${cA}"></span>

                                <span class="dot" style="background:${cB}"></span>
                                <span>${nB}</span>
                            </div>
                            ${hintHtml}
                        </td>
                        <td class="score-cell ${score.cls}">${score.html}</td>
                        <td style="color:var(--green);font-weight:700">${winner}</td>
                        <td class="meta-muted">${m.venue_name || '—'}</td>

        const _ffaLoaded = {};

        function toggleFFADetails(rowKey, tournamentId, tournamentName) {
            const sub = document.getElementById(`ffa-subrow-${rowKey}`);
            const btn = document.getElementById(`ffa-toggle-${rowKey}`);
            if (!sub) return;
            const opening = !sub.classList.contains('open');
            sub.classList.toggle('open', opening);
            if (btn) {
                btn.classList.toggle('open', opening);
                btn.innerHTML = opening
                    ? 'Hide Details <span class="chev">▾</span>'
                    : 'View Details <span class="chev">▾</span>';
            }
            if (opening && !_ffaLoaded[rowKey]) {
                loadFFAForMatchHistory(rowKey, tournamentId, tournamentName);
            }
        }

        async function loadFFAForMatchHistory(rowKey, tournamentId, tournamentName) {
            const container = document.getElementById(`ffa-mh-${rowKey}`);
            if (!container) return;

            // Resolve id: direct → name map → refresh tournaments list once
            let tid = tournamentId || '';
            if (!tid && tournamentName) {
                const key = String(tournamentName).trim().toLowerCase();
                tid = tournamentByName[key] ? String(tournamentByName[key]) : '';
            }
            if (!tid && tournamentName) {
                try {
                    const tRes = await api('/tournaments');
                    tournamentList = tRes.data || [];
                    tournamentByName = {};
                    tournamentList.forEach(t => {
                        if (t.name) tournamentByName[String(t.name).trim().toLowerCase()] = t.id;
                    });
                    const key = String(tournamentName).trim().toLowerCase();
                    tid = tournamentByName[key] ? String(tournamentByName[key]) : '';
                } catch (e) { /* ignore */ }
            }
            if (!tid) {
                container.innerHTML = `<div class="ffa-panel"><div style="padding:12px;color:var(--red);font-size:13px">Missing tournament id — cannot load FFA results.${tournamentName ? ' (tournament: ' + tournamentName + ')' : ''}</div></div>`;
                return;
            }
            container.innerHTML = `<div style="padding:10px 16px;color:var(--muted);font-size:13px">Loading standings…</div>`;
            try {
                const res = await api(`/matches/ffa/${tid}`);
                if (!res.success) throw new Error(res.message || 'Failed');
                const t = res.data || {};
                const scoringType = t.ffa_scoring || 'points';
                const scoreLabel = scoringType === 'time' ? 'Time (s)' : scoringType === 'distance' ? 'Distance / Score' : 'Points';
                const participants = t.participants || [];
                _ffaLoaded[rowKey] = true;

                if (!participants.length) {
                    container.innerHTML = `<div class="ffa-panel"><div style="padding:12px;color:var(--muted);font-size:13px">No participants registered yet.</div></div>`;
                    return;
                }

                const sorted = [...participants].sort((a, b) => {
                    if (a.rank_position != null && b.rank_position != null) return a.rank_position - b.rank_position;
                    const va = Number(a.ffa_result_value), vb = Number(b.ffa_result_value);
                    if (Number.isNaN(va) && Number.isNaN(vb)) return 0;
                    if (Number.isNaN(va)) return 1;
                    if (Number.isNaN(vb)) return -1;
                    return scoringType === 'time' ? va - vb : vb - va;
                });

                let rowsHtml = '';
                sorted.forEach((p, idx) => {
                    const init = (p.team_name || p.department_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                    const col = p.department_color || '#555';
                    const nameStr = p.team_name
                        ? `<div style="font-weight:700">${p.team_name}</div><div style="font-size:11px;color:var(--muted)">${p.department_name}</div>`
                        : `<div style="font-weight:700">${p.department_name}</div>`;
                    const val = formatFFAValue(p.ffa_result_value, scoringType);
                    const rank = p.rank_position != null ? p.rank_position : (idx + 1);
                    rowsHtml += `
                        <tr>
                            <td style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--muted);width:36px">${rank}</td>
                            <td>
                                <div style="display:flex;align-items:center;gap:10px">
                                    <div style="width:26px;height:26px;border-radius:6px;background:${col};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;color:#fff;flex-shrink:0">${init}</div>
                                    <div>${nameStr}</div>
                                </div>
                            </td>
                            <td style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--gold);white-space:nowrap">
                                ${val}
                            </td>
                        </tr>`;
                });

                container.innerHTML = `
                    <div class="ffa-panel">
                        <div class="ffa-toolbar">
                            <span class="ffa-toolbar-title">FFA Standings · ${scoreLabel}</span>
                        </div>
                        <div class="ffa-table-wrap">
                            <table class="ffa-table">
                                <thead>
                                    <tr>
                                        <th style="width:36px">#</th>
                                        <th>Participant</th>
                                        <th style="text-align:right">${scoreLabel}</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>`;
            } catch (err) {
                _ffaLoaded[rowKey] = false;
                container.innerHTML = `<div class="ffa-panel"><div style="padding:12px;color:var(--red);font-size:13px">Failed to load FFA participants${err.message ? ': ' + err.message : ''}</div></div>`;
            }
        }

        async function loadTourneyReport() {

                    `<div class="empty-state"><div class="empty-icon"><span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg></span></div><div class="empty-text">Select a tournament to view its report.</div></div>`;
                return;
            }
            el.innerHTML =
                `<div class="empty-state"><div class="empty-icon"><span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span></div><div class="empty-text">Loading...</div></div>`;

                return;
            }
            const { tournament: t, stats: s, results } = res.data;
            const fmt = (t.format || '').toLowerCase();
            const isFFA = fmt === 'free_for_all' || fmt === 'team_ranking' || t.ffa_scoring;

            let resultsHTML = '';

            if (isFFA) {
                // Load full FFA participant table (same style as Matches page)
                try {
                    const ffaRes = await api(`/matches/ffa/${id}`);
                    if (ffaRes.success && ffaRes.data) {
                        const scoringType = ffaRes.data.ffa_scoring || t.ffa_scoring || 'points';
                        const scoreLabel = scoringType === 'time' ? 'Time (s)' : scoringType === 'distance' ? 'Distance / Score' : 'Points';
                        const participants = ffaRes.data.participants || [];

                        if (participants.length) {
                            const sorted = [...participants].sort((a, b) => {
                                if (a.rank_position != null && b.rank_position != null) return a.rank_position - b.rank_position;
                                const va = Number(a.ffa_result_value), vb = Number(b.ffa_result_value);
                                if (Number.isNaN(va) && Number.isNaN(vb)) return 0;
                                if (Number.isNaN(va)) return 1;
                                if (Number.isNaN(vb)) return -1;
                                return scoringType === 'time' ? va - vb : vb - va;
                            });

                            const rowsHtml = sorted.map((p, idx) => {

        const ACTION_COLOR = {

            PLAYER: 'var(--green)',

            TOURNAMENT: 'var(--gold)',

        async function loadActivity() {
            const res = await api(`/reports/activity-log?limit=${AL_LIMIT}&offset=${alOffset}`);
            const rows = res.data || [];
            const el = document.getElementById('al-body');
            if (!alOffset && !rows.length) {
                el.innerHTML =
                    `<div class="empty-state"><div class="empty-icon"><span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span></div><div class="empty-text">No activity yet.</div></div>`;
                document.getElementById('al-more').style.display = 'none';
                return;
            }
            el.insertAdjacentHTML('beforeend', rows.map(l => {
                const key = Object.keys(ACTION_COLOR).find(k => (l.action || '').includes(k)) || 'USER';
                const color = ACTION_COLOR[key];
                const action = (l.action || '').replace(/_/g, ' ').toLowerCase();
                return `<div class="log-row"><div class="log-dot" style="background:${color}"></div><div style="flex:1"><div><strong>${l.user_name || 'System'}</strong> <span style="color:var(--muted)">${action}</span></div>${l.description ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${l.description}</div>` : ''}<div style="font-size:11px;color:var(--muted);margin-top:2px">${l.created_at ? new Date(l.created_at).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'}</div></div><span class="badge badge-muted" style="font-size:9px">${l.role || '—'}</span></div>`;
            }).join(''));
            alOffset += rows.length;
            document.getElementById('al-more').style.display = rows.length < AL_LIMIT ? 'none' : '';
        }

        function sportIconSVG(name) {
