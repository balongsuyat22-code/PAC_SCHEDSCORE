<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Venues</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        .venue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .venue-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .venue-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-2px);
        }

        .venue-card .icon {
            color: var(--gold);
        }

        .modal-title .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        /* Confirmation Modal */
        #modal-confirm .modal {
            max-width: 420px;
        }

        #modal-confirm .modal-body {
            text-align: center;
            padding: 30px 24px;
        }

        #modal-confirm .confirm-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        #modal-confirm .confirm-icon .icon {
            width: 32px;
            height: 32px;
        }

        .confirm-icon-warning {
            background: rgba(245, 184, 0, 0.15);
            color: var(--gold);
        }

        .confirm-icon-danger {
            background: rgba(232, 50, 59, 0.15);
            color: var(--red);
        }

        #modal-confirm .confirm-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        #modal-confirm .confirm-message {
            color: var(--text2);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .venue-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                padding: 10px 16px;
                gap: 8px;
            }

            .topbar-title {
                font-size: 16px;
            }

            .topbar-actions {
                flex-wrap: wrap;
            }

            .content {
                padding: 16px;
            }

            .modal {
                width: 98vw;
                max-width: 98vw;
            }

            .modal-body {
                padding: 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .venue-card {
                border-radius: 10px;
            }

            .venue-card [style*="font-size:32px"] {
                font-size: 24px !important;
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar injected by renderSidebar -->
    <main class="main">
        <div class="topbar">
            <div class="topbar-title">
                <span class="icon" style="width:20px;height:20px;color:var(--gold);">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </span>
                Venues
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="loadPage()">
                    <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg></span>
                    Refresh
                </button>
                <button class="btn btn-primary btn-sm" onclick="openNew()">
                    <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg></span>
                    New Venue
                </button>
            </div>
        </div>
        <div class="content">
            <div class="venue-grid" id="venue-grid">
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon">
                        <span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg></span>
                    </div>
                    <div class="empty-text">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- ── CONFIRMATION MODAL ── -->
    <div class="modal-overlay" id="modal-confirm" onclick="if(event.target===this)closeConfirm()">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="confirm-title">
                    <span class="icon" style="width:18px;height:18px;color:var(--gold);"><svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg></span>
                    Confirm
                </div>
                <button class="modal-close" onclick="closeConfirm()">✕</button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon confirm-icon-warning" id="confirm-icon">
                    <span class="icon"><svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg></span>
                </div>
                <div class="confirm-title" id="confirm-title-text">Are you sure?</div>
                <div class="confirm-message" id="confirm-message-text">This action cannot be undone.</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
                <button class="btn btn-primary" id="confirm-btn" onclick="executeConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ── VENUE MODAL ── -->
    <div class="modal-overlay" id="modal-venue" onclick="if(event.target===this)Modal.close('modal-venue')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="venue-modal-title">
                    <span class="icon" style="width:18px;height:18px;color:var(--gold);"><svg viewBox="0 0 24 24">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg></span>
                    New Venue
                </div>
                <button class="modal-close" onclick="Modal.close('modal-venue')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="venue-edit-id">
                <div class="form-group"><label class="form-label">Venue Name *</label><input type="text" id="v-name"
                        class="form-input" placeholder="e.g. Main Gymnasium"></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Location</label><input type="text" id="v-loc"
                            class="form-input" placeholder="Building / Area"></div>
                    <div class="form-group"><label class="form-label">Capacity</label><input type="number" id="v-cap"
                            class="form-input" value="0"></div>
                </div>
                <div class="form-group"><label class="form-label">Description</label><textarea id="v-desc"
                        class="form-textarea"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-venue')">Cancel</button>
                <button class="btn btn-primary" onclick="saveVenue()">Save</button>
            </div>
        </div>
    </div>

    <script src="../../js/shared.js"></script>
    <script src="../../js/admin-sidebar.js"></script>
    <script>
        let allVenues = [];
        let confirmCallback = null;

        // ── CONFIRMATION MODAL ────────────────────────────────────────────────
        function openConfirm(title, message, callback, type = 'warning') {
            document.getElementById('confirm-title-text').textContent = title;
            document.getElementById('confirm-message-text').textContent = message;
            const iconEl = document.getElementById('confirm-icon');
            iconEl.className = `confirm-icon confirm-icon-${type}`;
            confirmCallback = callback;
            const btn = document.getElementById('confirm-btn');
            btn.className = type === 'danger' ? 'btn btn-danger' : 'btn btn-primary';
            Modal.open('modal-confirm');
        }

        function closeConfirm() {
            Modal.close('modal-confirm');
            confirmCallback = null;
        }

        function executeConfirm() {
            if (typeof confirmCallback === 'function') {
                confirmCallback();
            }
            closeConfirm();
        }

        // ── INIT ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderSidebar === 'function') {
                renderSidebar('venues');
            }
            loadPage();
        });

        // ── LOAD ──────────────────────────────────────────────────────────────
        async function loadPage() {
            const res = await api('/venues');
            if (!res.success) return;
            allVenues = res.data || [];
            const el = document.getElementById('venue-grid');
            if (!allVenues.length) {
                el.innerHTML =
                    `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon"><span class="icon" style="width:44px;height:44px;color:var(--muted);"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span></div><div class="empty-text">No venues yet</div></div>`;
                return;
            }
            el.innerHTML = allVenues.map(v => `
            <div class="venue-card">
                <div style="padding:20px">
                    <div style="font-size:32px;margin-bottom:10px">
                        <span class="icon" style="width:32px;height:32px;color:var(--gold);"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span>
                    </div>
                    <div style="font-size:17px;font-weight:700;margin-bottom:4px">${v.name}</div>
                    <div style="font-size:13px;color:var(--muted);margin-bottom:12px">📍 ${v.location || '—'}</div>
                    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                        <div style="flex:1;background:var(--bg3);border-radius:7px;padding:10px;text-align:center;min-width:80px">
                            <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800">${v.capacity || 0}</div>
                            <div style="font-size:10px;color:var(--muted)">CAPACITY</div>
                        </div>
                        <div style="flex:1;background:var(--bg3);border-radius:7px;padding:10px;text-align:center;min-width:80px">
                            <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:${v.scheduled_matches ? 'var(--red)' : 'var(--green)'}">${v.scheduled_matches || 0}</div>
                            <div style="font-size:10px;color:var(--muted)">ACTIVE</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openEdit(${v.id})">
                            <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></span>
                            Edit
                        </button>
                        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="viewSchedule(${v.id})">
                            <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
                            Schedule
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="confirmDeleteVenue(${v.id}, '${esc(v.name)}')">
                            <span class="icon" style="width:14px;height:14px;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg></span>
                        </button>
                    </div>
                </div>
            </div>`).join('');
        }

        // ── CONFIRM DELETE ────────────────────────────────────────────────────
        function confirmDeleteVenue(id, name) {
            openConfirm(
                'Delete Venue?',
                `Are you sure you want to delete "${name}"? This will also remove all matches scheduled at this venue.`,
                async function () {
                    const res = await api(`/venues/${id}`, { method: 'DELETE' });
                    Toast.show(res.message || (res.success ? 'Venue deleted' : 'Error'), res.success ? 'success' : 'error');
                    if (res.success) await loadPage();
                },
                'danger'
            );
        }

        // ── CRUD OPERATIONS ──────────────────────────────────────────────────
        function openNew() {
            document.getElementById('venue-modal-title').innerHTML =
                `<span class="icon" style="width:18px;height:18px;color:var(--gold);"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span> New Venue`;
            document.getElementById('venue-edit-id').value = '';
            ['v-name', 'v-loc', 'v-desc'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('v-cap').value = 0;
            Modal.open('modal-venue');
        }

        function openEdit(id) {
            const v = allVenues.find(x => x.id === id);
            if (!v) return;
            document.getElementById('venue-modal-title').innerHTML =
                `<span class="icon" style="width:18px;height:18px;color:var(--gold);"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></span> ${v.name}`;
            document.getElementById('venue-edit-id').value = id;
            document.getElementById('v-name').value = v.name;
            document.getElementById('v-loc').value = v.location || '';
            document.getElementById('v-cap').value = v.capacity || 0;
            document.getElementById('v-desc').value = v.description || '';
            Modal.open('modal-venue');
        }

        function viewSchedule(id) {
            const v = allVenues.find(x => x.id === id);
            Toast.show(`${v?.name} schedule — use /admin/matches to filter by venue`, 'info');
        }

        async function saveVenue() {
            const id = document.getElementById('venue-edit-id').value;
            const body = {
                name: document.getElementById('v-name').value.trim(),
                location: document.getElementById('v-loc').value.trim(),
                capacity: parseInt(document.getElementById('v-cap').value) || 0,
                description: document.getElementById('v-desc').value.trim()
            };
            if (!body.name) { Toast.show('Venue name required', 'error'); return; }
            const res = id ?
                await api(`/venues/${id}`, { method: 'PUT', body: JSON.stringify(body) }) :
                await api('/venues', { method: 'POST', body: JSON.stringify(body) });
            Toast.show(res.message || (res.success ? 'Saved!' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) { Modal.close('modal-venue'); await loadPage(); }
        }

        // ── UTILS ─────────────────────────────────────────────────────────────
        function esc(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])
            );
        }
    </script>
</body>

</html>
