<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Live Matches</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        .live-hero {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(34, 197, 94, .08);
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .pulse-ring {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .6;
                transform: scale(1.2);
            }
        }

        .live-card {
            background: linear-gradient(135deg, #0D1F0D, #0A1A0A);
            border: 1px solid rgba(34, 197, 94, .3);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 16px;
            transition: border-color .2s;
        }

        .live-card:hover {
            border-color: rgba(34, 197, 94, .6);
        }

        .live-card-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .live-matchup {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .live-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .live-logo {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            overflow: hidden;
        }

        .live-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .live-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            word-break: break-word;
        }

        .live-center {
            text-align: center;
        }

        .live-score {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 68px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .live-dash {
            font-size: 28px;
            color: var(--muted);
        }

        .live-meta {
            display: flex;
            gap: 14px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .live-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .no-live {
            padding: 80px 24px;
            text-align: center;
            color: var(--muted);
        }

        .done-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            font-size: 13px;
            flex-wrap: wrap;
        }

        .done-row:last-child {
            border-bottom: none;
        }

        .done-score {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--gold);
            margin-left: auto;
        }

        .done-score.binary {
            font-size: 14px;
            color: var(--green);
        }

        @media (max-width: 768px) {
            .live-card {
                padding: 18px 16px;
            }

            .live-score {
                font-size: 42px;
            }

            .live-logo {
                width: 48px;
                height: 48px;
                font-size: 16px;
            }

            .live-name {
                font-size: 15px;
            }

            .live-matchup {
                gap: 10px;
            }

            .live-hero {
                padding: 12px 14px;
            }

            .topbar {
                padding: 0 16px;
                height: auto;
                min-height: 60px;
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .live-score {
                font-size: 32px;
            }

            .live-dash {
                font-size: 18px;
            }

            .live-logo {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div class="topbar-title">Live Matches</div>
            <div class="topbar-actions">
                <span style="font-size:12px;color:var(--muted)" id="refresh-label">Refreshing in 10s</span>
                <button class="btn btn-secondary btn-sm" onclick="refresh()">Refresh Now</button>
            </div>
        </div>

        <div class="content">
            <div class="live-hero">
                <span class="pulse-ring"></span>
                <span style="font-weight:700;font-size:14px">Live Scoreboard</span>
                <span style="color:var(--muted);font-size:13px">— auto-refreshes every 10 seconds</span>
                <span
                    style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--green)"
                    id="live-count">0 Live</span>
            </div>

            <div id="live-list">
                <div class="no-live">
                    <div style="font-size:15px">Loading...</div>
                </div>
            </div>

            <div style="margin-top:28px;display:none" id="done-section">
                <div
                    style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">
                    Completed Today
                </div>
                <div class="card" id="done-list"></div>
            </div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script>
        /* Inlined sidebar */
        const ADMIN_ICONS = {
            dashboard: `<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`,
            live: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>`,
            leaderboard: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>`,
            tournaments: `<svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>`,
            matches: `<svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"></line><polyline points="14 5 19 5 19 10"></polyline><line x1="19" y1="19" x2="5" y2="5"></line><polyline points="10 19 5 19 5 14"></polyline></svg>`,
            departments: `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
            sports: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`,
            teams: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
            venues: `<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`,
            users: `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
            schedule: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`,
            sportFest: `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`,
            reports: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
            trophy: `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>`,
            settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`,
            logout: `<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>`,
        };

        const ADMIN_NAV = [
            { section: 'Overview' },
            { key: 'dashboard', icon: ADMIN_ICONS.dashboard, label: 'Dashboard', href: '/admin' },
            { key: 'live', icon: ADMIN_ICONS.live, label: 'Live Matches', href: '/admin/live', badge: 'live' },
            { key: 'leaderboard', icon: ADMIN_ICONS.leaderboard, label: 'Leaderboard', href: '/admin/leaderboard' },
            { section: 'Management' },
            { key: 'tournaments', icon: ADMIN_ICONS.tournaments, label: 'Tournaments', href: '/admin/tournaments' },
            { key: 'matches', icon: ADMIN_ICONS.matches, label: 'Matches', href: '/admin/matches' },
            { key: 'departments', icon: ADMIN_ICONS.departments, label: 'Grades & Strands', href: '/admin/departments' },
            { key: 'sports', icon: ADMIN_ICONS.sports, label: 'Sports', href: '/admin/sports' },
            { key: 'teams', icon: ADMIN_ICONS.teams, label: 'Teams', href: '/admin/teams' },
            { key: 'venues', icon: ADMIN_ICONS.venues, label: 'Venues', href: '/admin/venues' },
            { section: 'System' },
            { key: 'users', icon: ADMIN_ICONS.users, label: 'Users', href: '/admin/users' },
            { key: 'schedule', icon: ADMIN_ICONS.schedule, label: 'Schedule', href: '/admin/schedule' },
            { key: 'sport-fest', icon: ADMIN_ICONS.sportFest, label: 'Sport Fest', href: '/admin/sport-fest' },
            { key: 'reports', icon: ADMIN_ICONS.reports, label: 'Reports & Logs', href: '/admin/reports' },
        ];

        function renderSidebar(activePage) {
            const user = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : null;
            const name = user ? (`${user.first_name || ''} ${user.last_name || ''}`).trim() || user.username || 'Admin' : 'Admin';
            const avatar = (user?.first_name?.[0] || user?.username?.[0] || 'A').toUpperCase();
            const currentPath = window.location.pathname;
            const navHtml = ADMIN_NAV.map(item => {
                if (item.section) return `<div class="nav-section-title">${item.section}</div>`;
                const isActive = item.key === activePage
                    || (item.href !== '/admin' && currentPath.startsWith(item.href))
                    || (item.href === '/admin' && (currentPath === '/admin' || currentPath === '/admin/dashboard'));
                const badgeHtml = item.badge === 'live'
                    ? `<span class="nav-badge" id="sb-live-count" style="background:var(--red);display:none">0</span>` : '';
                return `<a class="nav-item${isActive ? ' active' : ''}" href="${item.href}">
                    <span class="nav-icon"><span class="icon">${item.icon}</span></span>${item.label}${badgeHtml}</a>`;
            }).join('\n');
            const sidebarHtml = `
<aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon"><span class="icon">${ADMIN_ICONS.trophy}</span></div>
        <div class="logo-text">PAC <span>SCHED-SCORE</span></div>
    </div>
    <div class="sidebar-role role-admin"><span class="icon">${ADMIN_ICONS.settings}</span> Administrator</div>
    <nav class="sidebar-nav">${navHtml}</nav>
    <div class="sidebar-footer">
        <div class="user-card">
            <div class="user-avatar">${avatar}</div>
            <div class="user-info"><div class="user-name">${name}</div><div class="user-role">Admin</div></div>
            <button class="logout-btn" id="logout-btn" title="Logout"><span class="icon">${ADMIN_ICONS.logout}</span></button>
        </div>
    </div>
</aside>`;
            document.getElementById('admin-sidebar')?.remove();
            const mainEl = document.querySelector('main.main') || document.querySelector('main');
            if (mainEl) mainEl.insertAdjacentHTML('beforebegin', sidebarHtml);
            else document.body.insertAdjacentHTML('afterbegin', sidebarHtml);
            document.getElementById('logout-btn')?.addEventListener('click', () => {
                if (typeof Auth !== 'undefined' && Auth.logout) Auth.logout();
            });
            if (typeof api === 'function') {
                api('/matches/live').then(r => {
                    const badge = document.getElementById('sb-live-count');
                    if (!badge) return;
                    const count = r.data?.length || 0;
                    badge.textContent = count;
                    badge.style.display = count > 0 ? '' : 'none';
                }).catch(() => { });
            }
        }

        function toWhole(n) {
            if (n == null || n === '') return 0;
            const num = Number(n);
            return Number.isNaN(num) ? n : Math.round(num);
        }

        function matchScoringType(m) {
            const st = (m.scoring_type || '').toLowerCase();
            if (st === 'sets') return 'sets';
            if (st === 'binary') return 'binary';
            return 'points';
        }

        function resolveWinnerName(m) {
            if (m.winner && String(m.winner).trim()) return m.winner;
            const side = (m.winner_side || '').toLowerCase();
            if (side === 'draw') return 'Draw';
            const nA = m.team_a_name || m.dept_a_name || m.dept_a || 'Side A';
            const nB = m.team_b_name || m.dept_b_name || m.dept_b || 'Side B';
            if (side === 'a') return nA;
            if (side === 'b') return nB;
            if (m.winner_department_id) {
                if (String(m.winner_department_id) === String(m.participant_a_department_id)) return nA;
                if (String(m.winner_department_id) === String(m.participant_b_department_id)) return nB;
            }
            return m.final_score_display || null;
        }

        function formatDoneScore(m) {
            const type = matchScoringType(m);
            if (type === 'binary') return resolveWinnerName(m) || m.final_score_display || '—';
            if (type === 'sets' && m.sets_won_a != null) {
                return `${toWhole(m.sets_won_a)}–${toWhole(m.sets_won_b)}`;
            }
            if (m.final_score_display) return m.final_score_display;
            if (m.total_score_a != null) return `${toWhole(m.total_score_a)}–${toWhole(m.total_score_b)}`;
            return '—';
        }

        let countdown = 10, timer;

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof Auth !== 'undefined' && Auth.requireAuth) Auth.requireAuth('admin');
            renderSidebar('live');
            refresh();
            timer = setInterval(() => {
                countdown--;
                document.getElementById('refresh-label').textContent = `Refreshing in ${countdown}s`;
                if (countdown <= 0) { countdown = 10; refresh(); }
            }, 1000);
        });

        async function refresh() {
            countdown = 10;
            const [liveRes, todayRes] = await Promise.all([
                api('/matches/live'),
                api('/schedules/today'),
            ]);
            renderLive(liveRes.data || []);
            renderDone((todayRes.data || []).filter(m => m.status === 'completed'));
        }

        function renderLive(matches) {
            const el = document.getElementById('live-list');
            document.getElementById('live-count').textContent = `${matches.length} Live`;
            const badge = document.getElementById('sb-live-count');
            if (badge) {
                badge.textContent = matches.length;
                badge.style.display = matches.length > 0 ? '' : 'none';
            }

            if (!matches.length) {
                el.innerHTML = `<div class="no-live">
                    <div style="font-size:15px">No live matches right now</div>
                    <div style="font-size:13px;margin-top:6px">Check back when matches start</div>
                </div>`;
                return;
            }

            el.innerHTML = matches.map(m => {
                const type = matchScoringType(m);
                const initA = (m.dept_a || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                const initB = (m.dept_b || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                const logoA = m.dept_a_logo ? `<img src="${m.dept_a_logo}" alt="">` : initA;
                const logoB = m.dept_b_logo ? `<img src="${m.dept_b_logo}" alt="">` : initB;
                const isFFA = m.bracket_side === 'ffa' || m.bracket_position === 'FFA Event' || (!m.dept_a && !m.dept_b);

                let scoreA = toWhole(m.live_score_a || 0);
                let scoreB = toWhole(m.live_score_b || 0);
                if (type === 'sets' && m.live_sets_a != null) {
                    scoreA = toWhole(m.live_sets_a);
                    scoreB = toWhole(m.live_sets_b);
                }

                const scoreLabel = type === 'sets' ? 'SETS' : type === 'binary' ? 'WIN / LOSS' : 'LIVE SCORE';

                return `
                <div class="live-card">
                    <div class="live-card-label">
                        <span class="pulse-ring"></span>
                        LIVE · ${m.sport_name || '—'} · ${m.tournament_name || '—'}
                        ${type !== 'points' ? `· ${type.toUpperCase()}` : ''}
                        ${m.ffa_scoring_type ? `· FFA (${m.ffa_scoring_type})` : ''}
                    </div>
                    ${isFFA ? `
                        <div style="text-align:center;padding:16px 0">
                            <div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:var(--gold)">FREE-FOR-ALL EVENT</div>
                            <div style="font-size:13px;color:var(--muted);margin-top:4px">All participants competing — results entered by officer</div>
                        </div>
                    ` : type === 'binary' ? `
                        <div class="live-matchup">
                            <div class="live-side">
                                <div class="live-logo" style="background:${m.dept_a_color || '#555'}">${logoA}</div>
                                <div class="live-name">${m.dept_a || 'TBD'}</div>
                            </div>
                            <div class="live-center">
                                <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--muted)">VS</div>
                                <div style="font-size:11px;color:var(--muted);margin-top:4px">${scoreLabel}</div>
                            </div>
                            <div class="live-side">
                                <div class="live-logo" style="background:${m.dept_b_color || '#555'}">${logoB}</div>
                                <div class="live-name">${m.dept_b || 'TBD'}</div>
                            </div>
                        </div>
                    ` : `
                        <div class="live-matchup">
                            <div class="live-side">
                                <div class="live-logo" style="background:${m.dept_a_color || '#555'}">${logoA}</div>
                                <div class="live-name">${m.dept_a || 'TBD'}</div>
                            </div>
                            <div class="live-center">
                                <div class="live-score"><span>${scoreA}</span><span class="live-dash">–</span><span>${scoreB}</span></div>
                                <div style="font-size:11px;color:var(--muted);margin-top:4px">${scoreLabel}</div>
                            </div>
                            <div class="live-side">
                                <div class="live-logo" style="background:${m.dept_b_color || '#555'}">${logoB}</div>
                                <div class="live-name">${m.dept_b || 'TBD'}</div>
                            </div>
                        </div>
                    `}
                    <div class="live-meta">
                        ${m.venue_name ? `<span>${m.venue_name}</span>` : ''}
                        ${m.started_at ? `<span>Started ${new Date(m.started_at).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}
                        ${m.bracket_position ? `<span>${m.bracket_position}</span>` : ''}
                    </div>
                    <div class="live-actions">
                        <a href="/admin/matches" class="btn btn-secondary btn-sm">Manage Match</a>
                        <a href="/admin/tournaments?id=${m.tournament_id}" class="btn btn-secondary btn-sm">Tournament</a>
                    </div>
                </div>`;
            }).join('');
        }

        function renderDone(matches) {
            const sec = document.getElementById('done-section');
            const el = document.getElementById('done-list');
            if (!matches.length) { sec.style.display = 'none'; return; }
            sec.style.display = '';
            el.innerHTML = matches.map(m => {
                const type = matchScoringType(m);
                const score = formatDoneScore(m);
                return `
                <div class="done-row">
                    <div style="flex:1;min-width:0">
                        <div style="font-weight:600">${m.dept_a || m.dept_a_name || '?'} <span style="color:var(--muted)">vs</span> ${m.dept_b || m.dept_b_name || '?'}</div>
                        <div style="font-size:12px;color:var(--muted)">${m.sport_name || ''} · ${m.tournament_name || ''} · ${m.venue_name || '—'}</div>
                    </div>
                    <div class="done-score ${type === 'binary' ? 'binary' : ''}">${score}</div>
                    ${typeof statusBadge === 'function' ? statusBadge('completed') : '<span class="badge badge-muted">Completed</span>'}
                </div>`;
            }).join('');
        }
    </script>
</body>

</html>
