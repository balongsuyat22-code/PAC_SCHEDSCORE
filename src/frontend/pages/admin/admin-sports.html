<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Sports</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .sport-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .sport-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all .2s;
        }

        .sport-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-3px);
        }

        .sport-card.is-inactive {
            opacity: .55;
        }

        .sport-card-banner {
            padding: 20px 20px 14px;
            background: linear-gradient(135deg, rgba(245, 184, 0, .08), transparent);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sport-icon-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .sport-icon-badge .icon {
            width: 22px;
            height: 22px;
            color: var(--gold);
        }

        .sport-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .sport-code {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1.5px;
        }

        .sport-card-body {
            padding: 16px 20px;
        }

        .sport-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .sport-stats {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .sport-stat-pill {
            background: var(--bg3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            flex: 1;
        }

        .sport-stat-pill .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        .sport-stat-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
        }

        .sport-stat-lbl {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .sport-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .availability-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 20px;
        }

        .availability-badge.open {
            background: rgba(0, 200, 100, .15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, .4);
        }

        .availability-badge.full {
            background: rgba(255, 80, 80, .12);
            color: #ff5c5c;
            border: 1px solid rgba(255, 80, 80, .35);
        }

        .icon-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .icon-choice {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .icon-choice .icon {
            width: 18px;
            height: 18px;
        }

        .icon-choice.selected {
            border-color: var(--gold);
            background: rgba(245, 184, 0, .12);
        }

        .icon-choice:hover {
            border-color: var(--gold);
        }

        .linked-tourney-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
        }

        .linked-tourney-row .icon {
            width: 18px;
            height: 18px;
            color: var(--gold);
        }

        @media (max-width: 768px) {
            .sport-grid {
                grid-template-columns: 1fr;
            }

            .sport-actions {
                flex-direction: column;
            }

            .sport-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .topbar {
                flex-wrap: wrap;
                height: auto;
                padding: 10px 16px;
                gap: 8px;
            }

            .content {
                padding: 16px;
            }
        }

        /* Compact toast */
        .toast-container,
        #toast-container,
        .toasts {
            position: fixed !important;
            bottom: 16px !important;
            top: auto !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 10000 !important;
            width: auto !important;
            max-width: min(300px, calc(100vw - 24px)) !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 6px !important;
            pointer-events: none !important;
        }

        .toast,
        .toast-item {
            font-size: 12.5px !important;
            padding: 8px 12px !important;
            border-radius: 10px !important;
            max-width: min(300px, calc(100vw - 24px)) !important;
            width: max-content !important;
            min-width: 0 !important;
            line-height: 1.35 !important;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .28) !important;
            pointer-events: auto !important;
            word-break: break-word !important;
        }

        #pac-toast-root {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            max-width: min(300px, calc(100vw - 24px));
        }

        .pac-toast {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.3;
            color: #fff;
            background: #1f2937;
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
            max-width: 100%;
        }

        .pac-toast.success {
            background: #065f46;
            border-color: rgba(74, 222, 128, .3);
            color: #ecfdf5;
        }

        .pac-toast.error {
            background: #7f1d1d;
            border-color: rgba(248, 113, 113, .3);
            color: #fef2f2;
        }

        .pac-toast.info {
            background: #1e3a5f;
            border-color: rgba(96, 165, 250, .25);
            color: #eff6ff;
        }

        @media (max-width: 640px) {

            #pac-toast-root,
            .toast-container {
                max-width: calc(100vw - 20px) !important;
                bottom: 12px !important;
            }

            .pac-toast,
            .toast {
                font-size: 12px !important;
                padding: 7px 11px !important;
                max-width: calc(100vw - 20px) !important;
            }
        }

        /* ── Modal chrome (match SGO President UI) ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open,
        .modal-overlay.active,
        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg2, #14141c);
            border: 1px solid var(--border, rgba(255, 255, 255, .08));
            border-radius: 16px;
            width: 100%;
            max-width: 560px;
            max-height: min(90vh, 720px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(245, 184, 0, 0.06);
            overflow: hidden;
            animation: pacModalIn .2s ease-out;
        }

        @keyframes pacModalIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border, rgba(255, 255, 255, .08));
            background: linear-gradient(135deg, rgba(245, 184, 0, 0.07), transparent 60%);
            flex-shrink: 0;
        }

        .modal-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text, #f5f5f7);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .modal-title .icon,
        .modal-title svg {
            width: 18px;
            height: 18px;
            color: var(--gold, #f5b800);
            flex-shrink: 0;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border, rgba(255, 255, 255, .1));
            background: var(--bg3, #1c1c26);
            color: var(--muted, #9ca3af);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
            transition: all .15s;
            flex-shrink: 0;
            padding: 0;
            font-family: inherit;
        }

        .modal-close:hover {
            color: var(--text, #fff);
            border-color: rgba(245, 184, 0, 0.35);
            background: rgba(245, 184, 0, 0.08);
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border, rgba(255, 255, 255, .08));
            background: var(--bg3, rgba(0, 0, 0, .15));
            flex-shrink: 0;
        }

        .modal .form-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted, #9ca3af);
            margin-bottom: 6px;
            display: block;
        }

        .modal .form-input,
        .modal .form-select,
        .modal .form-textarea {
            width: 100%;
            background: var(--bg3, #1c1c26);
            border: 1px solid var(--border, rgba(255, 255, 255, .1));
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text, #f5f5f7);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            transition: border-color .15s;
        }

        .modal .form-input:focus,
        .modal .form-select:focus,
        .modal .form-textarea:focus {
            outline: none;
            border-color: rgba(245, 184, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(245, 184, 0, 0.1);
        }

        .modal .form-group {
            margin-bottom: 14px;
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal .form-textarea {
            min-height: 88px;
            resize: vertical;
        }

        @media (max-width: 640px) {
            .modal {
                max-width: 100%;
                max-height: 92vh;
                border-radius: 14px 14px 12px 12px;
            }

            .modal .form-row {
                grid-template-columns: 1fr;
            }

            .modal-header {
                padding: 14px 16px;
            }

            .modal-body {
                padding: 14px 16px;
            }

            .modal-footer {
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <button class="burger-menu" id="burger-menu" aria-label="Toggle navigation menu" type="button">
                <span class="icon"><svg viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg></span>
            </button>
            <div class="topbar-title">
                <span class="icon" style="width:20px;height:20px;color:var(--gold);"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg></span>
                Sports
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="loadPage()">Refresh</button>
                <button class="btn btn-primary btn-sm" onclick="openCreate()">New Sport</button>
            </div>
        </div>
        <div class="content">
            <div class="sport-grid" id="sport-grid">
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-text">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-sport" onclick="if(event.target===this)Modal.close('modal-sport')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="sport-modal-title"><span style="color:var(--gold)">●</span> New Sport</div>
                <button class="modal-close" onclick="Modal.close('modal-sport')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="sp-edit-id">
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Name *</label><input type="text" id="sp-name"
                            class="form-input" placeholder="e.g. Basketball"></div>
                    <div class="form-group"><label class="form-label">Code *</label><input type="text" id="sp-code"
                            class="form-input" placeholder="e.g. BBALL" maxlength="12" style="text-transform:uppercase">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Category</label><input type="text"
                            id="sp-category" class="form-input" placeholder="e.g. Team / Individual"></div>
                    <div class="form-group"><label class="form-label">Scoring Type</label>
                        <select id="sp-scoring" class="form-select" onchange="onScoringTypeChange()">
                            <option value="points">Points (running score)</option>
                            <option value="sets">Sets (Best of X — e.g. Volleyball)</option>
                            <option value="binary">Winner Only (no score — e.g. Chess)</option>
                            <option value="time">Time (lower/faster wins)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row" id="sp-sets-group" style="display:none">
                    <div class="form-group">
                        <label class="form-label">Sets to Win</label>
                        <select id="sp-sets-to-win" class="form-select">
                            <option value="2">Best of 3 (first to 2 sets)</option>
                            <option value="3">Best of 5 (first to 3 sets)</option>
                            <option value="4">Best of 7 (first to 4 sets)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Min Players</label><input type="number"
                            id="sp-min" class="form-input" min="1" placeholder="1"></div>
                    <div class="form-group"><label class="form-label">Max Players</label><input type="number"
                            id="sp-max" class="form-input" min="1" placeholder="1"></div>
                    <div class="form-group"><label class="form-label">Team Size</label><input type="number"
                            id="sp-team-size" class="form-input" min="1" placeholder="1"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Icon</label>
                    <input type="text" id="sp-icon" class="form-input" placeholder="e.g. 🏀" maxlength="4">
                    <div class="icon-picker" id="sp-icon-picker"></div>
                </div>
                <div class="form-group"><label class="form-label">Description</label><textarea id="sp-desc"
                        class="form-textarea" placeholder="Optional notes..."></textarea></div>
                <div class="form-group" id="sp-active-group" style="display:none">
                    <label class="form-label">Status</label>
                    <select id="sp-active" class="form-select">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-sport')">Cancel</button>
                <button class="btn btn-primary" id="sport-save-btn" onclick="saveSport()">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-sport-tourneys"
        onclick="if(event.target===this)Modal.close('modal-sport-tourneys')">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="sport-tourneys-title"><span style="color:var(--gold)">●</span> Tournaments
                </div>
                <button class="modal-close" onclick="Modal.close('modal-sport-tourneys')">×</button>
            </div>
            <div class="modal-body">
                <div class="card" id="sport-tourneys-list"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary"
                    onclick="Modal.close('modal-sport-tourneys')">Close</button></div>
        </div>
    </div>

    <script src="../../js/shared.js"></script>
    <script src="../../js/admin-sidebar.js"></script>
    <script>

        /* Ensure president-style .open class works alongside display toggling */
        (function patchModalOpen() {
            if (typeof Modal === 'undefined') return;
            const _open = Modal.open?.bind(Modal);
            const _close = Modal.close?.bind(Modal);
            if (_open) {
                Modal.open = function (id) {
                    const el = document.getElementById(id);
                    if (el) { el.classList.add('open'); el.style.display = 'flex'; }
                    if (_open) return _open(id);
                };
            }
            if (_close) {
                Modal.close = function (id) {
                    const el = document.getElementById(id);
                    if (el) { el.classList.remove('open'); el.style.display = 'none'; }
                    if (_close) return _close(id);
                };
            }
        })();

        let allSports = [];
        const ICON_CHOICES = ['🏀', '⚽', '🏐', '🏸', '🎾', '🏓', '🏊', '🏃', '🥊', '🏈', '⚾', '🏉', '🎳', '🤸', '🏹', '♟️'];
        const SCORING_ICONS = {
            points: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>`,
            sets: `<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18"></rect><line x1="8" y1="2" x2="8" y2="22"></line><line x1="16" y1="2" x2="16" y2="22"></line></svg>`,
            binary: `<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
            time: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`
        };

        function pacToast(message, type, ms) {
            type = type || 'info'; ms = ms || 2600;
            let root = document.getElementById('pac-toast-root');
            if (!root) { root = document.createElement('div'); root.id = 'pac-toast-root'; document.body.appendChild(root); }
            const el = document.createElement('div');
            el.className = 'pac-toast ' + type;
            const icon = type === 'success' ? '✓' : type === 'error' ? '!' : '•';
            el.innerHTML = '<span style="flex-shrink:0;font-weight:800">' + icon + '</span><span style="flex:1;min-width:0"></span>';
            el.lastChild.textContent = message || '';
            root.appendChild(el);
            const hide = () => { el.style.opacity = '0'; el.style.transition = 'opacity .15s'; setTimeout(() => el.remove(), 160); };
            const t = setTimeout(hide, ms);
            el.addEventListener('click', () => { clearTimeout(t); hide(); });
            while (root.children.length > 3) root.firstChild.remove();
        }
        (function () {
            const apply = () => {
                if (typeof Toast !== 'undefined' && Toast) Toast.show = function (msg, type) { pacToast(msg, type || 'info'); };
                else window.Toast = { show: (msg, type) => pacToast(msg, type || 'info') };
            };
            apply();
            document.addEventListener('DOMContentLoaded', apply);
        })();

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('admin');
            if (typeof renderSidebar === 'function') renderSidebar('sports');
            buildIconPicker();
            await loadPage();
        });

        function buildIconPicker() {
            document.getElementById('sp-icon-picker').innerHTML = ICON_CHOICES.map(ic =>
                `<div class="icon-choice" data-icon="${ic}" onclick="pickIcon('${ic}')">${ic}</div>`
            ).join('');
        }
        function pickIcon(icon) {
            document.getElementById('sp-icon').value = icon;
            document.querySelectorAll('.icon-choice').forEach(el => el.classList.toggle('selected', el.dataset.icon === icon));
        }
        function onScoringTypeChange() {
            document.getElementById('sp-sets-group').style.display = document.getElementById('sp-scoring').value === 'sets' ? '' : 'none';
        }
        async function loadPage() {
            const res = await api('/sports');
            if (!res.success) return;
            allSports = res.data || [];
            renderGrid();
        }
        function renderGrid() {
            const el = document.getElementById('sport-grid');
            if (!allSports.length) {
                el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">No sports yet. Click "New Sport" to add your first one.</div></div>`;
                return;
            }
            el.innerHTML = allSports.map(s => {
                const scoringLabel = s.scoring_type === 'sets' ? `Best of ${(s.sets_to_win || 2) * 2 - 1}`
                    : (s.scoring_type === 'binary' ? 'Winner only' : (s.scoring_type || 'points'));
                const scoringIconHtml = SCORING_ICONS[s.scoring_type] || SCORING_ICONS.points;
                const statusClass = s.is_active ? 'open' : 'full';
                const statusLabel = s.is_active ? 'Open' : 'Full';
                return `
            <div class="sport-card ${s.is_active ? '' : 'is-inactive'}">
                <div class="sport-card-banner">
                    <div class="sport-icon-badge">${s.icon || '🏅'}</div>
                    <div><div class="sport-name">${s.name}</div><div class="sport-code">${s.code}</div></div>
                </div>
                <div class="sport-card-body">
                    <div class="sport-meta-row">
                        <span>${s.category || '—'}</span>
                        ${s.max_entries ? `<span class="availability-badge ${statusClass}">${statusLabel}</span>` : ''}
                    </div>
                    <div class="sport-stats">
                        <div class="sport-stat-pill"><div class="sport-stat-val"><span class="icon">${scoringIconHtml}</span></div><div class="sport-stat-lbl">${scoringLabel}</div></div>
                        <div class="sport-stat-pill"><div class="sport-stat-val">${s.min_players}-${s.max_players}</div><div class="sport-stat-lbl">Players</div></div>
                        <div class="sport-stat-pill"><div class="sport-stat-val">${s.total_tournaments || 0}</div><div class="sport-stat-lbl">Tourneys</div></div>
                    </div>
                    <div class="sport-actions">
                        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="viewTourneys(${s.id})">Tournaments</button>
                        <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEdit(${s.id})">Edit</button>
                        ${s.is_active ? `<button class="btn btn-secondary btn-sm" onclick="deactivateSport(${s.id})">Deactivate</button>` : ''}
                    </div>
                </div>
            </div>`;
            }).join('');
        }
        function openCreate() {
            document.getElementById('sport-modal-title').innerHTML = '<span style="color:var(--gold)">●</span> New Sport';
            document.getElementById('sport-save-btn').textContent = 'Create';
            document.getElementById('sp-edit-id').value = '';
            ['sp-name', 'sp-code', 'sp-category', 'sp-desc', 'sp-icon'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('sp-min').value = 1;
            document.getElementById('sp-max').value = 1;
            document.getElementById('sp-team-size').value = 1;
            document.getElementById('sp-scoring').value = 'points';
            document.getElementById('sp-sets-to-win').value = '2';
            document.getElementById('sp-active-group').style.display = 'none';
            document.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
            onScoringTypeChange();
            Modal.open('modal-sport');
        }
        function openEdit(id) {
            const s = allSports.find(x => x.id === id); if (!s) return;
            document.getElementById('sport-modal-title').innerHTML = '<span style="color:var(--gold)">●</span> ' + s.name;
            document.getElementById('sport-save-btn').textContent = 'Save Changes';
            document.getElementById('sp-edit-id').value = id;
            document.getElementById('sp-name').value = s.name;
            document.getElementById('sp-code').value = s.code;
            document.getElementById('sp-category').value = s.category || '';
            document.getElementById('sp-scoring').value = s.scoring_type || 'points';
            document.getElementById('sp-sets-to-win').value = String(s.sets_to_win || 2);
            document.getElementById('sp-min').value = s.min_players || 1;
            document.getElementById('sp-max').value = s.max_players || 1;
            document.getElementById('sp-team-size').value = s.team_size || 1;
            document.getElementById('sp-icon').value = s.icon || '';
            document.getElementById('sp-desc').value = s.description || '';
            document.getElementById('sp-active').value = s.is_active ? '1' : '0';
            document.getElementById('sp-active-group').style.display = '';
            document.querySelectorAll('.icon-choice').forEach(el => el.classList.toggle('selected', el.dataset.icon === s.icon));
            onScoringTypeChange();
            Modal.open('modal-sport');
        }
        async function saveSport() {
            const id = document.getElementById('sp-edit-id').value;
            const name = document.getElementById('sp-name').value.trim();
            const code = document.getElementById('sp-code').value.trim();
            if (!name || !code) { Toast.show('Name and code are required', 'error'); return; }
            const scoring_type = document.getElementById('sp-scoring').value;
            const body = {
                name, code,
                category: document.getElementById('sp-category').value.trim() || null,
                scoring_type,
                sets_to_win: scoring_type === 'sets' ? (parseInt(document.getElementById('sp-sets-to-win').value) || 2) : null,
                min_players: parseInt(document.getElementById('sp-min').value) || 1,
                max_players: parseInt(document.getElementById('sp-max').value) || 1,
                team_size: parseInt(document.getElementById('sp-team-size').value) || 1,
                icon: document.getElementById('sp-icon').value.trim() || null,
                description: document.getElementById('sp-desc').value.trim() || null,
            };
            if (id) body.is_active = document.getElementById('sp-active').value;
            const res = id
                ? await api(`/sports/${id}`, { method: 'PUT', body: JSON.stringify(body) })
                : await api('/sports', { method: 'POST', body: JSON.stringify(body) });
            Toast.show(res.message || (res.success ? 'Saved!' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) { Modal.close('modal-sport'); await loadPage(); }
        }
        async function deactivateSport(id) {
            if (!confirm('Deactivate this sport? It will be hidden from active listings but its history stays intact.')) return;
            const res = await api(`/sports/${id}`, { method: 'DELETE' });
            Toast.show(res.message || (res.success ? 'Sport deactivated' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) await loadPage();
        }
        async function viewTourneys(id) {
            const s = allSports.find(x => x.id === id);
            document.getElementById('sport-tourneys-title').innerHTML = '<span style="color:var(--gold)">●</span> ' + (s ? s.name + ' · ' : '') + 'Tournaments';
            const res = await api(`/sports/${id}/tournaments`);
            const list = document.getElementById('sport-tourneys-list');
            if (!res.success || !res.data.length) {
                list.innerHTML = `<div style="padding:14px;color:var(--muted);font-size:13px">No tournaments for this sport yet.</div>`;
            } else {
                list.innerHTML = res.data.map(t => {
                    const statusHtml = typeof statusBadge === 'function' ? statusBadge(t.status) : `<span class="badge badge-muted">${t.status || 'draft'}</span>`;
                    return `<div class="linked-tourney-row">
                        <div style="flex:1"><div style="font-weight:600">${t.name}</div><div style="font-size:11px;color:var(--muted)">${t.format || ''} · ${t.participant_count || 0} participants</div></div>
                        ${statusHtml}
                    </div>`;
                }).join('');
            }
            Modal.open('modal-sport-tourneys');
        }
    </script>
</body>

</html>
