<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE - Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/sgo_president.css">
    <style>
        .lb-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .lb-tab {
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--muted);
            border-radius: 8px;
            padding: 9px 15px;
            cursor: pointer;
            font-weight: 700;
        }

        .lb-tab.active {
            background: var(--gold);
            color: #111;
            border-color: var(--gold);
        }

        .champion {
            background: linear-gradient(135deg, #2b2105, #151515);
            border: 1px solid rgba(245, 184, 0, .45);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .champion-label {
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .champion-name {
            font-size: 32px;
            font-weight: 900;
            margin-top: 5px;
        }

        .champion-meta {
            color: var(--muted);
            margin-top: 4px;
        }

        .table-wrap {
            overflow-x: auto;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px;
        }

        th,
        td {
            padding: 13px 15px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            background: var(--bg3);
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        td.num,
        th.num {
            text-align: center;
        }

        td.points {
            color: var(--gold);
            font-size: 20px;
            font-weight: 900;
            text-align: right;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .dept {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 12px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sport-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .sport-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
        }

        .sport-title {
            color: var(--gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 8px;
        }

        .sport-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .sport-row:last-child {
            border-bottom: 0;
        }

        .empty {
            color: var(--muted);
            padding: 32px;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="../../css/leaderboard-common.css">
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:10px"><button class="burger-menu" onclick="toggleSidebar()"
                    aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-title">Leaderboard</div>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="loadLeaderboard()"><i class="fa-solid fa-rotate"></i>
                Refresh</button>
        </div>
        <div class="content">
            <div id="champion"></div>
            <div class="lb-tabs">
                <button class="lb-tab active" onclick="showTab('overall',this)">Overall</button>
                <button class="lb-tab" onclick="showTab('medals',this)">Medals</button>
                <button class="lb-tab" onclick="showTab('sport',this)">By Sport</button>
            </div>
            <section id="tab-overall">
                <div id="overall" class="table-wrap">
                    <div class="empty">Loading leaderboard...</div>
                </div>
            </section>
            <section id="tab-medals" style="display:none">
                <div id="medals" class="table-wrap"></div>
            </section>
            <section id="tab-sport" style="display:none">
                <div id="sport" class="sport-grid"></div>
            </section>
        </div>
    </main>
    <script src="../../js/api.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        let leaderboard = [];
        let sportRows = [];
        let champion = null;
        const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const departmentInitials = name => String(name || '?').split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
        const division = value => String(value || 'Overall').replace(/_/g, ' ');
        const deptCell = d => `<div class="dept"><span class="logo" style="background:${esc(d.color || '#555')}" >${d.logo_url ? `<img src="${esc(d.logo_url)}" alt="">` : departmentInitials(d.name)}</span><span>${esc(d.name)}</span></div>`;

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('leaderboard');
            await loadLeaderboard();
            if (typeof Realtime !== 'undefined') {
                try { Realtime.connect(); } catch (_) { }
                ['sf:leaderboard', 'sf:champion', 'sf:score'].forEach(event => window.addEventListener(event, () => loadLeaderboard({ silent: true })));
            }
        });

        async function loadLeaderboard(options = {}) {
            try {
                const [lb, champ, sport] = await Promise.all([api('/leaderboard'), api('/leaderboard/overall-champion'), api('/leaderboard/by-sport')]);
                leaderboard = lb?.data || [];
                champion = champ?.data || null;
                sportRows = sport?.data || [];
                renderChampion(); renderOverall(); renderMedals(); renderSport();
            } catch (error) {
                console.error('[pres-leaderboard]', error);
                if (!options.silent && typeof Toast !== 'undefined') Toast.show('Failed to load leaderboard', 'error');
                document.getElementById('overall').innerHTML = '<div class="empty">Leaderboard unavailable.</div>';
            }
        }

        function renderChampion() {
            const list = champion?.champions?.length ? champion.champions : (champion?.champion ? [champion.champion] : []);
            document.getElementById('champion').innerHTML = list.length ? list.map(c => `<div class="champion"><div class="champion-label">${champion.is_final ? 'Sport Fest Champion' : 'Current Leader'} · ${esc(division(c.division))}</div><div class="champion-name">${esc(c.name)}</div><div class="champion-meta">${c.total_points ?? 0} points · ${c.gold_medals || 0} gold medals</div></div>`).join('') : '';
        }

        function renderOverall() {
            const rows = leaderboard.slice().sort((a, b) => Number(b.total_points || 0) - Number(a.total_points || 0));
            document.getElementById('overall').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Department</th><th class="num">Gold</th><th class="num">Silver</th><th class="num">Bronze</th><th class="num">Events</th><th style="text-align:right">Points</th></tr></thead><tbody>${rows.map((d, i) => `<tr><td>${i + 1}</td><td>${deptCell(d)}</td><td class="num">${d.gold_medals || 0}</td><td class="num">${d.silver_medals || 0}</td><td class="num">${d.bronze_medals || 0}</td><td class="num">${d.total_participations || 0}</td><td class="points">${d.total_points || 0}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No standings yet.</div>';
        }

        function renderMedals() {
            const rows = leaderboard.slice().sort((a, b) => Number(b.gold_medals || 0) - Number(a.gold_medals || 0) || Number(b.silver_medals || 0) - Number(a.silver_medals || 0) || Number(b.bronze_medals || 0) - Number(a.bronze_medals || 0));
            document.getElementById('medals').innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>Department</th><th class="num">Gold</th><th class="num">Silver</th><th class="num">Bronze</th><th class="num">Total</th></tr></thead><tbody>${rows.map((d, i) => `<tr><td>${i + 1}</td><td>${deptCell(d)}</td><td class="num">${d.gold_medals || 0}</td><td class="num">${d.silver_medals || 0}</td><td class="num">${d.bronze_medals || 0}</td><td class="num">${(d.gold_medals || 0) + (d.silver_medals || 0) + (d.bronze_medals || 0)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No medals recorded yet.</div>';
        }

        function renderSport() {
            const groups = {};
            sportRows.forEach(row => { const key = row.sport_name || row.sport || 'Sport'; (groups[key] ||= []).push(row); });
            document.getElementById('sport').innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([name, rows]) => `<div class="sport-card"><div class="sport-title">${esc(name)}</div>${rows.slice(0, 8).map((r, i) => `<div class="sport-row"><span>${i + 1}. ${esc(r.department_name || r.name || 'Department')}</span><strong>${r.sport_points ?? r.points ?? r.total_points ?? 0}</strong></div>`).join('')}</div>`).join('') : '<div class="empty">No sport standings yet.</div>';
        }

        function showTab(name, button) {
            ['overall', 'medals', 'sport'].forEach(tab => document.getElementById('tab-' + tab).style.display = tab === name ? '' : 'none');
            document.querySelectorAll('.lb-tab').forEach(tab => tab.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
</body>

</html>
