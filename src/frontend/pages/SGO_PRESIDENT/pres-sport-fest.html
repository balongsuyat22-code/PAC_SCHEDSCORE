<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE - Sport Fest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/sgo_president.css">
    <style>
        .sf-grid {
            display: grid;
            grid-template-columns: minmax(280px, .8fr) minmax(320px, 1.2fr);
            gap: 18px;
        }

        .sf-panel {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .sf-panel h2 {
            margin: 0 0 16px;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            font-size: 18px;
        }

        .sf-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .sf-card.current {
            border-color: var(--gold);
        }

        .sf-card-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: start;
        }

        .sf-name {
            font-weight: 800;
            font-size: 16px;
        }

        .sf-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .sf-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .sf-archive-modal {
            width: min(820px, calc(100vw - 28px));
            max-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
        }

        .sf-archive-body {
            overflow: auto;
        }

        .sf-archive-section {
            margin-bottom: 22px;
        }

        .sf-archive-section h3 {
            margin: 0 0 10px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .sf-archive-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .sf-archive-table th,
        .sf-archive-table td {
            padding: 9px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .sf-archive-table th {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        @media(max-width:600px) {
            .sf-archive-table { font-size: 11px; }
            .sf-archive-table th,
            .sf-archive-table td { padding: 8px 4px; }
        }

        @media(max-width:760px) {
            .sf-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <button class="burger-menu" id="burger-menu" type="button" aria-label="Toggle navigation menu"></button>
            <div class="topbar-title">Sport Fest</div>
            <div class="topbar-actions"><button class="btn btn-secondary btn-sm" type="button"
                    onclick="loadSeasons()">Refresh</button></div>
        </div>
        <div class="content">
            <div class="sf-grid">
                <section class="sf-panel">
                    <h2>Start New Sport Fest</h2>
                    <div class="form-group"><label class="form-label">Name *</label><input id="sf-name"
                            class="form-input" placeholder="PAC Sport Fest 2027"></div>
                    <div class="form-group"><label class="form-label">Year *</label><input id="sf-year"
                            class="form-input" type="number"></div>
                    <div class="form-group"><label class="form-label">Theme</label><input id="sf-theme"
                            class="form-input" placeholder="Optional theme"></div>
                    <div class="form-group"><label class="form-label">Description</label><textarea id="sf-description"
                            class="form-textarea" placeholder="Optional notes"></textarea></div>
                    <button class="btn btn-primary" type="button" onclick="startSeason()">Start Sport Fest</button>
                    <div id="sf-message" style="margin-top:12px;font-size:13px"></div>
                </section>
                <section class="sf-panel">
                    <h2>Sport Fest Seasons</h2>
                    <div id="sf-list">
                        <div style="color:var(--muted)">Loading...</div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <div class="modal-overlay" id="modal-season-manager" onclick="if(event.target===this)Modal.close('modal-season-manager')">
        <div class="modal sf-archive-modal" role="dialog" aria-modal="true" aria-labelledby="season-manager-title">
            <div class="modal-header">
                <div class="modal-title" id="season-manager-title">Manage season</div>
                <button class="modal-close" type="button" aria-label="Close" onclick="Modal.close('modal-season-manager')">×</button>
            </div>
            <div class="modal-body sf-archive-body" id="season-manager-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="Modal.close('modal-season-manager')">Close</button>
            </div>
        </div>
    </div>
    <script src="../../js/shared.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        let seasons = [];
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('sport-fest');
            document.getElementById('sf-year').value = new Date().getFullYear();
            await loadSeasons();
        });

        async function loadSeasons() {
            const res = await api('/sport-fest');
            if (!res.success) return showMessage(res.message || 'Could not load seasons', true);
            seasons = res.data || [];
            renderSeasons();
        }

        function renderSeasons() {
            const el = document.getElementById('sf-list');
            if (!seasons.length) { el.innerHTML = '<div style="color:var(--muted)">No Sport Fest seasons yet.</div>'; return; }
            el.innerHTML = seasons.map(s => `
            <div class="sf-card ${s.is_current ? 'current' : ''}">
                <div class="sf-card-head"><div><div class="sf-name">${escapeHtml(s.name)}</div><div class="sf-meta">${s.year} · ${escapeHtml(s.status || 'upcoming')} · ${Number(s.declared_champion_count || 0)} division champion${Number(s.declared_champion_count || 0) === 1 ? '' : 's'} declared</div></div>${s.is_current ? '<span class="status-badge status-live">CURRENT</span>' : ''}</div>
                ${s.champion_department_name ? `<div class="sf-meta" style="color:var(--gold);margin-top:10px">Declared lead: ${escapeHtml(s.champion_department_name)}</div>` : ''}
                <div class="sf-actions"><button class="btn btn-secondary btn-sm" type="button" onclick="editSeason(${s.id})">Edit</button><button class="btn btn-secondary btn-sm" type="button" onclick="viewSummary(${s.id})">Manage</button></div>
            </div>`).join('');
        }

        async function startSeason() {
            const name = document.getElementById('sf-name').value.trim();
            const year = parseInt(document.getElementById('sf-year').value, 10);
            if (!name || !year) return showMessage('Name and year are required.', true);
            const res = await api('/sport-fest/start-new-season', {
                method: 'POST', body: JSON.stringify({
                    name, year, theme: document.getElementById('sf-theme').value.trim() || null,
                    description: document.getElementById('sf-description').value.trim() || null
                })
            });
            showMessage(res.message || (res.success ? 'Sport Fest started.' : 'Could not start Sport Fest'), !res.success);
            if (res.success) await loadSeasons();
        }

        async function editSeason(id) {
            const s = seasons.find(x => Number(x.id) === Number(id));
            if (!s) return;
            const name = await Modal.prompt('Sport Fest name:', s.name, 'Edit Sport Fest');
            if (name === null) return;
            const res = await api(`/sport-fest/${id}`, {
                method: 'PUT', body: JSON.stringify({
                    name: name.trim() || s.name, year: s.year, theme: s.theme || null,
                    description: s.description || null, status: s.status || 'upcoming'
                })
            });
            showMessage(res.message || (res.success ? 'Sport Fest updated.' : 'Could not update Sport Fest'), !res.success);
            if (res.success) await loadSeasons();
        }

        async function viewSummary(id) {
            const res = await api(`/sport-fest/${id}/summary`);
            if (!res.success) return showMessage(res.message || 'Could not load summary', true);
            const { event, leaderboard = [], champions = [], tournaments = [] } = res.data;
            const ranksByDivision = {};
            const standingsRows = leaderboard.map(d => {
                const division = d.division || 'unassigned';
                ranksByDivision[division] = (ranksByDivision[division] || 0) + 1;
                return `<tr>
                    <td>${ranksByDivision[division]}</td>
                    <td>${escapeHtml(division.replace(/_/g, ' '))}</td>
                    <td>${escapeHtml(d.name)}</td>
                    <td>${Number(d.total_points) || 0}</td>
                    <td>${Number(d.gold) || 0} / ${Number(d.silver) || 0} / ${Number(d.bronze) || 0}</td>
                </tr>`;
            }).join('');
            const championRows = champions.map(c => `<tr>
                <td>${escapeHtml(String(c.division || '').replace(/_/g, ' '))}</td>
                <td>${escapeHtml(c.name)}</td>
                <td>${Number(c.total_points) || 0}</td>
            </tr>`).join('');
            const tournamentRows = tournaments.map(t => `<tr>
                <td>${escapeHtml(t.tournament_name)}</td>
                <td>${escapeHtml(t.sport_name || '')}</td>
                <td>${escapeHtml(t.winner_department || t.status || 'No result')}</td>
            </tr>`).join('');

            document.getElementById('season-manager-title').textContent = `${event.name} · ${event.year}`;
            document.getElementById('season-manager-body').innerHTML = `
                <div class="sf-meta" style="margin-bottom:18px">${escapeHtml(event.status || 'Archived season')}</div>
                <section class="sf-archive-section">
                    <h3>Champions</h3>
                    <table class="sf-archive-table"><thead><tr><th>Division</th><th>Department</th><th>Points</th></tr></thead>
                    <tbody>${championRows || '<tr><td colspan="3">No champions declared.</td></tr>'}</tbody></table>
                </section>
                <section class="sf-archive-section">
                    <h3>Standings</h3>
                    <table class="sf-archive-table"><thead><tr><th>Rank</th><th>Division</th><th>Department</th><th>Points</th><th>G / S / B</th></tr></thead>
                    <tbody>${standingsRows || '<tr><td colspan="5">No standings recorded.</td></tr>'}</tbody></table>
                </section>
                <section class="sf-archive-section">
                    <h3>Tournaments</h3>
                    <table class="sf-archive-table"><thead><tr><th>Tournament</th><th>Sport</th><th>Winner / Status</th></tr></thead>
                    <tbody>${tournamentRows || '<tr><td colspan="3">No tournaments linked.</td></tr>'}</tbody></table>
                </section>`;
            Modal.open('modal-season-manager');
        }

        function showMessage(message, error) {
            const el = document.getElementById('sf-message');
            el.textContent = message;
            el.style.color = error ? 'var(--red)' : 'var(--green)';
        }
        function escapeHtml(value) { return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
</body>

</html>
