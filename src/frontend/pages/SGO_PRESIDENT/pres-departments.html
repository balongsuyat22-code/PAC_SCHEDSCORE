<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Departments</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/sgo_president.css">
    <style>
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px
        }

        .dept-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all .2s
        }

        .dept-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .3)
        }

        .dept-card-accent {
            height: 6px
        }

        .dept-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px
        }

        .dept-logo {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
            position: relative
        }

        .dept-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px
        }

        .dept-logo-overlay {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: rgba(0, 0, 0, .6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: opacity .15s;
            cursor: pointer;
            color: #fff
        }

        .dept-logo:hover .dept-logo-overlay {
            opacity: 1
        }

        .dept-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center
        }

        .dept-code {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .dept-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--border)
        }

        .dept-stat {
            padding: 12px 8px;
            text-align: center;
            border-right: 1px solid var(--border)
        }

        .dept-stat:last-child {
            border-right: none
        }

        .dept-stat-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900
        }

        .dept-stat-lbl {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1px
        }

        .dept-actions {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid rgba(255, 80, 80, .45);
            color: #ff6b6b;
        }

        .btn-danger-outline:hover {
            background: rgba(255, 80, 80, .12);
            border-color: #ff6b6b;
            color: #ff8a8a;
        }

        .vs-section {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px
        }

        .vs-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 16px
        }

        .vs-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .vs-select {
            flex: 1;
            min-width: 140px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            outline: none;
            cursor: pointer
        }

        .vs-vs-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--muted)
        }

        .vs-display {
            display: none;
            background: var(--bg3);
            border-radius: 12px;
            padding: 24px;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center
        }

        .vs-display.visible {
            display: flex
        }

        .vs-side {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px
        }

        .vs-logo {
            width: 88px;
            height: 88px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            overflow: hidden
        }

        .vs-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .vs-dept-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center
        }

        .vs-pts {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 34px;
            font-weight: 900;
            color: var(--gold)
        }

        .vs-center {
            text-align: center;
            flex-shrink: 0
        }

        .vs-big {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 52px;
            font-weight: 900;
            color: var(--muted);
            line-height: 1
        }

        .logo-preview {
            width: 88px;
            height: 88px;
            border-radius: 16px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--muted);
            overflow: hidden;
            border: 2px dashed var(--border);
            cursor: pointer
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px
        }

        @media(max-width:600px) {
            .vs-section {
                padding: 16px
            }

            .vs-big {
                font-size: 36px
            }

            .dept-grid {
                grid-template-columns: 1fr
            }

            .dept-actions {
                flex-direction: column
            }

            .dept-actions .btn {
                width: 100%;
                justify-content: center
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center">
                <button class="burger-menu" onclick="toggleSidebar()" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title">Departments</div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-secondary btn-sm" onclick="loadPage()">Refresh</button>
                <button class="btn btn-primary btn-sm" onclick="openCreate()">+ New Department</button>
            </div>
        </div>
        <div class="content">
            <div class="page-header">
                <div class="page-title">Departments</div>
                <div class="page-sub">Manage participating departments — standings update automatically as results are
                    finalized</div>
            </div>

            <div class="vs-section">
                <div class="vs-title">Head-to-Head Comparison</div>
                <div class="vs-selector">
                    <select class="vs-select" id="vs-a" onchange="updateVS()">
                        <option value="">Select A...</option>
                    </select>
                    <div class="vs-vs-label">VS</div>
                    <select class="vs-select" id="vs-b" onchange="updateVS()">
                        <option value="">Select B...</option>
                    </select>
                </div>
                <div class="vs-display" id="vs-display">
                    <div class="vs-side" id="vs-side-a"></div>
                    <div class="vs-center">
                        <div class="vs-big">VS</div>
                        <div id="vs-h2h" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
                    </div>
                    <div class="vs-side" id="vs-side-b"></div>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:20px">
                <input id="f-search" class="form-input" placeholder="Search departments..." oninput="applyFilter()"
                    style="flex:1">
            </div>
            <div class="dept-grid" id="dept-grid">
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-text">Loading...</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-dept" onclick="if(event.target===this)Modal.close('modal-dept')">
        <div class="modal" style="max-width:520px">
            <div class="modal-header">
                <div class="modal-title" id="dept-modal-title">New Department</div>
                <button class="modal-close" onclick="Modal.close('modal-dept')">X</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="dept-edit-id">
                <div class="form-group">
                    <label class="form-label">Logo</label>
                    <div class="logo-preview" id="logo-preview" onclick="document.getElementById('logo-file').click()">
                        Click to upload</div>
                    <input type="file" id="logo-file" accept="image/*" style="display:none"
                        onchange="previewLogo(this)">
                    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                        <input type="url" id="dept-logo-url" class="form-input" placeholder="Or paste image URL..."
                            style="flex:1;min-width:160px">
                        <button class="btn btn-secondary btn-sm" onclick="applyLogoUrl()">Preview</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Full Name *</label><input type="text"
                            id="dept-name" class="form-input" placeholder="e.g. College of Engineering"></div>
                    <div class="form-group"><label class="form-label">Short Name</label><input type="text"
                            id="dept-short" class="form-input" placeholder="e.g. COE"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Code *</label><input type="text" id="dept-code"
                            class="form-input" placeholder="e.g. COE" oninput="this.value=this.value.toUpperCase()">
                    </div>
                    <div class="form-group"><label class="form-label">Theme Color</label><input type="color"
                            id="dept-color" class="form-input" value="#8B5CF6" style="height:44px;padding:6px"></div>
                </div>
                <div class="form-group"><label class="form-label">Description</label><textarea id="dept-desc"
                        class="form-textarea" placeholder="Optional description..."></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label">Division</label><select id="dept-division"
                            class="form-select">
                            <option value="">No division</option>
                            <option value="junior_high">Junior High</option>
                            <option value="senior_high">Senior High</option>
                            <option value="college">College</option>
                        </select></div>
                    <label class="form-check" style="align-self:end;padding-bottom:12px">
                        <input type="checkbox" id="dept-exhibition"> Exhibition only (no championship points)
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-dept')">Cancel</button>
                <button class="btn btn-primary" id="dept-save-btn" onclick="saveDept()">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-detail" onclick="if(event.target===this)Modal.close('modal-detail')">
        <div class="modal" style="max-width:580px">
            <div class="modal-header">
                <div class="modal-title" id="detail-title">Details</div>
                <button class="modal-close" onclick="Modal.close('modal-detail')">X</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-detail')">Close</button>
                <button class="btn btn-danger-outline btn-sm" id="detail-delete-btn">Delete</button>
                <button class="btn btn-primary" id="detail-edit-btn">Edit</button>
            </div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        let allDepts = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = Auth.requireAuth('sgo_president');
            if (!user) return;
            renderSidebar('departments');
            await loadPage();
        });

        async function loadPage() {
            const res = await api('/departments');
            if (!res.success) return;
            allDepts = res.data || [];
            renderGrid(allDepts);
            populateVS();
        }

        function applyFilter() {
            const q = document.getElementById('f-search').value.toLowerCase();
            renderGrid(allDepts.filter(d =>
                (d.name + d.code + (d.short_name || '')).toLowerCase().includes(q)
            ));
        }

        function renderGrid(depts) {
            const el = document.getElementById('dept-grid');
            if (!depts.length) {
                el.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">No departments found.</div></div>`;
                return;
            }
            el.innerHTML = depts.map(d => {
                const init = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                const logo = d.logo_url
                    ? `<img src="${d.logo_url}" alt="" onerror="this.style.display='none'"><span style="display:none">${init}</span>`
                    : `<span>${init}</span>`;
                return `
                <div class="dept-card">
                    <div class="dept-card-accent" style="background:${d.color}"></div>
                    <div class="dept-card-body">
                        <div class="dept-logo" style="background:${d.logo_url ? d.color + '20' : d.color};border:${d.logo_url ? '2px solid ' + d.color + '40' : 'none'}" onclick="openEdit(${d.id})">
                            ${logo}
                            <div class="dept-logo-overlay">Edit</div>
                        </div>
                        <div class="dept-name">${d.name}</div>
                        <div class="dept-code">${d.short_name || d.code}</div>
                    </div>
                    <div class="dept-stats">
                        <div class="dept-stat">
                            <div class="dept-stat-val" style="color:var(--gold)">${d.total_points || 0}</div>
                            <div class="dept-stat-lbl">Points</div>
                        </div>
                        <div class="dept-stat">
                            <div class="dept-stat-val" style="color:#FFD700">${d.gold_medals || 0}</div>
                            <div class="dept-stat-lbl">Gold</div>
                        </div>
                        <div class="dept-stat">
                            <div class="dept-stat-val" style="color:var(--muted)">${d.total_members || 0}</div>
                            <div class="dept-stat-lbl">Members</div>
                        </div>
                    </div>
                    <div class="dept-actions">
                        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="viewDetail(${d.id})">View</button>
                        <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEdit(${d.id})">Edit</button>
                        <button class="btn btn-danger-outline btn-sm" style="flex:1" onclick="deleteDept(${d.id})">Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        function populateVS() {
            const opts = allDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            ['vs-a', 'vs-b'].forEach(id => {
                document.getElementById(id).innerHTML = '<option value="">Select...</option>' + opts;
            });
        }

        function updateVS() {
            const aId = parseInt(document.getElementById('vs-a').value);
            const bId = parseInt(document.getElementById('vs-b').value);
            const disp = document.getElementById('vs-display');
            if (!aId || !bId || aId === bId) {
                disp.classList.remove('visible');
                return;
            }
            const a = allDepts.find(d => d.id === aId);
            const b = allDepts.find(d => d.id === bId);
            disp.classList.add('visible');
            document.getElementById('vs-side-a').innerHTML = renderVSSide(a);
            document.getElementById('vs-side-b').innerHTML = renderVSSide(b);
            document.getElementById('vs-h2h').innerHTML = `Gold ${a.gold_medals || 0} vs ${b.gold_medals || 0}`;
        }

        function renderVSSide(d) {
            const init = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const logo = d.logo_url ? `<img src="${d.logo_url}" alt="">` : `<span>${init}</span>`;
            return `
                <div class="vs-logo" style="background:${d.color || '#555'}">${logo}</div>
                <div class="vs-dept-name" style="color:${d.color}">${d.name}</div>
                <div class="vs-pts">${d.total_points || 0}</div>
                <div style="font-size:11px;color:var(--muted)">points</div>
                <div style="font-size:14px">G ${d.gold_medals || 0} · S ${d.silver_medals || 0} · B ${d.bronze_medals || 0}</div>`;
        }

        async function viewDetail(id) {
            const d = allDepts.find(x => x.id === id);
            if (!d) return;
            document.getElementById('detail-title').textContent = d.name;
            document.getElementById('detail-edit-btn').onclick = () => {
                Modal.close('modal-detail');
                openEdit(id);
            };
            document.getElementById('detail-delete-btn').onclick = () => {
                Modal.close('modal-detail');
                deleteDept(id);
            };

            const scoresRes = await api(`/departments/${id}/scores`);
            const init = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const logoHtml = d.logo_url
                ? `<img src="${d.logo_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`
                : `<span style="font-size:32px;font-weight:900;color:#fff">${init}</span>`;

            document.getElementById('detail-body').innerHTML = `
                <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap">
                    <div style="width:80px;height:80px;border-radius:16px;background:${d.logo_url ? d.color + '20' : d.color};border:${d.logo_url ? '2px solid ' + d.color + '40' : 'none'};display:flex;align-items:center;justify-content:center;overflow:hidden">${logoHtml}</div>
                    <div>
                        <div style="font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900">${d.name}</div>
                        <div style="font-size:13px;color:var(--muted)">${d.short_name || d.code} · ${d.description || 'No description'}</div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;margin-bottom:20px">
                    ${[['Points', d.total_points || 0, 'var(--gold)'], ['Gold', d.gold_medals || 0, '#FFD700'], ['Silver', d.silver_medals || 0, '#C0C0C0'], ['Members', d.total_members || 0, 'var(--text)']].map(([l, v, c]) =>
                `<div style="background:var(--bg3);border-radius:8px;padding:12px;text-align:center"><div style="font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;color:${c}">${v}</div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">${l}</div></div>`
            ).join('')}
                </div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px">RECENT RESULTS</div>
                ${(scoresRes.data || []).slice(0, 5).map(s => `
                    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
                        <span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;min-width:56px">${s.medal || '—'}</span>
                        <div style="flex:1">
                            <div style="font-size:13px;font-weight:600">${s.tournament_name}</div>
                            <div style="font-size:11px;color:var(--muted)">${s.sport_name}</div>
                        </div>
                        <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--gold)">+${s.sport_fest_points}</div>
                    </div>
                `).join('') || '<div style="color:var(--muted);font-size:13px;padding:12px 0">No results yet</div>'}`;
            Modal.open('modal-detail');
        }

        function openCreate() {
            document.getElementById('dept-modal-title').textContent = 'New Department';
            document.getElementById('dept-save-btn').textContent = 'Create';
            document.getElementById('dept-edit-id').value = '';
            ['dept-name', 'dept-short', 'dept-code', 'dept-desc', 'dept-logo-url'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('dept-color').value = '#8B5CF6';
            document.getElementById('dept-division').value = '';
            document.getElementById('dept-exhibition').checked = false;
            document.getElementById('logo-preview').innerHTML = 'Click to upload';
            document.getElementById('logo-file').value = '';
            Modal.open('modal-dept');
        }

        function openEdit(id) {
            const d = allDepts.find(x => x.id === id);
            if (!d) return;
            document.getElementById('dept-modal-title').textContent = d.name;
            document.getElementById('dept-save-btn').textContent = 'Save Changes';
            document.getElementById('dept-edit-id').value = id;
            document.getElementById('dept-name').value = d.name;
            document.getElementById('dept-short').value = d.short_name || '';
            document.getElementById('dept-code').value = d.code;
            document.getElementById('dept-color').value = d.color || '#8B5CF6';
            document.getElementById('dept-desc').value = d.description || '';
            document.getElementById('dept-division').value = d.division || '';
            document.getElementById('dept-exhibition').checked = Number(d.is_exhibition) === 1;
            document.getElementById('dept-logo-url').value = d.logo_url || '';
            document.getElementById('logo-file').value = '';
            const prev = document.getElementById('logo-preview');
            if (d.logo_url) {
                prev.innerHTML = `<img src="${d.logo_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
            } else {
                const init = (d.short_name || d.name).split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
                prev.innerHTML = `<div style="width:100%;height:100%;border-radius:14px;background:${d.color};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:#fff">${init}</div>`;
            }
            Modal.open('modal-dept');
        }

        function previewLogo(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('logo-preview').innerHTML =
                    `<img src="${e.target.result}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
            };
            reader.readAsDataURL(file);
        }

        function applyLogoUrl() {
            const url = document.getElementById('dept-logo-url').value.trim();
            if (!url) return;
            document.getElementById('logo-preview').innerHTML =
                `<img src="${url}" alt="" onerror="this.parentElement.textContent='Invalid URL'" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
        }

        async function saveDept() {
            const id = document.getElementById('dept-edit-id').value;
            const name = document.getElementById('dept-name').value.trim();
            const code = document.getElementById('dept-code').value.trim();
            if (!name || !code) {
                Toast.show('Name and code are required', 'error');
                return;
            }
            const formData = new FormData();
            formData.append('name', name);
            formData.append('code', code);
            formData.append('short_name', document.getElementById('dept-short').value.trim());
            formData.append('color', document.getElementById('dept-color').value);
            formData.append('description', document.getElementById('dept-desc').value.trim());
            formData.append('division', document.getElementById('dept-division').value);
            formData.append('is_exhibition', document.getElementById('dept-exhibition').checked ? '1' : '0');
            formData.append('logo_url', document.getElementById('dept-logo-url').value.trim());
            const file = document.getElementById('logo-file').files[0];
            if (file) formData.append('logo', file);

            const res = id
                ? await api(`/departments/${id}`, { method: 'PUT', body: formData })
                : await api('/departments', { method: 'POST', body: formData });

            Toast.show(res.message || (res.success ? 'Saved!' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) {
                Modal.close('modal-dept');
                await loadPage();
            }
        }

        async function deleteDept(id) {
            const d = allDepts.find(x => x.id === id);
            if (!d) return;

            const ok = confirm(
                `Delete "${d.name}" permanently?\n\n` +
                `This removes the department and its related records.`
            );
            if (!ok) return;

            const res = await api(`/departments/${id}`, { method: 'DELETE' });
            Toast.show(
                res.message || (res.success ? 'Deleted' : 'Error'),
                res.success ? 'success' : 'error'
            );
            if (res.success) await loadPage();
        }
    </script>
</body>

</html>
