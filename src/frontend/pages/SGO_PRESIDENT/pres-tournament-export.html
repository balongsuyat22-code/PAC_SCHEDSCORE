<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Export Results</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/sgo_president.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .export-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .export-toolbar select {
            flex: 1;
            min-width: 220px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
        }

        .mode-toggle {
            display: inline-flex;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 16px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: .3px;
            text-transform: uppercase;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            transition: all .15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: var(--gold, #f5b800);
            color: #000;
        }

        .season-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .season-banner strong {
            color: var(--text);
        }

        /* ===== Print scope panel ===== */
        .scope-panel {
            display: none;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            gap: 16px;
            flex-direction: column;
        }

        .scope-panel.visible {
            display: flex;
        }

        .scope-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .scope-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--muted);
            min-width: 90px;
        }

        .scope-chip {
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 100px;
            cursor: pointer;
            transition: all .15s;
            user-select: none;
        }

        .scope-chip:hover {
            border-color: var(--gold, #f5b800);
        }

        .scope-chip.active {
            background: var(--gold, #f5b800);
            color: #000;
            border-color: var(--gold, #f5b800);
        }

        .scope-chip.section-chip.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .download-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .sheet {
            background: #fff;
            color: #111;
            border-radius: 12px;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
        }

        .sheet-header {
            padding: 28px 32px 20px;
            border-bottom: 3px solid #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .sheet-header h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .sheet-header .sub {
            font-size: 12.5px;
            color: #555;
            margin-top: 4px;
        }

        .sheet-badge {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            background: #16a34a;
            padding: 6px 14px;
            border-radius: 100px;
            white-space: nowrap;
        }

        .sheet-badge.pending {
            background: #a16207;
        }

        .sheet-body {
            padding: 24px 32px 32px;
        }

        .sheet-section-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
            margin: 22px 0 10px;
            border-left: 4px solid #111;
            padding-left: 10px;
        }

        .sheet-section-title:first-child {
            margin-top: 0;
        }

        .sheet-section-title.sub-div {
            margin-top: 18px;
            font-size: 14px;
            border-left-color: #b45309;
        }

        table.sheet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table.sheet-table th,
        table.sheet-table td {
            padding: 8px 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        table.sheet-table th {
            background: #f2f2f2;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
        }

        table.sheet-table tr.winner-row td {
            background: #f0fdf4;
            font-weight: 600;
        }

        .medal-gold {
            color: #b45309;
            font-weight: 800;
        }

        .medal-silver {
            color: #52525b;
            font-weight: 800;
        }

        .medal-bronze {
            color: #92400e;
            font-weight: 800;
        }

        .champions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .champion-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, #fff7e0, #fff);
            border: 2px solid #f5b800;
            border-radius: 12px;
            padding: 18px 20px;
        }

        .champion-card .badge-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
        }

        .champion-card .champ-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 900;
        }

        .champion-card .champ-sub {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .champion-card .champ-division {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #92400e;
            margin-bottom: 2px;
        }

        .champion-card.unofficial {
            border-color: #ccc;
            background: #f7f7f7;
        }

        .champion-card.unofficial .champ-division {
            color: #666;
        }

        .tourney-block {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .tourney-block-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .tourney-block-head h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 800;
        }

        .tourney-block-head .tag {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #666;
            background: #f2f2f2;
            padding: 3px 8px;
            border-radius: 100px;
        }

        .tourney-status-tag {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 100px;
        }

        .tourney-status-tag.completed {
            background: #dcfce7;
            color: #166534;
        }

        .tourney-status-tag.other {
            background: #fef3c7;
            color: #92400e;
        }

        .sheet-note {
            font-size: 11.5px;
            color: #666;
            margin: 4px 0 10px;
            font-style: italic;
        }

        .sheet-footer {
            margin-top: 26px;
            padding-top: 14px;
            border-top: 1px dashed #ccc;
            font-size: 11px;
            color: #666;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .sheet,
            .sheet * {
                visibility: visible;
            }

            .sheet {
                position: absolute;
                top: 0;
                left: 0;
                box-shadow: none;
                width: 100%;
                max-width: 100%;
            }

            .sidebar,
            .topbar,
            .export-toolbar,
            .mode-toggle,
            .season-banner,
            .scope-panel,
            .download-bar,
            .page-header {
                display: none !important;
            }
        }

        @media (max-width: 640px) {

            .sheet-header,
            .sheet-body {
                padding-left: 18px;
                padding-right: 18px;
            }

            .champion-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center">
                <button class="burger-menu" onclick="toggleSidebar()" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title">Export Results</div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-secondary btn-sm" id="btn-print" style="display:none" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Print
                </button>
            </div>
        </div>
        <div class="content">
            <div class="page-header">
                <div class="page-title">Export Finalized Results</div>
                <div class="page-sub">
                    Season report separates Junior High &amp; Senior High standings.
                    Tournaments are shared — filter which divisions and sections to print.
                </div>
            </div>

            <div id="season-banner" class="season-banner">Loading current season…</div>

            <div class="mode-toggle" role="tablist">
                <button class="mode-btn active" id="mode-season" onclick="switchMode('season')">
                    <i class="fa-solid fa-trophy"></i> Season Champion Report
                </button>
                <button class="mode-btn" id="mode-single" onclick="switchMode('single')">
                    <i class="fa-solid fa-list-check"></i> Individual Tournament
                </button>
            </div>

            <!-- Multi-select print scope -->
            <div id="scope-panel" class="scope-panel">
                <div class="scope-row" id="division-chips-row">
                    <span class="scope-label"><i class="fa-solid fa-users"></i> Divisions</span>
                    <!-- chips injected -->
                </div>
                <div class="scope-row" id="section-chips-row">
                    <span class="scope-label"><i class="fa-solid fa-list"></i> Include</span>
                    <button type="button" class="scope-chip section-chip active" data-section="champions"
                        onclick="toggleSection('champions')">Champions</button>
                    <button type="button" class="scope-chip section-chip active" data-section="standings"
                        onclick="toggleSection('standings')">Dept. Standings</button>
                    <button type="button" class="scope-chip section-chip active" data-section="tournaments"
                        onclick="toggleSection('tournaments')">Tournament Rankings</button>
                    <button type="button" class="scope-chip section-chip active" data-section="matches"
                        onclick="toggleSection('matches')">Matches / Schedule</button>
                </div>
            </div>

            <div class="export-toolbar" id="single-toolbar" style="display:none">
                <select id="t-select" onchange="loadSingleExport()">
                    <option value="">Select a finalized tournament...</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="loadTournamentList()">Refresh List</button>
            </div>

            <div class="download-bar" id="download-bar" style="display:none">
                <button class="btn btn-secondary btn-sm" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Print
                </button>
                <button class="btn btn-primary btn-sm" onclick="downloadPdf(event)">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF
                </button>
                <button class="btn btn-secondary btn-sm" onclick="downloadWord()">
                    <i class="fa-solid fa-file-word"></i> Download Word
                </button>
            </div>

            <div id="sheet-host">
                <div class="empty-state">
                    <div class="empty-text">Loading season report...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        let currentMode = 'season';
        let currentSheetTitle = 'export';
        let seasonDataCache = null;

        // Multi-select state
        let selectedDivisions = new Set();   // empty = treat as all (until chips built)
        let selectedSections = new Set(['champions', 'standings', 'tournaments', 'matches']);
        let allKnownDivisions = [];          // ordered list of division keys

        document.addEventListener('DOMContentLoaded', async () => {
            const allowedRoles = ['admin', 'sgo_president'];
            const user = (typeof Auth !== 'undefined' && Auth.getUser) ? Auth.getUser() : null;
            if (!user || !allowedRoles.includes(user.role)) {
                Auth.requireAuth('sgo_president');
                return;
            }
            if (typeof renderSidebar === 'function') renderSidebar('reports');

            await loadTournamentList();

            const qsId = new URLSearchParams(window.location.search).get('tournament_id');
            if (qsId) {
                switchMode('single');
                document.getElementById('t-select').value = qsId;
                await loadSingleExport();
            } else {
                await loadSeasonExport();
            }
        });

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-season').classList.toggle('active', mode === 'season');
            document.getElementById('mode-single').classList.toggle('active', mode === 'single');
            document.getElementById('single-toolbar').style.display = mode === 'single' ? 'flex' : 'none';

            const scopePanel = document.getElementById('scope-panel');
            if (mode === 'season') {
                scopePanel.classList.add('visible');
                loadSeasonExport();
            } else {
                scopePanel.classList.remove('visible');
                const id = document.getElementById('t-select').value;
                if (id) {
                    loadSingleExport();
                } else {
                    document.getElementById('sheet-host').innerHTML =
                        `<div class="empty-state"><div class="empty-text">Select a finalized tournament above to preview its results sheet.</div></div>`;
                    document.getElementById('download-bar').style.display = 'none';
                    document.getElementById('btn-print').style.display = 'none';
                }
            }
        }

        async function loadTournamentList() {
            const res = await api('/reports/current-season/tournaments');
            const sel = document.getElementById('t-select');
            const banner = document.getElementById('season-banner');
            const current = sel.value;

            if (!res.success) {
                banner.textContent = 'Could not load the current season.';
                return;
            }

            const rows = res.data || [];
            sel.innerHTML = '<option value="">Select a finalized tournament...</option>' +
                rows.map(t => `<option value="${t.id}">${t.name} — ${t.sport_name}</option>`).join('');
            if (current) sel.value = current;

            if (!res.meta || !res.meta.sport_fest_id) {
                banner.innerHTML = `<span><i class="fa-solid fa-circle-exclamation"></i> No active Sport Fest season found. Start a season first.</span>`;
            } else if (!rows.length) {
                banner.innerHTML = `<span>No finalized tournaments in the current season yet.</span>`;
            }
        }

        async function loadSeasonExport() {
            const host = document.getElementById('sheet-host');
            const printBtn = document.getElementById('btn-print');
            const downloadBar = document.getElementById('download-bar');
            const banner = document.getElementById('season-banner');
            const scopePanel = document.getElementById('scope-panel');

            host.innerHTML = `<div class="empty-state"><div class="empty-text">Loading...</div></div>`;
            downloadBar.style.display = 'none';
            printBtn.style.display = 'none';

            if (!seasonDataCache) {
                const res = await api('/reports/sportfest/export');
                if (!res.success) {
                    host.innerHTML = `<div class="empty-state"><div class="empty-text">${res.message || 'Failed to load the season report.'}</div></div>`;
                    banner.innerHTML = `<span><i class="fa-solid fa-circle-exclamation"></i> ${res.message || 'No active season found.'}</span>`;
                    scopePanel.classList.remove('visible');
                    return;
                }
                seasonDataCache = res.data;
            }

            const data = seasonDataCache;
            const fest = data.sport_fest;
            banner.innerHTML = `Current season: <strong>${fest.name}${fest.year ? ' (' + fest.year + ')' : ''}</strong>`;

            buildDivisionChips(data);
            applyScopeAndRender();
            downloadBar.style.display = 'flex';
            printBtn.style.display = '';
            scopePanel.classList.add('visible');
        }

        /** Build department-name → division map from leaderboard (and champions). */
        function buildDeptDivisionMap(data) {
            const map = {};
            (data.leaderboard || []).forEach(d => {
                if (d.name && d.division) map[d.name.trim().toLowerCase()] = d.division;
            });
            const champs = (Array.isArray(data.champions) && data.champions.length)
                ? data.champions
                : (data.champion ? [data.champion] : []);
            champs.forEach(c => {
                if (c.name && c.division) map[c.name.trim().toLowerCase()] = c.division;
            });
            return map;
        }

        function resolveStandingDivision(standing, deptMap) {
            if (standing.division) return standing.division;
            const key = (standing.department_name || standing.name || '').trim().toLowerCase();
            return deptMap[key] || null;
        }

        function collectDivisions(data) {
            const set = new Set();
            (data.leaderboard || []).forEach(d => { if (d.division) set.add(d.division); });
            const champs = (Array.isArray(data.champions) && data.champions.length)
                ? data.champions
                : (data.champion ? [data.champion] : []);
            champs.forEach(c => { if (c.division) set.add(c.division); });
            // Prefer a stable order: junior* first, then senior*, then others alpha
            const list = [...set];
            list.sort((a, b) => {
                const score = (x) => {
                    const s = String(x).toLowerCase();
                    if (s.includes('junior')) return 0;
                    if (s.includes('senior')) return 1;
                    return 2;
                };
                const da = score(a), db = score(b);
                if (da !== db) return da - db;
                return String(a).localeCompare(String(b));
            });
            return list;
        }

        function buildDivisionChips(data) {
            const row = document.getElementById('division-chips-row');
            // Clear old chips (keep label)
            row.querySelectorAll('.scope-chip').forEach(el => el.remove());

            allKnownDivisions = collectDivisions(data);

            // "All" chip
            const allBtn = document.createElement('button');
            allBtn.type = 'button';
            allBtn.className = 'scope-chip active';
            allBtn.dataset.div = '__all__';
            allBtn.textContent = 'All Divisions';
            allBtn.onclick = () => selectAllDivisions();
            row.appendChild(allBtn);

            if (!allKnownDivisions.length) {
                selectedDivisions = new Set();
                return;
            }

            // If nothing selected yet, select all
            if (selectedDivisions.size === 0) {
                allKnownDivisions.forEach(d => selectedDivisions.add(d));
            }

            allKnownDivisions.forEach(div => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'scope-chip' + (selectedDivisions.has(div) ? ' active' : '');
                btn.dataset.div = div;
                btn.textContent = formatDivisionLabel(div);
                btn.onclick = () => toggleDivision(div);
                row.appendChild(btn);
            });

            syncAllChipState();
        }

        function selectAllDivisions() {
            selectedDivisions = new Set(allKnownDivisions);
            document.querySelectorAll('#division-chips-row .scope-chip').forEach(chip => {
                if (chip.dataset.div === '__all__') chip.classList.add('active');
                else chip.classList.add('active');
            });
            applyScopeAndRender();
        }

        function toggleDivision(div) {
            if (selectedDivisions.has(div)) {
                // Don't allow deselecting the last one
                if (selectedDivisions.size <= 1) return;
                selectedDivisions.delete(div);
            } else {
                selectedDivisions.add(div);
            }
            document.querySelectorAll('#division-chips-row .scope-chip').forEach(chip => {
                if (chip.dataset.div === '__all__') return;
                chip.classList.toggle('active', selectedDivisions.has(chip.dataset.div));
            });
            syncAllChipState();
            applyScopeAndRender();
        }

        function syncAllChipState() {
            const allChip = document.querySelector('#division-chips-row .scope-chip[data-div="__all__"]');
            if (!allChip) return;
            const allSelected = allKnownDivisions.length > 0 &&
                allKnownDivisions.every(d => selectedDivisions.has(d));
            allChip.classList.toggle('active', allSelected);
        }

        function toggleSection(section) {
            if (selectedSections.has(section)) {
                if (selectedSections.size <= 1) return; // keep at least one
                selectedSections.delete(section);
            } else {
                selectedSections.add(section);
            }
            document.querySelectorAll('#section-chips-row .section-chip').forEach(chip => {
                chip.classList.toggle('active', selectedSections.has(chip.dataset.section));
            });
            applyScopeAndRender();
        }

        function applyScopeAndRender() {
            if (!seasonDataCache) return;
            const host = document.getElementById('sheet-host');
            const fest = seasonDataCache.sport_fest;

            const divPart = (selectedDivisions.size === 0 || selectedDivisions.size === allKnownDivisions.length)
                ? 'all-divisions'
                : [...selectedDivisions].map(d => String(d).replace(/[^a-z0-9]+/gi, '_')).join('-');
            currentSheetTitle = `${fest.name}-${divPart}-season-report`.replace(/[^a-z0-9\-]+/gi, '_');

            host.innerHTML = renderSeasonSheet(seasonDataCache, {
                divisions: selectedDivisions,
                sections: selectedSections,
                allDivisions: allKnownDivisions
            });
        }

        async function loadSingleExport() {
            const id = document.getElementById('t-select').value;
            const host = document.getElementById('sheet-host');
            const printBtn = document.getElementById('btn-print');
            const downloadBar = document.getElementById('download-bar');

            if (!id) {
                host.innerHTML = `<div class="empty-state"><div class="empty-text">Select a finalized tournament above to preview its results sheet.</div></div>`;
                downloadBar.style.display = 'none';
                printBtn.style.display = 'none';
                return;
            }

            host.innerHTML = `<div class="empty-state"><div class="empty-text">Loading...</div></div>`;
            const res = await api(`/reports/tournaments/${id}/export`);
            if (!res.success) {
                host.innerHTML = `<div class="empty-state"><div class="empty-text">${res.message || 'Failed to load export.'}</div></div>`;
                downloadBar.style.display = 'none';
                printBtn.style.display = 'none';
                return;
            }

            currentSheetTitle = `${res.data.tournament.name}-results`.replace(/[^a-z0-9\-]+/gi, '_');
            host.innerHTML = renderSheet(res.data);
            downloadBar.style.display = 'flex';
            printBtn.style.display = '';
        }

        function medalClass(medal) {
            if (!medal) return '';
            const m = medal.toLowerCase();
            if (m.includes('gold')) return 'medal-gold';
            if (m.includes('silver')) return 'medal-silver';
            if (m.includes('bronze')) return 'medal-bronze';
            return '';
        }

        function initialsOf(name = '') {
            return name.split(' ').map(w => w[0] || '').slice(0, 2).join('').toUpperCase() || '?';
        }

        function formatDivisionLabel(division) {
            if (!division) return '';
            return String(division).replace(/_/g, ' ');
        }

        /**
         * @param {object} data
         * @param {{ divisions: Set, sections: Set, allDivisions: string[] }} scope
         */
        function renderSeasonSheet(data, scope) {
            const fest = data.sport_fest;
            const allChampions = (Array.isArray(data.champions) && data.champions.length)
                ? data.champions
                : (data.champion ? [data.champion] : []);
            const finalized = !!data.champion_finalized;
            const deptMap = buildDeptDivisionMap(data);

            const activeDivs = scope.divisions.size
                ? scope.divisions
                : new Set(scope.allDivisions);
            const showAllDivs = activeDivs.size === 0 ||
                (scope.allDivisions.length > 0 && scope.allDivisions.every(d => activeDivs.has(d)));

            // Filter champions by selected divisions
            const champions = allChampions.filter(c =>
                !c.division || activeDivs.has(c.division) || showAllDivs && !scope.allDivisions.length
            );

            // Filter leaderboard by selected divisions
            const leaderboard = (data.leaderboard || []).filter(d =>
                !d.division || activeDivs.has(d.division)
            );

            // Tournaments are SHARED — never drop a tournament just because of division.
            // When filtering divisions, only filter the standing *rows* inside.
            const allTourneys = data.tournaments || [];

            const sections = scope.sections;
            const multiChamp = champions.length > 1;
            const orderedDivs = (scope.allDivisions || []).filter(d => activeDivs.has(d));

            // ----- Champions -----
            let champHtml = '';
            if (sections.has('champions')) {
                const champCards = champions.map((champ) => {
                    const champColor = champ.color || '#f5b800';
                    const divLabel = formatDivisionLabel(champ.division);
                    const isOfficial = finalized && (champ.official !== false);
                    let subText;
                    if (isOfficial) {
                        subText = divLabel
                            ? `Officially declared ${divLabel} Champion`
                            : 'Officially declared Sport Fest Champion';
                    } else {
                        subText = `Currently leading with ${champ.total_points ?? 0} pts — champion not yet officially declared`;
                    }
                    return `
                        <div class="champion-card ${isOfficial ? '' : 'unofficial'}">
                            <div class="badge-circle" style="background:${champColor}">${initialsOf(champ.name)}</div>
                            <div>
                                ${divLabel ? `<div class="champ-division">${divLabel} Division</div>` : ''}
                                <div class="champ-name">🏆 ${champ.name}</div>
                                <div class="champ-sub">${subText}</div>
                            </div>
                        </div>`;
                }).join('');

                const title = multiChamp
                    ? `Overall Champions (${champions.length})`
                    : (champions.length === 1 && champions[0].division
                        ? `${formatDivisionLabel(champions[0].division)} Champion`
                        : 'Overall Champion');

                champHtml = `
                    <div class="sheet-section-title">${title}</div>
                    ${champions.length
                        ? `<div class="champions-grid">${champCards}</div>`
                        : `<div class="empty-state"><div class="empty-text">No champion for the selected division(s).</div></div>`}`;
            }

            // ----- Department Standings (ALWAYS separate Junior / Senior) -----
            let standingsHtml = '';
            if (sections.has('standings')) {
                function renderLbTable(rows) {
                    if (!rows.length) {
                        return `<tr><td colspan="6" style="text-align:center;color:#888">No scores recorded.</td></tr>`;
                    }
                    return rows.map((d, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${d.name}</td>
                            <td class="medal-gold">${d.gold_medals ?? 0}</td>
                            <td class="medal-silver">${d.silver_medals ?? 0}</td>
                            <td class="medal-bronze">${d.bronze_medals ?? 0}</td>
                            <td><strong>${d.total_points ?? 0}</strong></td>
                        </tr>`).join('');
                }

                standingsHtml = `<div class="sheet-section-title">Department Standings</div>`;

                if (orderedDivs.length) {
                    orderedDivs.forEach(div => {
                        const rows = leaderboard.filter(d => d.division === div);
                        // Re-rank within division (in case API ranks were global)
                        const sorted = rows.slice().sort((a, b) =>
                            (Number(b.total_points) || 0) - (Number(a.total_points) || 0)
                        );
                        standingsHtml += `
                            <div class="sheet-section-title sub-div">${formatDivisionLabel(div)} Standings</div>
                            <table class="sheet-table">
                                <thead><tr><th>Rank</th><th>Department</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Points</th></tr></thead>
                                <tbody>${renderLbTable(sorted)}</tbody>
                            </table>`;
                    });

                    const noDiv = leaderboard.filter(d => !d.division);
                    if (noDiv.length) {
                        standingsHtml += `
                            <div class="sheet-section-title sub-div">Other / Unassigned</div>
                            <table class="sheet-table">
                                <thead><tr><th>Rank</th><th>Department</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Points</th></tr></thead>
                                <tbody>${renderLbTable(noDiv)}</tbody>
                            </table>`;
                    }
                } else {
                    // No division data — single table
                    standingsHtml += `
                        <table class="sheet-table">
                            <thead><tr><th>Rank</th><th>Department</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Points</th></tr></thead>
                            <tbody>${renderLbTable(leaderboard)}</tbody>
                        </table>`;
                }
            }

            // ----- Tournaments (shared; filter standing rows by division) -----
            let tourneyHtml = '';
            if (sections.has('tournaments') || sections.has('matches')) {
                function renderTourneyBlock(t, divisionFilter = null) {
                    const isDone = t.status === 'completed';
                    let standings = t.standings || [];

                    if (divisionFilter) {
                        standings = standings.filter(s => {
                            const div = resolveStandingDivision(s, deptMap);
                            return !div || div === divisionFilter;
                        });
                    }

                    // Filter standing rows to selected divisions (using dept map)
                    if (!showAllDivs && activeDivs.size) {
                        standings = standings.filter(s => {
                            const div = resolveStandingDivision(s, deptMap);
                            // Keep row if we can resolve division and it matches, OR if unknown keep when showing mixed
                            if (!div) return true; // unknown → still show (friendly / unassigned)
                            return activeDivs.has(div);
                        });
                    }

                    let standingTable = '';
                    if (sections.has('tournaments')) {
                        const standingRows = standings.map(s => `
                            <tr>
                                <td>${s.rank}</td>
                                <td>${s.department_name}${s.team_name ? ' — ' + s.team_name : ''}${(() => {
                                const div = resolveStandingDivision(s, deptMap);
                                return div && showAllDivs
                                    ? ` <span style="color:#888;font-size:10px">(${formatDivisionLabel(div)})</span>`
                                    : '';
                            })()}</td>
                                <td class="${medalClass(s.medal)}">${s.medal || '—'}</td>
                                <td>${s.sport_fest_points ?? 0}</td>
                            </tr>`).join('') ||
                            `<tr><td colspan="4" style="text-align:center;color:#888">${isDone ? 'No standings for selected division(s).' : 'Not finalized yet.'}</td></tr>`;

                        standingTable = `
                            <table class="sheet-table">
                                <thead><tr><th>Rank</th><th>Department</th><th>Medal</th><th>Points</th></tr></thead>
                                <tbody>${standingRows}</tbody>
                            </table>`;
                    }

                    let matchTable = '';
                    if (sections.has('matches') && Array.isArray(t.matches) && t.matches.length) {
                        // Optionally filter matches to teams in selected divisions
                        let matches = t.matches;
                        if (divisionFilter) {
                            matches = matches.filter(m => {
                                const aDiv = deptMap[(m.dept_a_name || '').trim().toLowerCase()];
                                const bDiv = deptMap[(m.dept_b_name || '').trim().toLowerCase()];
                                return !aDiv && !bDiv || aDiv === divisionFilter || bDiv === divisionFilter;
                            });
                        }
                        if (!showAllDivs && activeDivs.size) {
                            matches = matches.filter(m => {
                                const aDiv = deptMap[(m.dept_a_name || '').trim().toLowerCase()];
                                const bDiv = deptMap[(m.dept_b_name || '').trim().toLowerCase()];
                                // Keep if either side is in selected division, or unknown
                                const aOk = !aDiv || activeDivs.has(aDiv);
                                const bOk = !bDiv || activeDivs.has(bDiv);
                                return aOk || bOk;
                            });
                        }

                        const matchRows = matches.map(m => {
                            const isExhibition = m.bracket_side === 'exhibition' || m.is_friendly;
                            const a = m.dept_a_name || '—';
                            const b = m.dept_b_name || '—';
                            const score = (m.total_score_a != null && m.total_score_b != null)
                                ? `${m.total_score_a} – ${m.total_score_b}`
                                : (m.final_score_display || '—');
                            return `
                            <tr class="${m.winner_department_id ? 'winner-row' : ''}">
                                <td>${isExhibition ? 'Friendly' : `R${m.round_number ?? '—'} / ${m.match_number ?? '—'}`}</td>
                                <td>${a} vs ${b}</td>
                                <td>${score}</td>
                                <td>${isExhibition ? 'Friendly only' : (m.winner_name || (m.status === 'completed' ? '—' : m.status))}</td>
                                <td>${m.venue_name || '—'}</td>
                                <td>${m.scheduled_date ? formatDate(m.scheduled_date) : '—'}${m.scheduled_time ? ' ' + formatTime(m.scheduled_time) : ''}</td>
                            </tr>`;
                        }).join('') ||
                            `<tr><td colspan="6" style="text-align:center;color:#888">No matches for selected division(s).</td></tr>`;

                        matchTable = `
                            <div style="margin-top:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#555">Matches / Schedule</div>
                            <table class="sheet-table">
                                <thead><tr><th>Round/#</th><th>Matchup</th><th>Score</th><th>Winner</th><th>Venue</th><th>Date</th></tr></thead>
                                <tbody>${matchRows}</tbody>
                            </table>`;
                    }

                    // Skip block if nothing to show after filters
                    if (sections.has('tournaments') && !standings.length && !(sections.has('matches') && t.matches?.length)) {
                        // still show tournament header if it has matches for selected div
                        if (!(sections.has('matches') && t.matches?.length)) return '';
                    }

                    return `
                        <div class="tourney-block">
                            <div class="tourney-block-head">
                                <h3>${t.name}</h3>
                                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                                    <span class="tag">${t.sport_name || ''}</span>
                                    <span class="tourney-status-tag ${isDone ? 'completed' : 'other'}">${t.status}</span>
                                </div>
                            </div>
                            <div class="sheet-note">Shared event — Junior &amp; Senior both compete; only same-division matches count for ranking (cross-division = friendly).</div>
                            ${standingTable}
                            ${matchTable}
                        </div>`;
                }

                let blocks = '';
                if (orderedDivs.length) {
                    blocks = orderedDivs.map(div => {
                        const divisionBlocks = allTourneys.map(t => renderTourneyBlock(t, div)).filter(Boolean).join('');
                        return divisionBlocks
                            ? `<div class="sheet-section-title sub-div">${formatDivisionLabel(div)} Tournaments</div>${divisionBlocks}`
                            : '';
                    }).join('');
                } else {
                    blocks = allTourneys.map(t => renderTourneyBlock(t)).filter(Boolean).join('');
                }
                tourneyHtml = `
                    <div class="sheet-section-title">Tournaments This Season (${allTourneys.length})</div>
                    ${blocks || `<div class="empty-state"><div class="empty-text">No tournaments to show for the current filters.</div></div>`}`;
            }

            // ----- Header -----
            const scopeDivLabels = showAllDivs || !orderedDivs.length
                ? 'All Divisions'
                : orderedDivs.map(formatDivisionLabel).join(' + ');
            const badgeLabel = finalized
                ? (multiChamp ? 'Champions Declared' : 'Champion Declared')
                : 'In Progress';

            return `
            <div class="sheet">
                <div class="sheet-header">
                    <div>
                        <h1>${fest.name}${fest.year ? ' — ' + fest.year : ''}</h1>
                        <div class="sub">Sport Fest Results · ${scopeDivLabels}${fest.theme ? ' · ' + fest.theme : ''}</div>
                    </div>
                    <div class="sheet-badge ${finalized ? '' : 'pending'}">${badgeLabel}</div>
                </div>
                <div class="sheet-body">
                    ${champHtml}
                    ${standingsHtml}
                    ${tourneyHtml}
                    <div class="sheet-footer">
                        <span>Exported by ${data.exported_by || '—'} · Scope: ${scopeDivLabels}</span>
                        <span>Generated ${new Date(data.exported_at).toLocaleString('en-PH')}</span>
                    </div>
                </div>
            </div>`;
        }

        function renderSheet(data) {
            const t = data.tournament;

            const matchRows = (data.matches || []).map(m => {
                const isExhibition = m.bracket_side === 'exhibition' || m.is_friendly;
                const a = m.dept_a_name || '—';
                const b = m.dept_b_name || '—';
                const score = (m.total_score_a != null && m.total_score_b != null)
                    ? `${m.total_score_a} – ${m.total_score_b}`
                    : (m.final_score_display || '—');
                const winnerRow = m.winner_department_id ? 'winner-row' : '';
                return `
                <tr class="${winnerRow}">
                    <td>${isExhibition ? 'Friendly' : `R${m.round_number ?? '—'} / ${m.match_number ?? '—'}`}</td>
                    <td>${a} vs ${b}</td>
                    <td>${score}</td>
                    <td>${isExhibition ? 'Friendly only' : (m.winner_name || (m.status === 'completed' ? '—' : m.status))}</td>
                    <td>${m.venue_name || '—'}</td>
                    <td>${m.referee_name || '—'}</td>
                    <td>${m.scheduled_date ? formatDate(m.scheduled_date) : '—'}</td>
                </tr>`;
            }).join('') || `<tr><td colspan="7" style="text-align:center;color:#888">No matches recorded.</td></tr>`;

            const standingRows = (data.standings || []).map(s => `
                <tr>
                    <td>${s.rank}</td>
                    <td>${s.department_name}${s.team_name ? ' — ' + s.team_name : ''}</td>
                    <td class="${medalClass(s.medal)}">${s.medal || '—'}</td>
                    <td>${s.sport_fest_points ?? 0}</td>
                </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:#888">No standings recorded.</td></tr>`;

            const topRank = data.standings?.length
                ? Math.min(...data.standings.map(s => s.rank ?? 999))
                : null;
            const topChampions = (data.standings || []).filter(s => s.rank === topRank);
            const champHtml = topChampions.length
                ? `<div class="sheet-section-title">${topChampions.length > 1 ? 'Champions (Tied)' : 'Champion'}</div>
                   <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900">
                       ${topChampions.map(c => `🏆 ${c.department_name}`).join(' &nbsp;·&nbsp; ')}
                   </div>`
                : '';

            return `
            <div class="sheet">
                <div class="sheet-header">
                    <div>
                        <h1>${t.name}</h1>
                        <div class="sub">${t.sport_name} · ${t.category || ''} · ${t.format || ''}</div>
                    </div>
                    <div class="sheet-badge">Finalized</div>
                </div>
                <div class="sheet-body">
                    ${champHtml}
                    <div class="sheet-note">Shared event — Junior &amp; Senior both appear. Same-division matches rank; cross-division = friendly.</div>

                    <div class="sheet-section-title">Final Standings</div>
                    <table class="sheet-table">
                        <thead><tr><th>Rank</th><th>Department</th><th>Medal</th><th>Points</th></tr></thead>
                        <tbody>${standingRows}</tbody>
                    </table>

                    <div class="sheet-section-title">All Matches (${data.totals?.total_matches ?? (data.matches || []).length})</div>
                    <table class="sheet-table">
                        <thead>
                            <tr><th>Round/#</th><th>Matchup</th><th>Score</th><th>Winner</th><th>Venue</th><th>Officer</th><th>Date</th></tr>
                        </thead>
                        <tbody>${matchRows}</tbody>
                    </table>

                    <div class="sheet-footer">
                        <span>Exported by ${data.exported_by || '—'}</span>
                        <span>Generated ${new Date(data.exported_at).toLocaleString('en-PH')}</span>
                    </div>
                </div>
            </div>`;
        }

        function downloadPdf(evt) {
            const sheet = document.querySelector('#sheet-host .sheet');
            if (!sheet) return;
            const btn = evt?.target?.closest('button');
            const originalHtml = btn ? btn.innerHTML : null;
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...'; }

            html2pdf()
                .set({
                    margin: 0.3,
                    filename: `${currentSheetTitle}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                })
                .from(sheet)
                .save()
                .finally(() => {
                    if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
                });
        }

        function downloadWord() {
            const sheet = document.querySelector('#sheet-host .sheet');
            if (!sheet) return;

            const preface = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
                  xmlns:w="urn:schemas-microsoft-com:office:word"
                  xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"><title>${currentSheetTitle}</title>
                <!--[if gte mso 9]>
                <xml><w:WordDocument><w:View>Print</w:View><w:Zoom>90</w:Zoom></w:WordDocument></xml>
                <![endif]-->
                <style>
                    body { font-family: Calibri, Arial, sans-serif; }
                    table { border-collapse: collapse; width: 100%; }
                    th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 12px; }
                    th { background: #f2f2f2; }
                </style></head><body>`;
            const postface = `</body></html>`;
            const html = preface + sheet.outerHTML + postface;

            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentSheetTitle}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
