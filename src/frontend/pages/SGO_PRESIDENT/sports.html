<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Sports</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../../css/sgo_president.css">
    <style>
        .sport-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .sport-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all .2s;
        }

        .sport-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-3px);
        }

        .sport-card.is-inactive {
            opacity: .55;
        }

        .sport-card-banner {
            padding: 20px 20px 14px;
            background: linear-gradient(135deg, rgba(139, 92, 246, .12), transparent);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sport-icon-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--gold);
            flex-shrink: 0;
        }

        .sport-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .sport-code {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1.5px;
        }

        .sport-card-body {
            padding: 16px 20px;
        }

        .sport-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .sport-stats {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .sport-stat-pill {
            background: var(--bg3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            flex: 1;
        }

        .sport-stat-val {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: var(--gold);
        }

        .sport-stat-lbl {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .sport-actions {
            display: flex;
            gap: 8px;
        }

        .icon-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .icon-choice {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text2);
            font-size: 14px;
        }

        .icon-choice.selected {
            border-color: var(--gold);
            background: var(--gold-bg);
            color: var(--gold);
        }

        /* Confirm modal tweaks */
        .confirm-modal .modal {
            max-width: 420px;
        }

        .confirm-modal .modal-body {
            text-align: center;
            padding: 28px 24px 12px;
        }

        .confirm-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .12);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px;
        }

        .confirm-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .confirm-text {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
            border: none;
        }

        .btn-danger:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center">
                <button class="burger-menu" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="topbar-title"><i class="fa-solid fa-medal"></i> Sports</div>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-sm" onclick="loadPage()">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh
                </button>
                <button class="btn btn-primary btn-sm" onclick="openCreate()">
                    <i class="fa-solid fa-plus"></i> New Sport
                </button>
            </div>
        </div>
        <div class="content">
            <div class="page-header">
                <div class="page-title">Sports</div>
                <div class="page-sub">Configure sports, scoring type (including winner-only for chess), and roster
                    limits</div>
            </div>
            <div class="sport-grid" id="sport-grid">
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
                    <div class="empty-text">Loading…</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create / Edit Sport Modal -->
    <div class="modal-overlay" id="modal-sport">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="sport-modal-title"><i class="fa-solid fa-medal"></i> New Sport</div>
                <button class="modal-close" onclick="Modal.close('modal-sport')"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="sp-edit-id">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Name *</label>
                        <input type="text" id="sp-name" class="form-input" placeholder="e.g. Chess">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Code *</label>
                        <input type="text" id="sp-code" class="form-input" placeholder="e.g. CHESS" maxlength="12"
                            style="text-transform:uppercase">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="sp-category" class="form-select">
                            <option value="team">Team</option>
                            <option value="individual">Individual</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Scoring Type</label>
                        <select id="sp-scoring" class="form-select" onchange="onScoringTypeChange()">
                            <option value="points">Points (running score)</option>
                            <option value="sets">Sets (best of X)</option>
                            <option value="binary">Winner only (no score — e.g. Chess)</option>
                            <option value="time">Time (lower/faster wins)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row" id="sp-sets-group" style="display:none">
                    <div class="form-group">
                        <label class="form-label">Sets to Win</label>
                        <select id="sp-sets-to-win" class="form-select">
                            <option value="2">Best of 3 (first to 2)</option>
                            <option value="3">Best of 5 (first to 3)</option>
                            <option value="4">Best of 7 (first to 4)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Min Players</label>
                        <input type="number" id="sp-min" class="form-input" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Players</label>
                        <input type="number" id="sp-max" class="form-input" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Team Size</label>
                        <input type="number" id="sp-team-size" class="form-input" min="1" value="1">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Icon (Font Awesome class)</label>
                    <input type="text" id="sp-icon" class="form-input" placeholder="e.g. fa-solid fa-chess">
                    <div class="icon-picker" id="sp-icon-picker"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="sp-desc" class="form-textarea" placeholder="Optional notes…"></textarea>
                </div>
                <div class="form-group" id="sp-active-group" style="display:none">
                    <label class="form-label">Status</label>
                    <select id="sp-active" class="form-select">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="Modal.close('modal-sport')">Cancel</button>
                <button class="btn btn-primary" id="sport-save-btn" onclick="saveSport()">Create</button>
            </div>
        </div>
    </div>

    <!-- Deactivate Confirmation Modal -->
    <div class="modal-overlay confirm-modal" id="modal-confirm-deactivate">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title"><i class="fa-solid fa-ban"></i> Deactivate Sport</div>
                <button class="modal-close" onclick="Modal.close('modal-confirm-deactivate')"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="confirm-icon"><i class="fa-solid fa-ban"></i></div>
                <div class="confirm-title">Deactivate this sport?</div>
                <div class="confirm-text">
                    The sport will be marked inactive and hidden from new tournaments.
                    Existing history and past results stay intact.
                </div>
                <input type="hidden" id="deactivate-sport-id">
            </div>
            <div class="modal-footer" style="justify-content:center; gap:10px">
                <button class="btn btn-secondary" onclick="Modal.close('modal-confirm-deactivate')">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDeactivate()">
                    <i class="fa-solid fa-ban"></i> Deactivate
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        let allSports = [];
        const ICON_CHOICES = [
            'fa-solid fa-basketball', 'fa-solid fa-futbol', 'fa-solid fa-volleyball',
            'fa-solid fa-table-tennis-paddle-ball', 'fa-solid fa-chess', 'fa-solid fa-person-running',
            'fa-solid fa-person-swimming', 'fa-solid fa-baseball', 'fa-solid fa-gamepad',
            'fa-solid fa-medal', 'fa-solid fa-dumbbell', 'fa-solid fa-flag-checkered',
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('sports');
            NotifBell?.init?.();
            buildIconPicker();
            await loadPage();
        });

        function buildIconPicker() {
            const el = document.getElementById('sp-icon-picker');
            el.innerHTML = ICON_CHOICES.map(ic =>
                `<div class="icon-choice" data-icon="${ic}" onclick="pickIcon('${ic}')"><i class="${ic}"></i></div>`
            ).join('');
        }

        function pickIcon(icon) {
            document.getElementById('sp-icon').value = icon;
            document.querySelectorAll('.icon-choice').forEach(el => {
                el.classList.toggle('selected', el.dataset.icon === icon);
            });
        }

        function onScoringTypeChange() {
            const type = document.getElementById('sp-scoring').value;
            document.getElementById('sp-sets-group').style.display = type === 'sets' ? '' : 'none';
        }

        function scoringLabel(s) {
            if (s.scoring_type === 'sets') return `Best of ${(s.sets_to_win || 2) * 2 - 1}`;
            if (s.scoring_type === 'binary') return 'Winner only';
            if (s.scoring_type === 'time') return 'Time';
            return 'Points';
        }

        function scoringIconClass(type) {
            if (type === 'sets') return 'fa-solid fa-layer-group';
            if (type === 'binary') return 'fa-solid fa-trophy';
            if (type === 'time') return 'fa-solid fa-stopwatch';
            return 'fa-solid fa-hashtag';
        }

        async function loadPage() {
            const res = await api('/sports');
            if (!res.success) return;
            allSports = res.data || [];
            renderGrid();
        }

        function renderGrid() {
            const el = document.getElementById('sport-grid');
            if (!allSports.length) {
                el.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
                <div class="empty-icon"><i class="fa-solid fa-medal"></i></div>
                <div class="empty-text">No sports yet. Click "New Sport" to add one.</div>
            </div>`;
                return;
            }
            el.innerHTML = allSports.map(s => {
                const iconCls = (s.icon && s.icon.startsWith('fa-')) ? s.icon : 'fa-solid fa-medal';
                return `
            <div class="sport-card ${s.is_active ? '' : 'is-inactive'}">
                <div class="sport-card-banner">
                    <div class="sport-icon-badge"><i class="${iconCls}"></i></div>
                    <div>
                        <div class="sport-name">${s.name}</div>
                        <div class="sport-code">${s.code}</div>
                    </div>
                </div>
                <div class="sport-card-body">
                    <div class="sport-meta-row">
                        <span style="text-transform:capitalize">${s.category || '—'}</span>
                        <span>${s.is_active ? 'Active' : 'Inactive'}</span>
                    </div>
                    <div class="sport-stats">
                        <div class="sport-stat-pill">
                            <div class="sport-stat-val"><i class="${scoringIconClass(s.scoring_type)}"></i></div>
                            <div class="sport-stat-lbl">${scoringLabel(s)}</div>
                        </div>
                        <div class="sport-stat-pill">
                            <div class="sport-stat-val">${s.min_players}-${s.max_players}</div>
                            <div class="sport-stat-lbl">Players</div>
                        </div>
                        <div class="sport-stat-pill">
                            <div class="sport-stat-val">${s.total_tournaments || 0}</div>
                            <div class="sport-stat-lbl">Tourneys</div>
                        </div>
                    </div>
                    <div class="sport-actions">
                        <button class="btn btn-primary btn-sm" style="flex:1" onclick="openEdit(${s.id})">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        ${s.is_active ? `<button class="btn btn-secondary btn-sm" onclick="deactivateSport(${s.id})"><i class="fa-solid fa-ban"></i></button>` : ''}
                    </div>
                </div>
            </div>`;
            }).join('');
        }

        function openCreate() {
            document.getElementById('sport-modal-title').innerHTML = '<i class="fa-solid fa-medal"></i> New Sport';
            document.getElementById('sport-save-btn').textContent = 'Create';
            document.getElementById('sp-edit-id').value = '';
            document.getElementById('sp-name').value = '';
            document.getElementById('sp-code').value = '';
            document.getElementById('sp-category').value = 'team';
            document.getElementById('sp-scoring').value = 'points';
            document.getElementById('sp-sets-to-win').value = '2';
            document.getElementById('sp-min').value = 1;
            document.getElementById('sp-max').value = 1;
            document.getElementById('sp-team-size').value = 1;
            document.getElementById('sp-icon').value = '';
            document.getElementById('sp-desc').value = '';
            document.getElementById('sp-active-group').style.display = 'none';
            document.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
            onScoringTypeChange();
            Modal.open('modal-sport');
        }

        function openEdit(id) {
            const s = allSports.find(x => x.id === id);
            if (!s) return;
            document.getElementById('sport-modal-title').innerHTML = `<i class="fa-solid fa-pen"></i> ${s.name}`;
            document.getElementById('sport-save-btn').textContent = 'Save Changes';
            document.getElementById('sp-edit-id').value = id;
            document.getElementById('sp-name').value = s.name;
            document.getElementById('sp-code').value = s.code;
            document.getElementById('sp-category').value = s.category === 'individual' ? 'individual' : 'team';
            document.getElementById('sp-scoring').value = s.scoring_type || 'points';
            document.getElementById('sp-sets-to-win').value = String(s.sets_to_win || 2);
            document.getElementById('sp-min').value = s.min_players || 1;
            document.getElementById('sp-max').value = s.max_players || 1;
            document.getElementById('sp-team-size').value = s.team_size || 1;
            document.getElementById('sp-icon').value = s.icon || '';
            document.getElementById('sp-desc').value = s.description || '';
            document.getElementById('sp-active').value = s.is_active ? '1' : '0';
            document.getElementById('sp-active-group').style.display = '';
            document.querySelectorAll('.icon-choice').forEach(el => {
                el.classList.toggle('selected', el.dataset.icon === s.icon);
            });
            onScoringTypeChange();
            Modal.open('modal-sport');
        }

        async function saveSport() {
            const id = document.getElementById('sp-edit-id').value;
            const name = document.getElementById('sp-name').value.trim();
            const code = document.getElementById('sp-code').value.trim();
            if (!name || !code) { Toast.show('Name and code are required', 'error'); return; }

            const scoring_type = document.getElementById('sp-scoring').value;
            const body = {
                name,
                code,
                category: document.getElementById('sp-category').value,
                scoring_type,
                sets_to_win: scoring_type === 'sets' ? (parseInt(document.getElementById('sp-sets-to-win').value) || 2) : null,
                min_players: parseInt(document.getElementById('sp-min').value) || 1,
                max_players: parseInt(document.getElementById('sp-max').value) || 1,
                team_size: parseInt(document.getElementById('sp-team-size').value) || 1,
                icon: document.getElementById('sp-icon').value.trim() || null,
                description: document.getElementById('sp-desc').value.trim() || null,
            };
            if (id) body.is_active = document.getElementById('sp-active').value;

            const res = id
                ? await api(`/sports/${id}`, { method: 'PUT', body })
                : await api('/sports', { method: 'POST', body });

            Toast.show(res.message || (res.success ? 'Saved!' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) { Modal.close('modal-sport'); await loadPage(); }
        }

        function deactivateSport(id) {
            document.getElementById('deactivate-sport-id').value = id;
            Modal.open('modal-confirm-deactivate');
        }

        async function confirmDeactivate() {
            const id = document.getElementById('deactivate-sport-id').value;
            if (!id) return;

            Modal.close('modal-confirm-deactivate');

            const res = await api(`/sports/${id}`, { method: 'DELETE' });
            Toast.show(res.message || (res.success ? 'Sport deactivated' : 'Error'), res.success ? 'success' : 'error');
            if (res.success) await loadPage();
        }
    </script>
</body>

</html>
