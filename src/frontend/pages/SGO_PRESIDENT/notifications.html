<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Notifications</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/sgo_president.css">
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
                <button class="burger-menu" onclick="toggleSidebar()" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title">
                    <i class="fa-solid fa-bell" style="margin-right:8px;color:var(--gold)"></i>
                    Notifications
                </div>
            </div>
            <div class="topbar-actions">
            </div>
        </div>

        <div class="content">
            <div class="page-header" style="margin-bottom:20px">
                <div>
                    <div class="page-title" style="font-size:22px">What needs your attention</div>
                    <div class="page-sub">Matches, teams, tournaments, and approvals across the whole sport fest</div>
                </div>
                <div style="display:flex;gap:10px">
                    <button class="btn btn-secondary btn-sm" id="notif-refresh-btn" type="button">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
            </div>

            <div class="card" style="margin-bottom:20px">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-list-check" style="margin-right:8px;color:var(--gold)"></i>
                        Notifications
                        <span id="notif-page-count" class="badge badge-muted" style="margin-left:8px">0</span>
                    </div>
                </div>
                <div class="card-body" style="padding:0">
                    <div id="notif-page-list" style="max-height:520px;overflow-y:auto">
                        <div class="notif-item empty"
                            style="padding:24px;color:var(--muted);text-align:center;font-size:13px">Loading…</div>
                    </div>
                </div>
            </div>

            <div class="card" style="max-width:640px">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-bullhorn" style="margin-right:8px;color:var(--gold)"></i>
                        Broadcast Announcement
                    </div>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea id="bc-message" class="form-textarea"
                            placeholder="e.g. All Basketball matches on Friday moved to Main Gym due to weather."></textarea>
                    </div>
                    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">
                        This will notify deans/advisers, officers, and visitors watching the sport fest.
                    </p>
                    <button class="btn btn-primary" onclick="sendBroadcast()">
                        <i class="fa-solid fa-paper-plane"></i> Send Announcement
                    </button>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap">
                <a href="/president/schedule" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-calendar-days"></i> View Full Schedule
                </a>
                <a href="/president/reports" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-file-lines"></i> View Recent Results in Reports
                </a>
            </div>
        </div>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/notification-engine.js"></script>
    <script src="../../js/sgo_president.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('sgo_president');
            renderSidebar('notifications');
            NotifBell.init();
            await loadNotificationsPage();
            document.getElementById('notif-refresh-btn')?.addEventListener('click', loadNotificationsPage);

            ['sf:notif', 'sf:live', 'sf:match', 'sf:leaderboard', 'sf:champion'].forEach(evt => {
                window.addEventListener(evt, () => loadNotificationsPage());
            });
        });

        async function loadNotificationsPage() {
            const listEl = document.getElementById('notif-page-list');
            const countEl = document.getElementById('notif-page-count');
            if (!listEl) return;

            const items = await NotificationEngine.list('sgo_president');
            countEl.textContent = items.length;

            if (!items.length) {
                listEl.innerHTML = `<div class="notif-item empty" style="padding:24px;color:var(--muted);text-align:center;font-size:13px">
                    You're all caught up — nothing needs attention right now.
                </div>`;
                return;
            }

            const colorFor = { critical: '#E8323B', warning: '#F5B800', live: '#22C55E', info: '#3B82F6', success: '#22C55E' };
            const labelFor = { critical: 'Needs attention', warning: 'Heads up', live: 'Live', info: 'Info', success: 'Good news' };

            listEl.innerHTML = items.map(n => `
                <div class="notif-item" data-notif-id="${n.id}" style="cursor:${n.link ? 'pointer' : 'default'}"
                     ${n.link ? `onclick="window.location.href='${n.link}'"` : ''}>
                    <div style="display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--border)">
                        <span style="font-size:20px;flex-shrink:0">${n.icon || '🔔'}</span>
                        <div style="flex:1;min-width:0">
                            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                                <strong style="color:${colorFor[n.severity] || 'var(--muted)'};font-size:14px">${n.title}</strong>
                                <span class="badge badge-muted" style="font-size:10px">${labelFor[n.severity] || ''}</span>
                            </div>
                            <div style="font-size:13px;color:var(--muted);margin-top:4px">${n.message}</div>
                        </div>
                        ${n.dismissible ? `<button type="button" data-dismiss="${n.id}" title="Dismiss" aria-label="Dismiss"
                            style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;flex-shrink:0">&times;</button>` : ''}
                    </div>
                </div>`).join('');

            listEl.querySelectorAll('[data-dismiss]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    NotificationEngine.dismiss(btn.dataset.dismiss);
                    loadNotificationsPage();
                });
            });
        }

        async function sendBroadcast() {
            const message = document.getElementById('bc-message').value.trim();
            if (!message) { Toast.show('Message cannot be empty', 'error'); return; }
            Toast.show('Announcement queued for broadcast: "' + message.slice(0, 60) + (message.length > 60 ? '…' : '') + '"', 'success');
            document.getElementById('bc-message').value = '';
        }
    </script>
</body>

</html>
