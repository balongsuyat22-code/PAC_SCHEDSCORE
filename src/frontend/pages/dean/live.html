<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAC SCHED-SCORE — Live Scores</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared.css">
    <link rel="stylesheet" href="../../css/dean.css">
    <style>
        .live-hero {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .pulse-ring {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .6;
                transform: scale(1.2);
            }
        }

        .live-match-card {
            background: linear-gradient(135deg, #0D1F0D, #0A1A0A);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .live-match-card:hover {
            border-color: rgba(34, 197, 94, 0.6);
        }

        .live-match-card.our-match {
            border-color: rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #0D0D1F, #0A0A1A);
        }

        .our-match-tag {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(99, 102, 241, 0.2);
            color: #818CF8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 3px 8px;
            border-radius: 20px;
        }

        .live-match-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .live-team-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .live-team-logo {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            overflow: hidden;
        }

        .live-team-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .live-team-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
        }

        .live-score-center {
            text-align: center;
        }

        .live-score-nums {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 68px;
            font-weight: 900;
            color: var(--gold);
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-score-dash {
            font-size: 28px;
            color: var(--muted);
        }

        .live-match-meta {
            display: flex;
            gap: 14px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .filter-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .filter-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--muted);
            transition: all .15s;
        }

        .filter-pill.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .filter-pill:hover:not(.active) {
            border-color: var(--border-gold);
            color: var(--text);
        }

        @media (max-width: 560px) {
            .live-match-card {
                padding: 18px 16px;
            }

            .live-match-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "teamA teamB"
                    "score score";
                gap: 12px;
            }

            .live-match-grid>.live-team-side:nth-child(1) {
                grid-area: teamA;
            }

            .live-match-grid>.live-team-side:nth-child(3) {
                grid-area: teamB;
            }

            .live-match-grid>.live-score-center {
                grid-area: score;
            }

            .live-team-logo {
                width: 46px;
                height: 46px;
                font-size: 16px;
            }

            .live-team-name {
                font-size: 15px;
            }

            .live-score-nums {
                font-size: 44px;
                justify-content: center;
            }

            .live-score-dash {
                font-size: 20px;
            }

            .live-hero {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
        }

        .section-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <main class="main">
        <div class="topbar">
            <div class="topbar-title" style="display:flex;align-items:center;gap:8px;">
                <span class="icon icon-md"><svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <circle cx="12" cy="12" r="3" />
                    </svg></span>
                Live Scores
            </div>
            <div class="topbar-actions">
                <span style="font-size:12px;color:var(--muted)" id="refresh-label">Auto-refresh: 10s</span>
                <button class="btn btn-secondary btn-sm" onclick="refresh()">Refresh Now</button>
            </div>
        </div>
        <div class="content">
            <div class="live-hero">
                <span class="pulse-ring"></span>
                <span style="font-weight:700;font-size:14px">Live Scoreboard</span>
                <span style="color:var(--muted);font-size:13px">— updates every 10 seconds</span>
                <span
                    style="margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--green)"
                    id="live-count">0 Live</span>
            </div>

            <div class="filter-pills">
                <div class="filter-pill active" onclick="setFilter('all',this)">All Games</div>
                <div class="filter-pill" onclick="setFilter('ours',this)">Our Matches</div>
            </div>

            <div class="filter-bar">
                <select id="f-sport" class="form-select filter-field" onchange="applyFilters()">
                    <option value="">All Sports</option>
                </select>
            </div>

            <div id="live-section">
                <div class="section-label" style="color:var(--green)">Currently Live</div>
                <div id="live-list"></div>
            </div>

            <div style="margin-top:24px" id="completed-section">
                <div class="section-label" style="color:var(--muted)">Completed Today</div>
                <div id="completed-list"></div>
            </div>

            <div style="margin-top:24px" id="upcoming-section">
                <div class="section-label" style="color:var(--muted)">Upcoming Today</div>
                <div id="upcoming-list"></div>
            </div>
        </div>
    </main>

    <script src="../../js/shared.js"></script>
    <script src="../../js/dean-sidebar.js"></script>
    <script>
        let allLive = [];
        let allScheduled = [];
        let activeFilter = 'all';
        let countdown = 10;
        let timer;
        const user = Auth.getUser();
        const deptId = user?.department_id;

        function isFFA(m) {
            const f = (m.tournament_format || '').toLowerCase();
            return f === 'free_for_all' || f === 'team_ranking';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth('dean_adviser');
            renderSidebar('live');
            const sRes = await api('/sports');
            document.getElementById('f-sport').innerHTML += (sRes.data || []).map(s =>
                '<option value="' + s.id + '">' + s.name + '</option>').join('');
            await refresh();
            startTimer();
        });

        function startTimer() {
            timer = setInterval(() => {
                countdown--;
                document.getElementById('refresh-label').textContent = 'Auto-refresh: ' + countdown + 's';
                if (countdown <= 0) { countdown = 10; refresh(); }
            }, 1000);
        }

        async function refresh() {
            countdown = 10;
            const [liveRes, schedRes] = await Promise.all([
                api('/matches/live'),
                api('/schedules/today'),
            ]);
            allLive = liveRes.data || [];
            allScheduled = schedRes.data || [];
            document.getElementById('live-count').textContent = allLive.length + ' Live';
            applyFilters();
        }

        function setFilter(f, el) {
            activeFilter = f;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const sport = document.getElementById('f-sport').value;
            let live = allLive;
            let sched = allScheduled;
            if (activeFilter === 'ours') {
                live = live.filter(m => m.participant_a_department_id == deptId || m.participant_b_department_id == deptId);
                sched = sched.filter(m => m.participant_a_department_id == deptId || m.participant_b_department_id == deptId);
            }
            if (sport) {
                live = live.filter(m => String(m.sport_id) === sport);
                sched = sched.filter(m => String(m.sport_id) === sport);
            }
            renderLive(live);
            renderCompleted(sched.filter(m => m.status === 'completed'));
            renderUpcoming(sched.filter(m => ['scheduled', 'pending'].includes(m.status)));
        }

        function isOurMatch(m) {
            return m.participant_a_department_id == deptId || m.participant_b_department_id == deptId;
        }

        function renderLive(matches) {
            const el = document.getElementById('live-list');
            if (!matches.length) {
                el.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:12px">No live matches right now</div>';
                return;
            }
            el.innerHTML = matches.map(m => buildLiveCard(m)).join('');
        }

        function renderCompleted(matches) {
            const el = document.getElementById('completed-list');
            if (!matches.length) {
                el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px 0">No completed matches yet today.</div>';
                return;
            }
            el.innerHTML = matches.map(m => buildCompactCard(m, false)).join('');
        }

        function renderUpcoming(matches) {
            const el = document.getElementById('upcoming-list');
            if (!matches.length) {
                el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px 0">No more matches scheduled today.</div>';
                return;
            }
            el.innerHTML = matches.map(m => buildCompactCard(m, true)).join('');
        }

        function buildLiveCard(m) {
            const ours = isOurMatch(m);
            if (isFFA(m)) {
                return '<div class="live-match-card ' + (ours ? 'our-match' : '') + '">' +
                    (ours ? '<span class="our-match-tag">OUR MATCH</span>' : '') +
                    '<div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px">' +
                    '<span class="pulse-ring"></span>LIVE · ' + (m.sport_name || '') + ' · ' + (m.tournament_name || '') + '</div>' +
                    '<div style="text-align:center;font-family:\'Barlow Condensed\',sans-serif;font-size:28px;font-weight:900;color:var(--gold)">FFA EVENT</div>' +
                    '<div class="live-match-meta">' + (m.venue_name ? '<span>' + m.venue_name + '</span>' : '') + '</div></div>';
            }
            const initA = (m.dept_a || m.dept_a_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const initB = (m.dept_b || m.dept_b_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const nameA = m.dept_a || m.dept_a_name || 'TBD';
            const nameB = m.dept_b || m.dept_b_name || 'TBD';
            const scoreA = m.live_score_a ?? m.total_score_a ?? 0;
            const scoreB = m.live_score_b ?? m.total_score_b ?? 0;
            return '<div class="live-match-card ' + (ours ? 'our-match' : '') + '">' +
                (ours ? '<span class="our-match-tag">OUR MATCH</span>' : '') +
                '<div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px">' +
                '<span class="pulse-ring"></span>LIVE · ' + (m.sport_name || '') + ' · ' + (m.tournament_name || '') + '</div>' +
                '<div class="live-match-grid">' +
                '<div class="live-team-side"><div class="live-team-logo" style="background:' + (m.dept_a_color || '#555') + '">' + initA + '</div>' +
                '<div class="live-team-name" style="' + (ours && m.participant_a_department_id == deptId ? 'color:#818CF8' : '') + '">' + nameA + '</div></div>' +
                '<div class="live-score-center"><div class="live-score-nums"><span>' + scoreA + '</span><span class="live-score-dash">–</span><span>' + scoreB + '</span></div>' +
                '<div style="font-size:11px;color:var(--muted);margin-top:4px">LIVE SCORE</div></div>' +
                '<div class="live-team-side"><div class="live-team-logo" style="background:' + (m.dept_b_color || '#555') + '">' + initB + '</div>' +
                '<div class="live-team-name" style="' + (ours && m.participant_b_department_id == deptId ? 'color:#818CF8' : '') + '">' + nameB + '</div></div>' +
                '</div><div class="live-match-meta">' +
                (m.venue_name ? '<span>' + m.venue_name + '</span>' : '') +
                (m.started_at ? '<span>Started ' + new Date(m.started_at).toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' }) + '</span>' : '') +
                (m.bracket_position ? '<span>' + m.bracket_position + '</span>' : '') +
                '</div></div>';
        }

        function buildCompactCard(m, upcoming) {
            const ours = isOurMatch(m);
            if (isFFA(m)) {
                return '<div class="vs-card ' + (ours ? 'is-our-match' : '') + '" style="margin-bottom:10px">' +
                    '<div style="flex:1;text-align:center"><div style="font-weight:700;color:var(--gold)">FFA Event</div>' +
                    '<div style="font-size:11px;color:var(--muted);margin-top:4px">' + (m.sport_name || '') + ' · ' + (m.tournament_name || '') + '</div></div>' +
                    statusBadge(m.status) + '</div>';
            }
            const nameA = m.dept_a || m.dept_a_name || 'TBD';
            const nameB = m.dept_b || m.dept_b_name || 'TBD';
            const initA = nameA.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const initB = nameB.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
            const scoreHtml = !upcoming && (m.final_score_display || m.total_score_a != null)
                ? '<div class="vs-score-big">' + (m.final_score_display || (m.total_score_a + '–' + m.total_score_b)) + '</div>'
                : '<div class="vs-label">VS</div><div style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:900;color:var(--gold);margin-top:4px">' + (formatTime(m.scheduled_time) || 'TBD') + '</div>';
            return '<div class="vs-card ' + (ours ? 'is-our-match' : '') + '" style="margin-bottom:10px">' +
                '<div class="vs-dept-side"><div class="vs-dept-logo" style="background:' + (m.dept_a_color || '#555') + '">' + initA + '</div>' +
                '<div class="vs-dept-name" style="' + (ours && m.participant_a_department_id == deptId ? 'color:#818CF8' : '') + '">' + nameA + '</div></div>' +
                '<div class="vs-score-center">' + scoreHtml +
                '<div style="font-size:11px;color:var(--muted);margin-top:6px">' + (m.sport_name || '') + ' · ' + (m.tournament_name || '') + '</div></div>' +
                '<div class="vs-dept-side"><div class="vs-dept-logo" style="background:' + (m.dept_b_color || '#555') + '">' + initB + '</div>' +
                '<div class="vs-dept-name" style="' + (ours && m.participant_b_department_id == deptId ? 'color:#818CF8' : '') + '">' + nameB + '</div></div>' +
                '<div>' + statusBadge(m.status) + '</div></div>';
        }
    </script>
</body>

</html>
