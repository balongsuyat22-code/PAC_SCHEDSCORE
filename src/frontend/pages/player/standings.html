<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings · PAC SCHED-SCORE</title>
    <link rel="stylesheet" href="../css/player.css">
    <style>
        .app-layout {
            display: flex;
            min-height: 100vh
        }

        .main-wrapper {
            flex: 1;
            margin-left: 220px;
            transition: margin-left .3s;
            min-width: 0
        }

        .main-wrapper.sidebar-collapsed {
            margin-left: 60px
        }


        .lb-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            align-items: start
        }

        .lb-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden
        }

        .lb-card-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg3)
        }

        .lb-card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .lb-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
            transition: background var(--transition);
        }

        .lb-row:last-child {
            border-bottom: none
        }

        .lb-row.top-3 {
            background: rgba(245, 184, 0, .03)
        }

        .lb-rank {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            width: 34px;
            text-align: center;
            flex-shrink: 0
        }

        .r1 {
            color: #FFD700
        }

        .r2 {
            color: #C0C0C0
        }

        .r3 {
            color: #CD7F32
        }

        .lb-colorbar {
            width: 5px;
            height: 38px;
            border-radius: 3px;
            flex-shrink: 0
        }

        .lb-info {
            flex: 1;
            min-width: 0
        }

        .lb-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .lb-medals {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px
        }

        .lb-bar {
            height: 4px;
            background: var(--bg4);
            border-radius: 2px;
            margin-top: 7px;
            overflow: hidden
        }

        .lb-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .6s ease
        }

        .lb-pts {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 26px;
            color: var(--gold);
            min-width: 52px;
            text-align: right
        }

        .aside-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 16px
        }

        .aside-head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            letter-spacing: 1.5px;
            background: var(--bg3)
        }

        .medal-grid-header {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 16px;
            padding: 7px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: var(--bg3)
        }

        .medal-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 16px;
            align-items: center;
            padding: 9px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .04);
        }

        .medal-sec {
            font-size: 13px;
            font-weight: 500;
        }

        .medal-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18px;
            text-align: center
        }

        @media(max-width:900px) {
            .main-wrapper {
                margin-left: 0 !important
            }

            .lb-layout {
                grid-template-columns: 1fr
            }

            .page-content {
                padding: 20px 16px
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-wrapper" id="main-wrapper">

            <nav class="topbar" id="topbar"></nav>

            <main class="page-content">
                <div class="page-header">
                    <div class="page-header__titles">
                        <div class="page-header__eyebrow">SportFest 2025</div>
                        <h1 class="page-header__title">Standings</h1>
                        <p class="page-header__subtitle">Section rankings, medal tally &amp; Quick stats</p>
                    </div>
                </div>

                <div class="lb-layout">
                    <div>
                        <div class="lb-card">
                            <div class="lb-card-head">
                                <div class="lb-card-title">🏆 Overall Rankings</div>
                            </div>
                            <div id="lb-rows"></div>
                        </div>
                    </div>
                    <div>
                        <div class="aside-card">
                            <div class="aside-head">🥇 Medal Tally</div>
                            <div class="medal-grid-header">
                                <span>Section</span><span>🥇</span><span>🥈</span><span>🥉</span>
                            </div>
                            <div id="medal-tally"></div>
                        </div>
                        <div class="aside-card">
                            <div class="aside-head">📈 Quick Stats</div>
                            <div class="aside-body" id="quick-stats" style="padding: 14px 16px;"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/player.js"></script>
    <script src="../js/player-sidebar.js"></script>
    <script>
        let lb = [];

        async function init() {
            await initPlayerLayout('standings');

            try {
                const lbRes = await apiFetch('/leaderboard');
                if (lbRes.success) lb = lbRes.data;
            } catch (err) {
                console.error(err);
            }

            renderStandings();
            renderQuickStats();
        }

        function renderStandings() {
            const data = lb;
            const el = document.getElementById('lb-rows');
            if (!data.length) {
                el.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted);">No standings data available yet.</div>';
                return;
            }

            const maxP = Math.max(...data.map(d => d.total_points), 1);
            el.innerHTML = data.map((d, i) => `
                <div class="lb-row fu ${i < 3 ? 'top-3' : ''}" style="animation-delay:${i * 0.04}s">
                    <div class="lb-rank ${['r1', 'r2', 'r3'][i] || ''}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
                    <div class="lb-colorbar" style="background:${d.color || '#555'}"></div>
                    <div class="lb-info">
                        <div class="lb-name">${d.name}</div>
                        <div class="lb-medals">🥇 ${d.gold_medals} &nbsp; 🥈 ${d.silver_medals} &nbsp; 🥉 ${d.bronze_medals}</div>
                        <div class="lb-bar"><div class="lb-bar-fill" style="width:${(d.total_points / maxP * 100).toFixed(1)}%;background:${d.color || '#555'}"></div></div>
                    </div>
                    <div class="lb-pts">${d.total_points}</div>
                </div>
            `).join('');

            document.getElementById('medal-tally').innerHTML = data.slice(0, 8).map(d => `
                <div class="medal-row">
                    <div class="medal-sec">
                        <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${d.color || '#555'};margin-right:6px;vertical-align:middle"></span>${d.code || d.name.substring(0, 4)}
                    </div>
                    <div class="medal-num" style="color:#FFD700">${d.gold_medals}</div>
                    <div class="medal-num" style="color:#C0C0C0">${d.silver_medals}</div>
                    <div class="medal-num" style="color:#CD7F32">${d.bronze_medals}</div>
                </div>
            `).join('');
        }

        function renderQuickStats() {
            const el = document.getElementById('quick-stats');
            const total = lb.reduce((s, d) => s + d.total_points, 0);
            const totalM = lb.reduce((s, d) => s + d.gold_medals + d.silver_medals + d.bronze_medals, 0);
            const topSec = lb[0];

            el.innerHTML = `
                <div style="display:flex;flex-direction:column;gap:12px">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-size:13px;color:var(--text2)">Total Points Issued</span>
                        <span style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold)">${total}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-size:13px;color:var(--text2)">Medals Awarded</span>
                        <span style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold)">${totalM}</span>
                    </div>
                    ${topSec ? `<div style="display:flex;justify-content:space-between;align-items:center">
                        <span style="font-size:13px;color:var(--text2)">Current Leader</span>
                        <span style="font-size:13px;font-weight:700;color:var(--text)">${topSec.name}</span>
                    </div>` : ''}
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
