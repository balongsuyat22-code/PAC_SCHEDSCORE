<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registration — PAC SCHED-SCORE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            padding: 24px 16px 60px;
            min-height: 100vh;
            box-sizing: border-box
        }

        .reg-wrap {
            width: 100%;
            max-width: 560px
        }

        .reg-header {
            text-align: center;
            margin-bottom: 24px
        }

        .reg-dept-badge {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 22px;
            overflow: hidden
        }

        .reg-dept-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .reg-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: .5px
        }

        .reg-subtitle {
            color: var(--muted);
            font-size: 13.5px;
            margin-top: 4px
        }

        .reg-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px
        }

        .chip-select {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .chip {
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            user-select: none
        }

        .chip:hover {
            border-color: var(--gold)
        }

        .chip.chip-active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold)
        }

        .chip-hint {
            color: var(--muted);
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            font-size: 12px
        }

        .team-option {
            border: 1px solid var(--border);
            background: var(--bg3);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 13px
        }

        .team-option.selected {
            border-color: var(--gold);
            background: rgba(212, 175, 55, .08)
        }

        .team-option.full {
            opacity: .45;
            cursor: not-allowed
        }

        .team-slots {
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 600
        }

        .success-screen {
            text-align: center;
            padding: 30px 10px
        }

        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(74, 222, 128, .12);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 30px;
            font-weight: 900
        }

        .error-screen {
            text-align: center;
            padding: 40px 10px;
            color: var(--muted)
        }
    </style>
</head>

<body>
    <div class="reg-wrap">
        <div class="reg-header">
            <div id="dept-badge" class="reg-dept-badge" style="background:var(--bg3);border:2px dashed var(--border)">
            </div>
            <div class="reg-title" id="dept-title">Player Registration</div>
            <div class="reg-subtitle" id="dept-subtitle">Loading...</div>
        </div>

        <div class="reg-card" id="reg-card">
            <div class="empty-text" style="text-align:center;color:var(--muted)">Loading registration form...</div>
        </div>
    </div>

    <script src="../../js/shared.js"></script>
    <script>
        // Public, no-login page. Do NOT call Auth.requireAuth() here — anyone with the link can open this.
        const params = new URLSearchParams(window.location.search);
        const deptId = parseInt(params.get('dept')) || null;

        let department = null;
        let allSports = [];
        let selectedSportIds = [];
        let teamsForSport = [];
        let selectedTeamId = null;
        let registeredSportIds = [];   // sports this player has already successfully joined this session
        let lastIdentity = null;       // {first_name,last_name,gender,image_url} — reused for "Add Another Sport"

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            if (!deptId) return showError('This registration link is missing a department. Please ask your department adviser for the correct link.');

            try {
                const [dRes, sRes] = await Promise.all([api(`/departments/${deptId}`), api('/sports')]);
                if (!dRes.success || !dRes.data) return showError('This registration link is invalid. Please check with your department adviser.');
                department = dRes.data;
                if (department.is_active === 0 || department.is_active === false) {
                    return showError('Registration for this department is currently closed.');
                }
                allSports = sRes.data || [];
            } catch (e) {
                return showError('Could not load the registration form. Please check your connection and try again.');
            }

            document.getElementById('dept-title').textContent = `Join ${department.name}`;
            document.getElementById('dept-subtitle').textContent = 'Register yourself for a sport — your department adviser will review and approve it.';
            const badge = document.getElementById('dept-badge');
            badge.style.background = (department.color || '#3B82F6') + '20';
            badge.style.border = `2px solid ${(department.color || '#3B82F6')}60`;
            badge.innerHTML = department.logo_url
                ? `<img src="${department.logo_url}">`
                : `<span style="color:${department.color || '#3B82F6'}">${(department.short_name || department.code || department.name || '?').slice(0, 3).toUpperCase()}</span>`;

            renderForm();
        }

        function showError(msg) {
            document.getElementById('dept-subtitle').textContent = '';
            document.getElementById('reg-card').innerHTML = `<div class="error-screen">${msg}</div>`;
        }

        function renderForm() {
            document.getElementById('reg-card').innerHTML = `
${registeredSportIds.length ? `
<div style="background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12.5px">
<strong style="color:var(--green)">Already joined:</strong> ${registeredSportIds.map(id => allSports.find(s => s.id === id)?.name).filter(Boolean).join(', ')} — pick more sports below to add them, no need to retype your info.
</div>` : ''}
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px">
<div id="avatar-preview" style="width:80px;height:80px;border-radius:16px;background:var(--bg3);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer;overflow:hidden" onclick="document.getElementById('avatar-file').click()">?</div>
<input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="previewAvatar(this)">
<div style="display:flex;gap:8px;align-items:center;width:100%">
<input type="url" id="p-image-url" class="form-input" placeholder="Or paste a photo URL (optional)...">
</div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">First Name *</label><input type="text" id="p-first" class="form-input" placeholder="e.g. Juan"></div>
<div class="form-group"><label class="form-label">Last Name *</label><input type="text" id="p-last" class="form-input" placeholder="e.g. Dela Cruz"></div>
</div>
<div class="form-group"><label class="form-label">Gender *</label>
<select id="p-gender" class="form-select" onchange="onGenderOrSportChange()">
<option value="">Select...</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Sport(s) *  <span class="chip-hint">tap all the sports you want to join</span></label>
<div id="sport-chips" class="chip-select"></div>
</div>
<div class="form-group" id="team-group" style="display:none">
<label class="form-label">Join a Team <span class="chip-hint">optional — pick one, or skip and your adviser will place you later</span></label>
<div id="team-list"></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">Jersey # <span class="chip-hint">optional</span></label><input type="text" id="p-jersey" class="form-input" placeholder="e.g. 23"></div>
<div class="form-group"><label class="form-label">Position <span class="chip-hint">optional</span></label><input type="text" id="p-position" class="form-input" placeholder="e.g. Point Guard"></div>
</div>
<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submitRegistration()">Submit Registration</button>
`;
            if (lastIdentity) {
                document.getElementById('p-first').value = lastIdentity.first_name || '';
                document.getElementById('p-last').value = lastIdentity.last_name || '';
                document.getElementById('p-gender').value = lastIdentity.gender || '';
                document.getElementById('p-image-url').value = lastIdentity.image_url || '';
                if (lastIdentity.image_url) {
                    document.getElementById('avatar-preview').innerHTML = `<img src="${lastIdentity.image_url}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`;
                }
            }
            renderSportChips();
        }

        function renderSportChips() {
            document.getElementById('sport-chips').innerHTML = allSports.map(s => {
                const done = registeredSportIds.includes(s.id);
                if (done) return `<div class="chip" style="opacity:.45;cursor:default;text-decoration:line-through">${s.name} ✓</div>`;
                return `<div class="chip ${selectedSportIds.includes(s.id) ? 'chip-active' : ''}" onclick="toggleSport(${s.id})">${s.name}</div>`;
            }).join('') || '<span class="chip-hint">No sports are open for registration right now.</span>';
        }

        function toggleSport(sportId) {
            if (registeredSportIds.includes(sportId)) return; // already joined this sport, nothing to toggle
            const idx = selectedSportIds.indexOf(sportId);
            if (idx > -1) selectedSportIds.splice(idx, 1); else selectedSportIds.push(sportId);
            renderSportChips();
            onGenderOrSportChange();
        }

        async function onGenderOrSportChange() {
            const teamGroup = document.getElementById('team-group');
            selectedTeamId = null;
            // A team choice only makes sense when joining exactly one sport at a time.
            if (selectedSportIds.length !== 1) {
                teamGroup.style.display = 'none';
                return;
            }
            const gender = document.getElementById('p-gender').value;
            if (!gender) {
                teamGroup.style.display = 'none';
                return;
            }
            teamGroup.style.display = '';
            document.getElementById('team-list').innerHTML = '<span class="chip-hint">Loading teams...</span>';
            try {
                const res = await api(`/teams?department_id=${deptId}&sport_id=${selectedSportIds[0]}`);
                teamsForSport = (res.data || []).filter(t => {
                    const mapped = gender === 'Male' ? 'Men' : 'Women';
                    return t.gender === 'Mixed' || t.gender === mapped;
                });
                renderTeamList();
            } catch (e) {
                document.getElementById('team-list').innerHTML = '<span class="chip-hint">Could not load teams — you can still register without one.</span>';
            }
        }

        function renderTeamList() {
            const list = document.getElementById('team-list');
            if (!teamsForSport.length) {
                list.innerHTML = '<span class="chip-hint">No teams yet for this sport — register and your adviser will place you on one.</span>';
                return;
            }
            list.innerHTML = teamsForSport.map(t => {
                const max = t.sport_max_players;
                const count = t.approved_count || 0;
                const full = max != null && count >= max;
                const isSel = selectedTeamId === t.id;
                return `<div class="team-option ${isSel ? 'selected' : ''} ${full ? 'full' : ''}" onclick="${full ? '' : `pickTeam(${t.id})`}">
<span>${t.name} <span class="chip-hint">(${t.gender})</span></span>
<span class="team-slots">${full ? 'FULL' : (max != null ? `${count}/${max}` : `${count} joined`)}</span>
</div>`;
            }).join('');
        }

        function pickTeam(teamId) {
            selectedTeamId = selectedTeamId === teamId ? null : teamId;
            renderTeamList();
        }

        function previewAvatar(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('avatar-preview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:14px">` };
            reader.readAsDataURL(file);
        }

        async function submitRegistration() {
            const first = document.getElementById('p-first').value.trim();
            const last = document.getElementById('p-last').value.trim();
            const gender = document.getElementById('p-gender').value;
            const jersey = document.getElementById('p-jersey').value.trim() || null;
            const position = document.getElementById('p-position').value.trim() || null;
            const image_url = document.getElementById('p-image-url').value.trim() || null;

            if (!first || !last) return Toast.show('Please enter your first and last name.', 'error');
            if (!gender) return Toast.show('Please select your gender.', 'error');
            if (!selectedSportIds.length) return Toast.show('Please select at least one sport.', 'error');

            const body = {
                first_name: first, last_name: last, gender,
                sport_ids: selectedSportIds, team_id: selectedTeamId,
                jersey_number: jersey, position, image_url,
                department_id: deptId,
            };

            const btn = document.querySelector('#reg-card .btn-primary');
            if (btn) { btn.disabled = true; btn.textContent = 'Submitting...' }

            const res = await api('/players/public-register', { method: 'POST', body: JSON.stringify(body) });

            if (!res.success) {
                Toast.show(res.message || 'Registration failed. Please try again.', 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'Submit Registration' }
                return;
            }

            // Remember this player's info and which sports actually went through, so
            // "Add Another Sport" can skip retyping the name/gender/photo entirely.
            lastIdentity = { first_name: first, last_name: last, gender, image_url };
            const createdIds = (res.data?.created || []).map(c => c.sport_id);
            registeredSportIds = [...new Set([...registeredSportIds, ...createdIds])];

            const sportsLeft = allSports.some(s => !registeredSportIds.includes(s.id));

            document.getElementById('reg-card').innerHTML = `
<div class="success-screen">
<div class="success-icon">OK</div>
<div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900">You're registered!</div>
<div style="color:var(--muted);font-size:13.5px;margin-top:8px;max-width:380px;margin-left:auto;margin-right:auto">${res.message}</div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">
${sportsLeft ? `<button class="btn btn-primary" onclick="addAnotherSport()">+ Add Another Sport</button>` : ''}
<button class="btn btn-secondary" onclick="startOver()">Register a Different Player</button>
</div>
</div>`;
        }

        function addAnotherSport() {
            // Keep lastIdentity + registeredSportIds; just reset the sport/team pickers
            // so the same player can join more sports without retyping anything.
            selectedSportIds = [];
            selectedTeamId = null;
            renderForm();
        }

        function startOver() {
            selectedSportIds = [];
            selectedTeamId = null;
            registeredSportIds = [];
            lastIdentity = null;
            renderForm();
        }
    </script>
</body>

</html>
